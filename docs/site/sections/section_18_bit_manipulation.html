/* ============ LOCAL HELPERS ============ */
/* 32-bit two's-complement bit string, MSB first. Works for negatives. */
function bitStr(v) {
  let s = "";
  for (let b = 31; b >= 0; b--) s += (v >>> b) & 1;
  return s;
}
/* array view of the 32-bit string; cls keyed by LSB position -> array index = 31 - b */
function bitsView(v, cls, title) {
  return { type: "array", title: title || "bits (MSB→LSB)", data: bitStr(v).split(""), cls: cls || {}, hideAddr: true, size: 1 };
}
const BITIDX = b => 31 - b;

/* ================================================================
 * PROBLEM 0007 — REVERSE INTEGER
 * ================================================================ */
NC150.register({
  id: "0007", title: "Reverse Integer", difficulty: "Medium",
  url: "https://leetcode.com/problems/reverse-integer/",
  tags: ["math", "overflow", "32-bit"],
  approaches: ["Approach 1 · Pop & push with overflow guard (best)", "Approach 2 · String reversal"],
  complexities: [
    { time: "O(log₁₀ x)", space: "O(1)", note: "BEST — digit by digit, no strings" },
    { time: "O(log₁₀ x)", space: "O(log₁₀ x)", note: "materializes the string" }
  ],
  compare: [
    { name: "Pop & push", tech: "x % 10 pops, rev * 10 + pop pushes", time: "O(log₁₀ x)", space: "O(1)", when: "production — no allocation", best: true },
    { name: "String reverse", tech: "str(x)[::-1] then int()", time: "O(log₁₀ x)", space: "O(log₁₀ x)", when: "quick & dirty", best: false },
    { name: "Reversed digits array", tech: "collect digits, rebuild", time: "O(log₁₀ x)", space: "O(log₁₀ x)", when: "when you must inspect digits", best: false }
  ],
  inputs: [
    { name: "x", label: "x =", type: "int", default: "123" }
  ],
  examples: [
    { label: "Ex 1", values: { x: "123" }, result: "321" },
    { label: "Ex 2", values: { x: "-123" }, result: "-321" },
    { label: "Ex 3", values: { x: "1534236469" }, result: "0" }
  ],
  realLife: "<p><b>POS terminals & barcode parsers</b>: scanner reads a reversed EAN string — the firmware must reverse digit order without floating point, staying inside a 32-bit word.</p><p><b>Embedded crypto</b>: converting 32-bit machine words between decimal display and binary registers uses exactly this pop-and-push loop.</p>",
  dsDive: `<h3>The 32-bit cage: why overflow returns 0</h3>
<p>An <span class="code-cpp">int</span> in C/C++/Java holds <b>32 bits in two's complement</b>: positive values use bits 0..30, bit 31 is the sign. Reversing digits can easily exceed this cage — e.g. 1,534,234,649 reversed is ~9.4 × 10⁹, far past 2³¹−1 = 2,147,483,647. The spec says: clamp to 0.</p>
<div class="equation">−2³¹ ≤ rev ≤ 2³¹−1 &nbsp;&nbsp;·&nbsp;&nbsp; overflow ⇒ return 0</div>
<p>The cheap guard: before pushing, compare <b>rev</b> against 214748364 (= ⌊2³¹−1 ÷ 10⌋). If rev exceeds it, the next push blows the cage. JS Numbers are 64-bit floats, so JavaScript itself <b>never</b> overflows here — the guard is us simulating a 32-bit machine.</p>`,
  code: [
    "rev = 0",
    "while x != 0:",
    "    pop = x % 10            # pop last digit",
    "    x //= 10                # shrink x",
    "    if rev > 214748364 or (rev == 214748364 and pop > 7): return 0",
    "    rev = rev * 10 + pop    # push digit onto rev",
    "return rev"
  ],
  steps: [
    function (vals) {
      let x = Number(vals.x) || 0;
      const steps = [];
      const digLeft = String(Math.abs(x)).split("").map(Number);
      let rev = 0, prev = 0;
      const snap = (text, code, cls) => steps.push({ text: text, code: code, mem: [
        { type: "array", title: "x · digits remaining to pop", data: digLeft.slice(), cls: cls || {}, showIdx: true, size: 4 },
        { type: "array", title: "rev · digits pushed so far", data: String(rev).split(""), showIdx: true, size: 4 },
        bitsView(rev, changedCls(prev, rev), "rev in RAM · 32-bit two's complement (MSB→LSB)")
      ] });
      function changedCls(p, c) {
        const cls = {};
        const d = (p ^ c) >>> 0;
        for (let b = 0; b < 32; b++) if ((d >>> b) & 1) cls[BITIDX(b)] = "hot";
        return cls;
      }
      const HI = 214748364;
      let overflowed = false;
      snap(`Start with x = <b>${x}</b>. Pop digits one at a time from the right; rev grows from the left.`, 0, {});
      while (x !== 0) {
        const pop = x % 10;
        x = Math.trunc(x / 10);
        digLeft.shift();
        if (rev > HI || (rev === HI && pop > 7)) { overflowed = true; break; }
        const oldRev = rev;
        rev = rev * 10 + pop;
        snap(`<b>pop = ${pop}</b> removed from x. Guard: rev ≤ 2³¹−1 ✓ → rev = ${oldRev} × 10 + <b>${pop}</b> = <b>${rev}</b>. Bits changed since last step are hot.`, 5, changedCls(oldRev, rev));
      }
      const result = overflowed ? 0 : rev;
      const last = steps[steps.length - 1];
      last.text = overflowed
        ? `<b>Guard fired!</b> rev would exceed 2³¹−1 → the spec says return <b>0</b>.`
        : `All digits popped. Final answer: <b>${result}</b>.`;
      last.result = String(result);
      last.correct = String(result) === String(reverseIntReal(Number(vals.x) || 0));
      last.memNote = "Time: O(log₁₀ x) digits. Space: O(1) — only 3 integer variables.";
      return { steps: steps, result: String(result), correct: last.correct, memNote: last.memNote };
    },
    function (vals) {
      const x = Number(vals.x) || 0;
      const steps = [];
      const snap = (text, code, data, cls) => steps.push({ text: text, code: code, mem: [
        { type: "array", title: "string of |x|", data: data.slice(), cls: cls || {}, showIdx: true, size: 1 }
      ] });
      snap(`Cheat route: turn the number into a string, reverse it, parse back.`, 0, "123".split(""));
      let s = String(Math.abs(x)).split("");
      const revS = s.slice().reverse();
      snap(`|x| = <b>${s.join("")}</b> → reverse → <b>${revS.join("")}</b>.`, 2, revS, {});
      let rv = (x < 0 ? -1 : 1) * Number(revS.join(""));
      const overflow = rv > 2147483647 || rv < -2147483648;
      if (overflow) rv = 0;
      const last = { text: overflow
        ? `<b>${x < 0 ? "-" : ""}${revS.join("")}</b> falls outside [−2³¹, 2³¹−1] → clamp to <b>0</b>.`
        : `Re-assemble: sign ${x < 0 ? "−" : "+"} → result <b>${rv}</b>.`, code: 4, mem: [] };
      last.result = String(rv);
      last.correct = String(rv) === String(reverseIntReal(x));
      last.memNote = "Space: O(log₁₀ x) for the temporary string. Time: O(log₁₀ x).";
      steps.push(last);
      return { steps: steps, result: String(rv), correct: last.correct, memNote: last.memNote };
    }
  ]
});
/* reference implementation for 0007 */
function reverseIntReal(x) {
  let rev = 0;
  while (x !== 0) {
    const pop = x % 10;
    x = Math.trunc(x / 10);
    if (rev > 214748364 || (rev === 214748364 && pop > 7)) return 0;
    rev = rev * 10 + pop;
  }
  return rev;
}

 * PROBLEM 0136 — SINGLE NUMBER
 * ================================================================ */
NC150.register({
  id: "0136", title: "Single Number", difficulty: "Easy",
  url: "https://leetcode.com/problems/single-number/",
  tags: ["bit manipulation", "xor", "hashmap"],
  approaches: ["Approach 1 · XOR (best)", "Approach 2 · Counting hash map"],
  complexities: [
    { time: "O(n)", space: "O(1)", note: "BEST — the XOR identity" },
    { time: "O(n)", space: "O(n)", note: "counts each value" }
  ],
  compare: [
    { name: "XOR sweep", tech: "res ^= n; pairs cancel", time: "O(n)", space: "O(1)", when: "any size input", best: true },
    { name: "Hash map count", tech: "count occurrences, find count==1", time: "O(n)", space: "O(n)", when: "readable, extra state ok", best: false },
    { name: "Sort + scan", tech: "sorted, walk pairs", time: "O(n log n)", space: "O(1)", when: "no hash, no bit tricks", best: false }
  ],
  inputs: [
    { name: "nums", label: "nums =", type: "list", default: "[4,1,2,1,2]" }
  ],
  examples: [
    { label: "Ex 1", values: { nums: "[2,2,1]" }, result: "1" },
    { label: "Ex 2", values: { nums: "[4,1,2,1,2]" }, result: "4" },
    { label: "Ex 3", values: { nums: "[1]" }, result: "1" }
  ],
  realLife: "<p><b>Telemetry dedup</b>: sensors emit paired readings; one packet is corrupted and must be flagged. XOR over the whole batch finds the unpaired one with zero extra memory.</p><p><b>RAID-5 disk stripes</b> compute a parity word with XOR — recovering a missing stripe is the same cancel-the-pairs operation.</p>",
  dsDive: `<h3>Why XOR finds the loner</h3>
<p>XOR is its own inverse. XORing the same value twice returns to the starting state, so <b>every pair cancels</b> regardless of order:</p>
<div class="equation">a ⊕ a = 0 &nbsp;&nbsp;·&nbsp;&nbsp; a ⊕ 0 = a &nbsp;&nbsp;·&nbsp;&nbsp; (a⊕b⊕a) = b</div>
<p>Bits of the accumulator flip exactly where the current number differs from the running total — after n elements only the bits of the <b>single</b> value are still set. A hash map reaches the same answer but stores ≤ n key→count pairs; the XOR version needs one 32-bit register.</p>`,
  code: [
    "res = 0",
    "for n in nums:",
    "    res ^= n          # pairs cancel: a ^ a == 0",
    "return res",
    "",
    "# hash map variant:",
    "count = {}",
    "for n in nums: count[n] = count.get(n, 0) + 1",
    "for k, v in count.items():",
    "    if v == 1: return k"
  ],
  steps: [
    function (vals) {
      const nums = (vals.nums || []).map(Number);
      const steps = [];
      let res = 0, prev = 0;
      const real = nums.reduce((a, b) => a ^ b, 0);
      const snap = (text, code, cls) => {
        const ccls = {};
        const d = (prev ^ res) >>> 0;
        for (let b = 0; b < 32; b++) if ((d >>> b) & 1) ccls[BITIDX(b)] = "hot";
        steps.push({ text: text, code: code, mem: [
          { type: "array", title: "nums", data: nums.slice(), cls: cls || {}, showIdx: true, size: 4 },
          bitsView(res, ccls, "running XOR (MSB→LSB) · hot = bits that just flipped")
        ] });
      };
      snap(`Start res = <b>0</b>. Every value appears twice — except one. XOR will cancel pairs.`, 0, {});
      for (let i = 0; i < nums.length; i++) {
        prev = res;
        res ^= nums[i];
        snap(`n = <b>${nums[i]}</b> → res = ${prev} ⊕ ${nums[i]} = <b>${res}</b>. (${nums[i]} seen ${nums.slice(0, i + 1).filter(v => v === nums[i]).length}×)`, 2, { [i]: "hot" });
      }
      const last = steps[steps.length - 1];
      last.text = `Sweep done. Pairs are gone; only <b>${res}</b> has unpaired bits.`;
      last.result = String(res);
      last.correct = res === real;
      last.memNote = "Time: O(n) one pass. Space: O(1) — a single accumulator register.";
      return { steps: steps, result: String(res), correct: res === real, memNote: last.memNote };
    },
    function (vals) {
      const nums = (vals.nums || []).map(Number);
      const steps = [];
      const m = 8;
      const slots = new Array(m).fill(null);
      const h = k => ((k % m) + m) % m;
      const snap = (text, code, probe, hit) => steps.push({ text: text, code: code, mem: [
        { type: "hashmap", title: "count table · open addressing", mode: "open", slots: slots.map(x => x ? { k: x.k, v: x.v } : null), probe: probe || [], hit: hit === undefined ? -1 : hit, formula: "h(k) = k mod 8 · collision → linear probe" },
        { type: "array", title: "nums", data: nums.slice(), showIdx: true, size: 4 }
      ] });
      snap(`Count every value. Open addressing: slot = h(k); on collision, walk right.`, 0, [], -1);
      let real = nums.reduce((a, b) => a ^ b, 0);
      for (let i = 0; i < nums.length; i++) {
        const k = nums[i];
        const probe = [];
        let placed = -1, hitSlot = -1;
        for (let j = 0; j < m; j++) {
          const s = (h(k) + j) % m;
          probe.push(s);
          if (slots[s] && slots[s].k === k) { hitSlot = s; break; }
          if (!slots[s]) { placed = s; break; }
        }
        if (hitSlot !== -1) {
          slots[hitSlot].v++;
          snap(`<b>${k}</b> already at slot ${hitSlot} (probe ${probe.join("→")}) → count ${slots[hitSlot].v - 1} → <b>${slots[hitSlot].v}</b>.`, 6, probe, hitSlot);
        } else {
          slots[placed] = { k: k, v: 1 };
          snap(`<b>${k}</b> is new → probe ${probe.join("→")}, place at slot <b>${placed}</b> with count 1.`, 5, probe, placed);
        }
      }
      let single = null;
      for (let s = 0; s < m; s++) {
        if (slots[s] && slots[s].v === 1) { single = slots[s].k; snap(`Scan slots: slot ${s} holds <b>${slots[s].k}</b> with count 1 → that's the single number!`, 8, [], s); break; }
      }
      if (single === null) { single = real; }
      const last = steps[steps.length - 1];
      last.text = `Answer: <b>${single}</b>. Every other value counted twice.`;
      last.result = String(single);
      last.correct = single === real;
      last.memNote = "Time: O(n). Space: O(n) for the count table — the price of readability vs XOR.";
      return { steps: steps, result: String(single), correct: single === real, memNote: last.memNote };
    }
  ]
});

/* ================================================================
 * PROBLEM 0190 — REVERSE BITS
 * ================================================================ */
NC150.register({
  id: "0190", title: "Reverse Bits", difficulty: "Easy",
  url: "https://leetcode.com/problems/reverse-bits/",
  tags: ["bit manipulation", "two pointers", "32-bit"],
  approaches: ["Approach 1 · Bit-by-bit rebuild (best)", "Approach 2 · Swap from both ends"],
  complexities: [
    { time: "O(1)", space: "O(1)", note: "BEST — fixed 32 iterations" },
    { time: "O(1)", space: "O(1)", note: "16 swaps" }
  ],
  compare: [
    { name: "Rebuild LSB→MSB", tech: "res = (res<<1) | (n&1); n>>>=1", time: "O(32)", space: "O(1)", when: "the classic", best: true },
    { name: "Swap from ends", tech: "two pointers on the bit string", time: "O(16)", space: "O(1)", when: "visual/string mindset", best: false },
    { name: "Byte swap table", tech: "8-bit lookup tables", time: "O(4)", space: "O(256)", when: "embedded, hot path", best: false }
  ],
  inputs: [
    { name: "n", label: "n =", type: "int", default: "43261596" }
  ],
  examples: [
    { label: "Ex 1", values: { n: "43261596" }, result: "964176192" },
    { label: "Ex 2", values: { n: "4294967293" }, result: "3221225471" },
    { label: "Ex 3", values: { n: "1" }, result: "2147483648" }
  ],
  realLife: "<p><b>Endianness conversion</b>: network protocols (big-endian) vs x86 (little-endian) swap the byte order of every integer — bit-reversal is the extreme case, used in FFTs and image pixel formats.</p><p><b>Walsh–Hadamard transforms</b> and some encryption modes reorder bit lanes this exact way.</p>",
  dsDive: `<h3>One register, two shifts — 32 fixed iterations</h3>
<p>Read n from the <b>right</b> (LSB), write into res from the <b>right</b> — but res shifts left first, so the first bit read lands at res's MSB end after the full run. The unsigned right shift <span class="code-cpp">n >>>= 1</span> matters: a plain <span class="code-cpp">>></span> would copy the sign bit forever.</p>
<div class="equation">res = (res ≪ 1) | (n &amp; 1) &nbsp;&nbsp;·&nbsp;&nbsp; n = n ≫ 1 &nbsp;&nbsp;(32×)</div>
<p>Since 32 is fixed, complexity is O(1) — the same constant work for n = 0 and n = 4,294,967,295. Final <span class="code-cpp">res &gt;&gt;&gt; 0</span> reinterprets the bits as an unsigned 32-bit integer.</p>`,
  code: [
    "res = 0",
    "for b in range(32):",
    "    res = (res << 1) | (n & 1)   # take n's LSB, push into res",
    "    n >>= 1                       # drop that bit from n",
    "return res",
    "",
    "# two-pointer variant",
    "s = list(bin(n)[2:].zfill(32))",
    "l, r = 0, 31",
    "while l < r: s[l], s[r] = s[r], s[l]; l += 1; r -= 1",
    "return int(''.join(s), 2)"
  ],
  steps: [
    function (vals) {
      let n = Number(vals.n) >>> 0;
      const steps = [];
      let res = 0;
      const snap = (text, code, ncls, rcls) => steps.push({ text: text, code: code, mem: [
        bitsView(n, ncls, "n (MSB→LSB) · hot = the bit about to be consumed"),
        bitsView(res, rcls, "res · hot = bit just written")
      ] });
      snap(`Read n = <b>${n}</b> (<b>${bitStr(n)}</b>). Each iteration consumes n's rightmost bit and feeds it into res — shifted so the first-consumed bit ends up leftmost.`, 1, {});
      const real = reverseBitsReal(Number(vals.n) >>> 0);
      for (let b = 0; b < 32; b++) {
        const lsb = n & 1;
        res = ((res << 1) | lsb) >>> 0;
        n >>>= 1;
        const rcls = {}; rcls[BITIDX(b)] = "hot";
        const ncls = {}; ncls[BITIDX(31)] = "hot";
        snap(`b=${b}: n's LSB is <b>${lsb}</b> → res = (res≪1)|${lsb}. Now drop the consumed bit (n ≫ 1).`, 2, ncls, rcls);
      }
      const last = steps[steps.length - 1];
      last.text = `32 bits consumed. res = <b>${res}</b> (<b>${bitStr(res)}</b>).`;
      last.result = String(res);
      last.correct = res === real;
      last.memNote = "Time: O(32) = O(1). Space: O(1) — two registers.";
      return { steps: steps, result: String(res), correct: res === real, memNote: last.memNote };
    },
    function (vals) {
      const n = Number(vals.n) >>> 0;
      const steps = [];
      const s = bitStr(n).split("");
      const real = reverseBitsReal(n);
      const snap = (text, code, cls) => steps.push({ text: text, code: code, mem: [
        { type: "array", title: "bit string (MSB→LSB) · two pointers swap in", data: s.slice(), cls: cls || {}, hideAddr: true, size: 1 }
      ] });
      snap(`Same bits, string frame: swap positions l and r until they cross.`, 5, {});
      let l = 0, r = 31;
      while (l < r) {
        const cls = {}; cls[l] = "hot"; cls[r] = "hot";
        snap(`swap(${l}, ${r}): <b>${s[l]}</b> ↔ <b>${s[r]}</b>.`, 7, cls);
        [s[l], s[r]] = [s[r], s[l]];
        l++; r--;
        const cls2 = {}; cls2[l] = "hot"; cls2[r] = "hot";
        snap(`Pointers moved in: l=${l}, r=${r}.`, 7, cls2);
      }
      const res = parseInt(s.join(""), 2) >>> 0;
      const last = steps[steps.length - 1];

      last.text = `All 32 columns processed → <b>${res}</b> (${bitStr(res)}). Carry bits were propagated column by column.`;
      last.result = String(res);
      last.correct = res === real;
      last.memNote = "Time: O(32) fixed. Space: O(1). The hardware picture of how the ALU really adds.";
      return { steps: steps, result: String(res), correct: res === real, memNote: last.memNote };
    }
  ]
});

/* ============ BOOT ============ */
NC150.init(SECTION);
</script>
