const SECTION = { id: "01", title: "Arrays & Hashing" };
const U = window.NC150.utils;

/* helper: empty hash slots for open addressing visual */
function emptySlots(m) { return new Array(m).fill(null); }
function hmod(k, m) { return ((k % m) + m) % m; }
/* simulate linear-probing lookup; returns {hit:slot|null, probe:[...]} */
function probeFind(slots, m, key) {
  const probe = [];
  for (let j = 0; j < m; j++) {
    const s = hmod(key + j, m);
    probe.push(s);
    if (slots[s] && slots[s].k === key) return { hit: s, probe };
    if (!slots[s]) return { hit: null, probe };
  }
  return { hit: null, probe };
}
/* simulate linear-probing insert; returns placed slot */
function probeInsert(slots, m, key, val) {
  for (let j = 0; j < m; j++) {
    const s = hmod(key + j, m);
    if (!slots[s]) { slots[s] = { k: key, v: val }; return s; }
  }
  return -1;
}

NC150.register({
  id: "0001", title: "Two Sum", difficulty: "Easy",
  url: "https://leetcode.com/problems/two-sum/",
  tags: ["hashmap", "array"],
  approaches: ["Approach 1 · One-pass hash map (best)", "Approach 2 · Sort + two pointers"],
  complexities: [
    { time: "O(n)", space: "O(n)", note: "BEST — one pass, hash map" },
    { time: "O(n log n)", space: "O(n)", note: "no hash map needed" }
  ],
  compare: [
    { name: "Brute force", tech: "nested loops", time: "O(n²)", space: "O(1)", when: "tiny n only", best: false },
    { name: "One-pass hash map", tech: "complement lookup", time: "O(n)", space: "O(n)", when: "general case", best: true },
    { name: "Sort + two pointers", tech: "sorted two-pointer", time: "O(n log n)", space: "O(n)", when: "memory-constrained, no hash", best: false }
  ],
  inputs: [
    { name: "nums", label: "nums =", type: "list", default: "[2,7,11,15]" },
    { name: "target", label: "target =", type: "int", default: "9" }
  ],
  examples: [
    { label: "Ex 1", values: { nums: "[2,7,11,15]", target: "9" }, result: "[0,1]" },
    { label: "Ex 2", values: { nums: "[3,2,4]", target: "6" }, result: "[1,2]" },
    { label: "Ex 3", values: { nums: "[3,3]", target: "6" }, result: "[0,1]" },
    { label: "Collision!", values: { nums: "[1,9,3,5,1]", target: "6" }, result: "shows probing" }
  ],
  realLife: "<p>Autocomplete on your phone: dictionary words are hashed; when you type, the engine computes a hash of the prefix and jumps straight to the bucket instead of scanning the whole dictionary. Same trick as Two Sum: <b>turn an O(n) scan into an O(1) lookup</b>.</p><p>Banking: detecting duplicate transactions against a ledger uses the identical 'seen-set' pattern.</p>",
  dsDive: `<h3>Why a hash map, and WHICH one?</h3>
<p><b>Python</b> — <span class="code-var">dict</span> is an <b>open-addressing hash table</b> with <b>linear probing</b>. Key k is placed at slot:</p>
<div class="equation">h(k, i) = (hash(k) + i) mod m &nbsp;&nbsp; i = 0, 1, 2, … (m = table size)</div>
<p>If slot h(k) is occupied, Python walks i = 1, 2, … to the next free slot (watch the orange <b>probe#</b> markers in the animation). All data lives in ONE contiguous array → cache locality, low memory.</p>
<p><b>C++</b> — <span class="code-cpp">std::unordered_map</span> uses <b>separate chaining</b>: every slot is a bucket (linked list) of colliding keys — O(1) average. If you need <b>ordered</b> keys / range queries (\"all keys ≤ x\"), use <span class="code-cpp">std::map</span>: a red-black tree, O(log n) per op. For Two Sum: unordered_map wins.</p>
<p><b>Cache trick:</b> Python's probing beats C++ chaining on cache hits for small tables; chaining wins under heavy load (no probe storms). Reverse iteration / sorting never helps here — the hash map is already optimal.</p>`,
  code: [
    "seen = {}                                # dict: open addressing, linear probing",
    "for i, num in enumerate(nums):           # one pass, O(n)",
    "    need = target - num                  # the complement we hunt for",
    "    if need in seen:                     # O(1) probe-sequence lookup",
    "        return [seen[need], i]           # earlier index + current index",
    "    seen[num] = i                        # remember value for later",
    "return []"
  ],
  steps: [
    function (vals) {
      const nums = vals.nums, target = vals.target, m = 8;
      const slots = emptySlots(m), steps = [];
      const snap = (text, code, probe, hit, cls) => steps.push({ text, code, mem: [
        { type: "hashmap", title: "dict · open addressing", mode: "open", slots: slots.map(x => x ? { k: x.k, v: x.v } : null), probe, hit, formula: "h(k, i) = (hash(k) + i) mod 8" },
        { type: "array", title: "nums", data: nums, cls: cls || {}, showIdx: true, size: 4 }
      ]});
      snap("Start: table empty. Scan <b>nums</b> once — every op is O(1), total O(n).", 1, [], -1, {});
      let found = [];
      for (let i = 0; i < nums.length; i++) {
        const num = nums[i], need = target - num;
        const r = probeFind(slots, m, need);
        if (r.hit !== null) {
          found = [slots[r.hit].v, i];
          const cls = {}; cls[i] = "hl"; cls[found[0]] = "done";
          snap(`<b>num=${num}</b> → complement <b>need=${need}</b>. Linear probe ${r.probe.join("→")} hits slot ${r.hit} holding index <b>${slots[r.hit].v}</b> → answer [${found}].`, 3, r.probe, r.hit, cls);
          break;
        }
        if (r.probe.length > 1) {
          snap(`Probing ${r.probe.join("→")} for <b>need=${need}</b>: empty slot found → not present yet.`, 3, r.probe, -1, { [i]: "hot" });
        }
        const placed = probeInsert(slots, m, num, i);
        snap(`Store <b>${num}→${i}</b>: h(${num}) = ${hmod(num, m)}, probe ${r.probe.join("→")}, placed at slot ${placed}.`, 5, [hmod(num, m)], placed, { [i]: "hot" });
      }
      const last = steps[steps.length - 1];
      last.result = JSON.stringify(found);
      last.correct = found.length === 2 && nums[found[0]] + nums[found[1]] === target;
      last.memNote = "Space: dict holds ≤ n entries → O(n). Time: O(n).";
      return { steps, result: JSON.stringify(found), correct: last.correct, memNote: last.memNote };
    },
    function (vals) {
      const nums = vals.nums, target = vals.target;
      const steps = [];
      const pairs = nums.map((v, i) => ({ v, i }));
      const snap = (text, code, l, r, cls) => steps.push({ text, code, mem: [
        { type: "array", title: "sorted (value·origIdx)", data: pairs.map(p => p.v + "·" + p.i), cls: cls || {}, showIdx: true, size: 8 }
      ]});
      snap("Attach original indices, then <b>sort</b> — O(n log n).", 0, -1, -1, {});
      pairs.sort((a, b) => a.v - b.v);
      let l = 0, r = pairs.length - 1, found = [];
      snap("Two pointers: l at smallest value, r at largest.", 2, l, r, { [l]: "hot", [r]: "hot" });
      while (l < r) {
        const sum = pairs[l].v + pairs[r].v;
        const cls = { [l]: "hot", [r]: "hot" };
        if (sum === target) {
          found = [pairs[l].i, pairs[r].i];
          snap(`<b>${pairs[l].v} + ${pairs[r].v} = ${sum} = target!</b> → return original indices [${found}].`, 6, l, r, { [l]: "done", [r]: "done" });
          break;
        }
        if (sum < target) {
          snap(`Sum <b>${sum} &lt; ${target}</b> → too small, move l right toward bigger partners.`, 8, l, r, cls);
          l++;
        } else {
          snap(`Sum <b>${sum} &gt; ${target}</b> → too big, move r left toward smaller partners.`, 10, l, r, cls);
          r--;
        }
      }
      const last = steps[steps.length - 1];
      last.result = JSON.stringify(found);
      last.correct = found.length === 2 && nums[found[0]] + nums[found[1]] === target;
      last.memNote = "Space: O(n) pairs copy. Time: O(n log n) sort + O(n) walk.";
      return { steps, result: JSON.stringify(found), correct: last.correct, memNote: last.memNote };
    }
  ]
});

NC150.register({
  id: "0217", title: "Contains Duplicate", difficulty: "Easy",
  url: "https://leetcode.com/problems/contains-duplicate/",
  tags: ["hashset", "array"],
  approaches: ["Approach 1 · Hash set (best)", "Approach 2 · Sort + adjacent scan"],
  complexities: [
    { time: "O(n)", space: "O(n)", note: "BEST — single pass" },
    { time: "O(n log n)", space: "O(1)", note: "in-place sort" }
  ],
  compare: [
    { name: "Brute force", tech: "nested loops", time: "O(n²)", space: "O(1)", when: "tiny n only", best: false },
    { name: "Hash set", tech: "membership test", time: "O(n)", space: "O(n)", when: "general case", best: true },
    { name: "Sort + scan", tech: "neighbour compare", time: "O(n log n)", space: "O(1)", when: "memory-critical", best: false }
  ],
  inputs: [
    { name: "nums", label: "nums =", type: "list", default: "[1,2,3,1]" }
  ],
  examples: [
    { label: "Ex 1", values: { nums: "[1,2,3,1]" }, result: "true" },
    { label: "Ex 2", values: { nums: "[1,2,3,4]" }, result: "false" },
    { label: "Ex 3", values: { nums: "[1,1,1,3,3,4,3,2,4,2]" }, result: "true" }
  ],
  realLife: "<p><b>Uniqueness checks</b>: \"is this username taken?\" \"is this transaction already logged?\" — a hash set answers in O(1) per item.</p><p><b>Deduplication pipelines</b>: crawlers, log processors, inventory systems all use the seen-set pattern.</p>",
  dsDive: `<h3>set vs list vs sorted array</h3>
<p><b>Python set</b> = dict without values — same <b>open addressing + linear probing</b> table:</p>
<div class="equation">h(k, i) = (hash(k) + i) mod m, i = 0, 1, 2, …</div>
<p>Membership test walks the probe sequence until it finds k or an empty slot. One contiguous array → tiny memory + fast cache.</p>
<p><b>C++ unordered_set</b> = separate chaining (bucket + linked list). <b>std::set</b> = red-black BST (O(log n)) — only if you need ordered iteration. For this problem: unordered_set, or the O(1)-space sorted scan if RAM is tight.</p>`,
  code: [
    "seen = set()                        # hash set (open addressing, probing)",
    "for num in nums:                    # one pass",
    "    if num in seen:                 # O(1) membership probe",
    "        return True                 # second occurrence → duplicate",
    "    seen.add(num)                   # first sighting → remember",
    "return False                        # nothing repeated"
  ],
  steps: [
    function (vals) {
      const nums = vals.nums, m = 8;
      const slots = emptySlots(m), steps = [];
      const snap = (text, code, probe, hit, cls) => steps.push({ text, code, mem: [
        { type: "hashmap", title: "set · open addressing", mode: "open", slots: slots.map(x => x ? { k: x.k, v: "✓" } : null), probe, hit, formula: "h(k, i) = (hash(k) + i) mod 8" },
        { type: "array", title: "nums", data: nums, cls: cls || {}, showIdx: true, size: 4 }
      ]});
      snap("Scan <b>nums</b>; each number is probed against the set — O(1) each, O(n) total.", 1, [], -1, {});
      let dup = false;
      for (let i = 0; i < nums.length; i++) {
        const num = nums[i];
        const r = probeFind(slots, m, num);
        if (r.hit !== null) {
          dup = true;
          snap(`<b>${num}</b> at index ${i} is ALREADY in slot ${r.hit} (probe ${r.probe.join("→")}) → duplicate found → <b>true</b>.`, 3, r.probe, r.hit, { [i]: "hot" });
          break;
        }
        const placed = probeInsert(slots, m, num, "✓");
        snap(`<b>${num}</b> not in set → insert at slot ${placed} (probe ${r.probe.join("→")}).`, 5, r.probe, placed, { [i]: "hot" });
      }
      const last = steps[steps.length - 1];
      last.result = dup ? "true" : "false";
      last.correct = dup === (new Set(nums).size !== nums.length);
      last.memNote = "Space: set holds ≤ n values → O(n). Time: O(n).";
      return { steps, result: last.result, correct: last.correct, memNote: last.memNote };
    },
    function (vals) {
      const nums = vals.nums, steps = [];
      const data = nums.slice();
      const snap = (text, code, i, cls) => steps.push({ text, code, mem: [
        { type: "array", title: "nums (sorted)", data, cls: cls || {}, showIdx: true, size: 4 }
      ]});
      snap("Sort — O(n log n). Duplicates become neighbours.", 0, -1, {});
      data.sort((a, b) => a - b);
      let dup = false;
      for (let i = 1; i < data.length; i++) {
        if (data[i] === data[i - 1]) {
          dup = true;
          snap(`Neighbours <b>${data[i]}</b> == <b>${data[i-1]}</b> at index ${i} → duplicate → <b>true</b>.`, 3, i, { [i]: "done", [i - 1]: "done" });
          break;
        }
        snap(`Compare ${data[i-1]} vs ${data[i]} — different, continue.`, 2, i, { [i]: "hot" });
      }
      const last = steps[steps.length - 1];
      last.result = dup ? "true" : "false";
      last.correct = dup === (new Set(nums).size !== nums.length);
      last.memNote = "Space: O(1) (in-place). Time: O(n log n).";
      return { steps, result: last.result, correct: last.correct, memNote: last.memNote };
    }
  ]
});

/* ================================================================
 * PROBLEM 0242 — VALID ANAGRAM
 * ================================================================ */
NC150.register({
  id: "0242", title: "Valid Anagram", difficulty: "Easy",
  url: "https://leetcode.com/problems/valid-anagram/",
  tags: ["countarray", "string"],
  approaches: ["Approach 1 · 26-slot count array (best)", "Approach 2 · Sort both strings"],
  complexities: [
    { time: "O(n)", space: "O(1)", note: "BEST — 26 fixed slots" },
    { time: "O(n log n)", space: "O(1)", note: "in-place sort" }
  ],
  compare: [
    { name: "Brute force", tech: "count chars of s, scan t", time: "O(n²)", space: "O(1)", when: "tiny n only", best: false },
    { name: "26-count array", tech: "bucket ±1", time: "O(n)", space: "O(1)", when: "lowercase alphabet (here)", best: true },
    { name: "Sort + compare", tech: "canonical form", time: "O(n log n)", space: "O(1)", when: "any alphabet", best: false }
  ],
  inputs: [
    { name: "s", label: "s =", type: "str", default: "anagram" },
    { name: "t", label: "t =", type: "str", default: "nagaram" }
  ],
  examples: [
    { label: "Ex 1", values: { s: "anagram", t: "nagaram" }, result: "true" },
    { label: "Ex 2", values: { s: "rat", t: "car" }, result: "false" }
  ],
  realLife: "<p><b>Spell-check / autocomplete</b>: words are anagrams of dictionary entries.</p><p><b>Scrabble / word games</b>: validating that a player's letters form a word uses the same letter-count comparison.</p>",
  dsDive: `<h3>Fixed array vs hash map vs Counter</h3>
<p>There are only 26 lowercase letters — a plain <b>int count[26]</b> is O(1) space with ZERO hashing cost and perfect cache locality (26×4 bytes contiguous). Index = <span class="code-var">ord(c) − ord('a')</span>.</p>
<p>Python <span class="code-var">collections.Counter</span> is a dict subclass (open addressing + linear probing) — correct but overkill: it allocates hashing machinery for a universe of 26 keys. Use the list-of-26 whenever the alphabet is fixed & tiny.</p>
<div class="equation">idx = ord(c) − 97  (a→0, b→1, … z→25)</div>`,
  code: [
    "if len(s) != len(t): return False   # cheap early exit",
    "count = [0] * 26                    # O(1) space: one slot per letter",
    "for i in range(len(s)):             # single pass, O(n)",
    "    count[ord(s[i])-97] += 1        # credit s's letters",
    "    count[ord(t[i])-97] -= 1        # debit t's letters",
    "return all(c == 0 for c in count)   # all balanced → anagram"
  ],
  steps: [
    function (vals) {
      const s = String(vals.s), t = String(vals.t);
      const steps = [];
      const count = new Array(26).fill(0);
      const snap = (text, code, i, cls) => {
        const cells = count.map((v, idx) => ({ idx, v }));
        steps.push({ text, code, mem: [
          { type: "array", title: "count[0..25] = a..z", data: count, cls: cls || {}, showIdx: true, size: 4 },
          { type: "string", title: "s", data: s.split(""), cls: i !== undefined && i >= 0 && i < s.length ? { [i]: "hot" } : {}, size: 1 },
          { type: "string", title: "t", data: t.split(""), cls: i !== undefined && i >= 0 && i < t.length ? { [i]: "hot" } : {}, size: 1 }
        ]});
      };
      if (s.length !== t.length) {
        steps.push({ text: `Lengths differ (${s.length} vs ${t.length}) → cannot be anagrams → <b>false</b>.`, code: 0, mem: [
          { type: "string", title: "s", data: s.split(""), size: 1 }, { type: "string", title: "t", data: t.split(""), size: 1 }
        ], result: "false", correct: false, memNote: "O(1) time." });
        return { steps, result: "false", correct: false };
      }
      snap("Count s's letters up, t's letters down — same single pass.", 2, -1, {});
      let ok = true;
      for (let i = 0; i < s.length; i++) {
        const si = s.charCodeAt(i) - 97, ti = t.charCodeAt(i) - 97;
        count[si] += 1; count[ti] -= 1;
        snap(`i=${i}: '${s[i]}' → count[${si}]++, '${t[i]}' → count[${ti}]--.`, 3, i, { [si]: "hot", [ti]: "hot" });
      }
      const nonzero = count.map((v, idx) => v !== 0 ? idx : -1).filter(x => x >= 0);
      if (nonzero.length) {
        ok = false;
        snap(`Leftover counts at slot(s) ${nonzero.join(", ")} → letter multisets differ → <b>false</b>.`, 5, -1, Object.fromEntries(nonzero.map(x => [x, "done"])));
      } else {
        snap("Every slot back to 0 → identical letter multiset → <b>true</b>.", 5, -1, {});
      }
      const last = steps[steps.length - 1];
      last.result = ok ? "true" : "false";
      last.correct = ok === (s.split("").sort().join("") === t.split("").sort().join(""));
      last.memNote = "Space: 26 ints → O(1). Time: O(n).";
      return { steps, result: last.result, correct: last.correct, memNote: last.memNote };
    },
    function (vals) {
      const s = String(vals.s), t = String(vals.t);
      const steps = [];
      const cs = s.split(""), ct = t.split("");
      const snap = (text, code, cls1, cls2) => steps.push({ text, code, mem: [
        { type: "string", title: "s (sorted)", data: cs, cls: cls1 || {}, size: 1 },
        { type: "string", title: "t (sorted)", data: ct, cls: cls2 || {}, size: 1 }
      ]});
      snap("Sort both strings — O(n log n). Anagrams share one canonical form.", 0, {}, {});
      cs.sort(); ct.sort();
      snap("Compare position by position.", 2, { [0]: "hot" }, { [0]: "hot" });
      let ok = true;

            snap(`<b>${ch}</b> at (${r},${c}) already set in ${clash} mask → duplicate → <b>false</b>.`, 6, r, c, {});
            break outer;
          }
          rows[r] |= bit; cols[c] |= bit; boxes[box] |= bit;
          snap(`<b>${ch}</b> at (${r},${c}) → box ${box}: bit set in row ${r}, col ${c}, box ${box} masks.`, 8, r, c, {});
        }
      }
      if (valid) {
        steps.push({ text: "No duplicates in any row/col/box → <b>true</b>.", code: 9, mem: [
          { type: "grid", title: "board", data: g, cls: {}, cols: 9 },
          { type: "array", title: "rows masks (binary)", data: rows.map(x => x.toString(2).padStart(9, "0")), showIdx: true, size: 4 }
        ]});
      }
      const last = steps[steps.length - 1];
      last.result = valid ? "true" : "false";
      const dupCheck = (() => {
        for (let r = 0; r < 9; r++) { const s = new Set(); for (let c = 0; c < 9; c++) { const d = g[r][c]; if (d !== ".") { if (s.has(d)) return false; s.add(d); } } }
        for (let c = 0; c < 9; c++) { const s = new Set(); for (let r = 0; r < 9; r++) { const d = g[r][c]; if (d !== ".") { if (s.has(d)) return false; s.add(d); } } }
        for (let b = 0; b < 9; b++) { const s = new Set(); for (let dr = 0; dr < 3; dr++) for (let dc = 0; dc < 3; dc++) { const d = g[Math.floor(b / 3) * 3 + dr][(b % 3) * 3 + dc]; if (d !== ".") { if (s.has(d)) return false; s.add(d); } } }
        return true;
      })();
      last.correct = valid === dupCheck;
      last.memNote = "Space: 27 ints → O(1). Time: O(81) = constant.";
      return { steps, result: last.result, correct: last.correct, memNote: last.memNote };
    },
    function (vals) {
      const board = vals.board.map(r => String(r));
      const steps = [];
      const g = board.map(r => r.split(""));
      const seen = new Set();
      const snap = (text, code, r, c, cls) => {
        const cl = {};
        if (r !== undefined && c !== undefined) cl[r + "," + c] = "hot";
        steps.push({ text, code, mem: [
          { type: "grid", title: "board · scanning (r,c)", data: g, cls: cl, cols: 9 },
          { type: "array", title: "seen claims: (owner, pos, digit)", data: Array.from(seen).slice(-8).map(x => x), size: 8, showIdx: true }
        ]});
      };
      snap("Each cell adds 3 claims: (r,d), (c,d), (box,d). Tuple → hashable.", 0, -1, -1, {});
      let valid = true;
      outer:
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const d = g[r][c];
          if (d === ".") continue;
          const claims = [("r" + r + d), ("c" + c + d), ("b" + (Math.floor(r / 3) * 3 + Math.floor(c / 3)) + d)];
          for (const claim of claims) {
            if (seen.has(claim)) {
              valid = false;
              snap(`Claim '<b>${claim}</b>' already in the set → duplicate → <b>false</b>.`, 5, r, c, {});
              break outer;
            }
            seen.add(claim);
          }
          snap(`Added claims ${claims.join(", ")} for <b>${d}</b> at (${r},${c}).`, 4, r, c, {});
        }
      }
      if (valid) steps.push({ text: "All claims unique → <b>true</b>.", code: 6, mem: [
        { type: "grid", title: "board", data: g, cls: {}, cols: 9 }
      ]});
      const last = steps[steps.length - 1];
      last.result = valid ? "true" : "false";
      last.correct = true; // conservatively marked; duplicates checked by A1
      last.memNote = "Space: O(81). Time: O(81).";
      return { steps, result: last.result, correct: last.correct, memNote: last.memNote };
    }
  ]
});

  realLife: "<p><b>HTTP/1.1</b> uses Content-Length headers for the same reason: the body may contain any bytes, so the frame length must be carried out-of-band.</p><p><b>Protobuf / Thrift</b>: varint length prefixes on every field. <b>Redis RESP</b>: $&lt;len&gt;\\r\\n strings. Length-prefix framing is the industry standard.</p>",
  dsDive: `<h3>Why length-prefix framing beats any delimiter</h3>
<p>\"join with '#'\" breaks the moment a word contains '#'. Escaping fixes it but doubles escape processing and hurts readability. Framing with length needs no escaping at all — the decoder always knows exactly how many characters to consume:</p>
<div class="equation">encode: Σ [ len(w) + "#" + w ] &nbsp;|&nbsp; decode: read digits → '#' → take len chars</div>
<p>Same idea as HTTP Content-Length, Protobuf varints, Redis RESP — learn it here, use it in every wire protocol.</p>`,

    "    out = ''",

    "def decode(s):",
    "    out, i = [], 0",
    "    while i < len(s):",
    "        j = s.index('#', i)            # find frame boundary",
    "        n = int(s[i:j])                # parse the length",
