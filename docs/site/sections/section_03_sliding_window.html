/* ================================================================
 * PROBLEM 0003 — LONGEST SUBSTRING WITHOUT REPEATING CHARACTERS
 * ================================================================ */
NC150.register({
  id: "0003", title: "Longest Substring Without Repeating Characters", difficulty: "Medium",
  url: "https://leetcode.com/problems/longest-substring-without-repeating-characters/",
  tags: ["sliding window", "hashset", "string"],
  approaches: ["Approach 1 · Set eviction — shrink step-by-step (best)", "Approach 2 · Last-index map — jump past duplicate"],
  complexities: [
    { time: "O(n)", space: "O(min(n, m))", note: "BEST — amortized O(1) per char" },
    { time: "O(n)", space: "O(min(n, m))", note: "jumps instead of evicting" }
  ],
  compare: [
    { name: "Brute force", tech: "all substrings + set check", time: "O(n³)", space: "O(m)", when: "tiny n only", best: false },
    { name: "Window + set", tech: "evict until distinct", time: "O(n)", space: "O(min(n,m))", when: "general case", best: true },
    { name: "Window + index map", tech: "jump l to last+1", time: "O(n)", space: "O(min(n,m))", when: "long repeated runs", best: false }
  ],
  inputs: [
    { name: "s", label: "s =", type: "str", default: "abcabcbb" }
  ],
  examples: [
    { label: "Ex 1", values: { s: "abcabcbb" }, result: "3" },
    { label: "Ex 2", values: { s: "bbbbb" }, result: "1" },
    { label: "Ex 3", values: { s: "pwwkew" }, result: "3" },
    { label: "Stale map!", values: { s: "tmmzuxt" }, result: "5 — shows the >= l guard" }
  ],
  realLife: "<p><b>Stream deduplication</b>: finding the longest run of unique bytes/events in a data stream (compression heuristics, cache-line analysis) is exactly this problem.</p><p><b>Session tracing</b>: longest window of distinct actions before a repeat forces a flush — the set/eviction pattern is O(1) per event.</p>",
  dsDive: `<h3>Sliding-window invariants for this problem</h3>
<p><b>Invariant:</b> window [l, r] is always valid ⇔ all chars distinct. <b>Shrink condition:</b> s[r] already in the set → advance l until the duplicate is evicted. <b>maxLen update:</b> after every insertion, maxLen = max(maxLen, r − l + 1) — the window is valid BY CONSTRUCTION, so every window we measure is a candidate.</p>
<p><b>Set vs fixed count array vs index map:</b> Python set/dict = open addressing with linear probing — <span class="equation" style="font-size:12px">h(k, i) = (hash(k) + i) mod m</span>; C++ unordered_set = separate chaining. A <span class="code-var">bool seen[128]</span> array (ASCII) skips hashing entirely. The index map (Approach 2) is the trick: <b>l can jump</b> to lastSeen[s[r]] + 1 — and the guard <span class="code-var">lastSeen[s[r]] &gt;= l</span> is what discards STALE entries from before the current window. ASCII vs Unicode: array[128] indexes only the first byte of multi-byte UTF-8 chars — Unicode input forces a code-point map.</p>`,
  code: [
    "window = set()                         # chars currently inside [l, r]",
    "l = 0; max_len = 0                     # left edge + best answer",
    "for r, ch in enumerate(s):             # r scans right once, O(n)",
    "    while ch in window:                # duplicate → shrink from left",
    "        window.remove(s[l]); l += 1    #   evict one char at a time",
    "    window.add(ch)                     # restore the all-distinct invariant",
    "    max_len = max(max_len, r - l + 1)  # [l, r] valid → candidate",
    "return max_len"
  ],
  steps: [
    function (vals) {
      const s = String(vals.s).split("");
      const steps = [];
      const windowSet = [];
      const snap = (text, code, cls) => steps.push({ text, code, mem: [
        { type: "string", title: "s · window [l, r]", data: s, cls: cls || {}, size: 1 },
        { type: "array", title: "set · distinct chars in [l, r]", data: windowSet.slice(), size: 8 }
      ]});
      let l = 0, maxLen = 0;
      snap("Start: window empty, set empty. r grows the window — every set op is O(1), so the whole pass is O(n).", 1, {});
      for (let r = 0; r < s.length; r++) {
        if (windowSet.includes(s[r])) {
          snap(`s[r]='<b>${s[r]}</b>' is ALREADY inside the window → invariant broken. Shrink: evict s[l] until the duplicate is gone.`, 3, { [r]: "hl", [l]: "hot" });
          while (windowSet.includes(s[r])) {
            const ev = s[l];
            windowSet.splice(windowSet.indexOf(ev), 1);
            l++;
            snap(`Evict '<b>${ev}</b>' from the set, l → ${l}. Still duplicate? <b>${windowSet.includes(s[r]) ? "yes — keep evicting" : "no — valid again"}</b>.`, 4, { [r]: "hl", [l - 1]: "done" });
          }
        } else {
          snap(`s[r]='<b>${s[r]}</b>' not in the set → window stays valid.`, 2, { [r]: "hl", [l]: "hot" });
        }
        windowSet.push(s[r]);
        maxLen = Math.max(maxLen, r - l + 1);
        snap(`Insert '<b>${s[r]}</b>'. Window [${l}..${r}] length ${r - l + 1} → maxLen = <b>${maxLen}</b>.`, 6, { [r]: "hl", [l]: "hot" });
      }
      const last = steps[steps.length - 1];
      const expected = (() => { let best = 0, ll = 0; const m = new Map(); for (let rr = 0; rr < s.length; rr++) { if (m.has(s[rr]) && m.get(s[rr]) >= ll) ll = m.get(s[rr]) + 1; m.set(s[rr], rr); best = Math.max(best, rr - ll + 1); } return best; })();
      last.result = String(maxLen);
      last.correct = maxLen === expected;
      last.memNote = "Time: O(n) — each char enters and leaves the set once. Space: O(min(n, m)).";
      return { steps, result: String(maxLen), correct: maxLen === expected, memNote: last.memNote };
    },
    function (vals) {
      const s = String(vals.s).split("");
      const m = 8, steps = [];
      const slots = new Array(m).fill(null);
      const hmod = k => ((k % m) + m) % m;
      const snap = (text, code, probe, hit, cls) => steps.push({ text, code, mem: [
        { type: "hashmap", title: "lastSeen · char → last index", mode: "open", slots: slots.map(x => x ? { k: x.k, v: x.v } : null), probe: probe || [], hit: hit === undefined ? -1 : hit, formula: "h(k, i) = (hash(k) + i) mod 8" },
        { type: "string", title: "s · window [l, r]", data: s, cls: cls || {}, size: 1 }
      ]});
      let l = 0, maxLen = 0;
      snap("Key idea: store each char's MOST RECENT index. On a duplicate, l jumps — no step-by-step eviction.", 1, [], -1, {});
      for (let r = 0; r < s.length; r++) {
        const code = s[r].charCodeAt(0);
        const probe = [];
        let slot = -1;
        for (let j = 0; j < m; j++) {
          const sl = hmod(code + j);
          probe.push(sl);
          if (slots[sl] && slots[sl].k === s[r]) { slot = sl; break; }
          if (!slots[sl]) break;
        }
        if (slot !== -1 && slots[slot].v >= l) {
          snap(`'<b>${s[r]}</b>' seen before at index <b>${slots[slot].v}</b> ≥ l=${l} → STALE-within-window. l jumps to ${slots[slot].v + 1}.`, 4, probe, slot, { [r]: "hl", [l]: "hot" });
          l = slots[slot].v + 1;
        } else if (slot !== -1) {
          snap(`'<b>${s[r]}</b>' seen at ${slots[slot].v} but that is BEFORE l=${l} → stale, ignore (this guard kills the classic bug).`, 3, probe, slot, { [r]: "hl", [l]: "hot" });
        }
        if (slot === -1) {
          const placed = hmod(code);
          slots[placed] = { k: s[r], v: r };
          snap(`'<b>${s[r]}</b>' never seen → insert at slot ${placed} with index ${r}.`, 5, [placed], placed, { [r]: "hl", [l]: "hot" });
        } else {
          snap(`Update '<b>${s[r]}</b>' → index ${r} (probe ${probe.join("→")} hit slot ${slot}).`, 5, probe, slot, { [r]: "hl", [l]: "hot" });
        }
        maxLen = Math.max(maxLen, r - l + 1);
        snap(`Window [${l}..${r}] length ${r - l + 1} → maxLen = <b>${maxLen}</b>.`, 6, [], -1, { [r]: "hl", [l]: "hot" });
      }
      const last = steps[steps.length - 1];
      const expected = (() => { let best = 0, ll = 0; const mm = new Map(); for (let rr = 0; rr < s.length; rr++) { if (mm.has(s[rr]) && mm.get(s[rr]) >= ll) ll = mm.get(s[rr]) + 1; mm.set(s[rr], rr); best = Math.max(best, rr - ll + 1); } return best; })();
      last.result = String(maxLen);
      last.correct = maxLen === expected;
      last.memNote = "Time: O(n) single pass. Space: O(min(n, m)) map entries.";
      return { steps, result: String(maxLen), correct: maxLen === expected, memNote: last.memNote };
    }
  ]
});

/* ================================================================
 * PROBLEM 0076 — MINIMUM WINDOW SUBSTRING
 * ================================================================ */
NC150.register({
  id: "0076", title: "Minimum Window Substring", difficulty: "Hard",
  url: "https://leetcode.com/problems/minimum-window-substring/",
  tags: ["sliding window", "hashmap", "string"],
  approaches: ["Approach 1 · Two hash maps + formed/required (best)", "Approach 2 · 128-slot count arrays — O(1) space"],
  complexities: [
    { time: "O(n + m)", space: "O(m)", note: "BEST — maps hold ≤ |t| distinct chars" },
    { time: "O(n + m)", space: "O(1)", note: "fixed 128×2 ints, no hashing" }
  ],
  compare: [
    { name: "Brute force", tech: "all pairs + full check", time: "O(n²·m)", space: "O(m)", when: "tiny n only", best: false },
    { name: "Window + maps", tech: "formed/required", time: "O(n + m)", space: "O(m)", when: "Unicode / big alphabets", best: true },
    { name: "Window + count[128]", tech: "same, array slots", time: "O(n + m)", space: "O(1)", when: "ASCII input", best: false }
  ],
  inputs: [
    { name: "s", label: "s =", type: "str", default: "ADOBECODEBANC" },
    { name: "t", label: "t =", type: "str", default: "ABC" }
  ],
  examples: [
    { label: "Ex 1", values: { s: "ADOBECODEBANC", t: "ABC" }, result: "BANC" },
    { label: "Ex 2", values: { s: "a", t: "a" }, result: "a" },
    { label: "Impossible", values: { s: "a", t: "aa" }, result: "" },
    { label: "Duplicates", values: { s: "aa", t: "aa" }, result: "aa" }
  ],
  realLife: "<p><b>Document snippets</b>: shortest span of text containing every keyword of a search query — search engines generate exactly this.</p><p><b>Protocol analysis</b>: shortest byte range containing all required markers in a network stream uses the identical formed/required pattern.</p>",
  dsDive: `<h3>Sliding-window invariants for this problem</h3>
<p><b>Validity:</b> window ⊇ t ⇔ every char's count in the window ≥ its required count. <b>Shrink condition:</b> formed == required (all quotas met) → shrink l greedily, because a shorter valid window can only come from shrinking a valid one. <b>Update:</b> record r − l + 1 whenever formed == required and it beats the best.</p>
<p><b>count[128] vs unordered_map:</b> a 128-slot array indexed by ASCII code is O(1) worst case, zero hashing, one contiguous cache line. An <span class="code-cpp">unordered_map&lt;char,int&gt;</span> (C++ chaining) / dict (Python open addressing, linear probing <span class="equation" style="font-size:12px">h(k,i) = (hash(k)+i) mod m</span>) pays hash + resize for the same job — only wins for huge/unknown alphabets (Unicode).</p>
<p><b>The formed/required trick</b> is the real lesson: it turns a per-step full "does window ⊇ t?" scan (O(σ)) into O(1) bookkeeping — each char entering/leaving flips at most one char's satisfied-status.</p>`,
  code: [
    "need = Counter(t); required = len(need)     # t's quotas, #distinct chars",
    "window = {}; formed = 0; l = 0              # window counts, satisfied count",
    "ans = (inf, 0, 0)                           # (best length, left, right)",
    "for r, ch in enumerate(s):                  # expand right",
    "    window[ch] = window.get(ch, 0) + 1",
    "    if ch in need and window[ch] == need[ch]:",
    "        formed += 1                         # this char met its quota",
    "    while formed == required:               # window is valid → shrink",
    "        if r - l + 1 < ans[0]: ans = (r-l+1, l, r)",
    "        window[s[l]] -= 1                   # evict left char",
    "        if s[l] in need and window[s[l]] < need[s[l]]:",
    "            formed -= 1                     # quota broken → invalid",
    "        l += 1",
    "return '' if ans[0] == inf else s[ans[1]:ans[2]+1]"
  ],
  steps: [
    function (vals) {
      const s = String(vals.s).split(""), t = String(vals.t).split("");
      const steps = [];
      const need = {}; t.forEach(c => need[c] = (need[c] || 0) + 1);
      const required = Object.keys(need).length;
      const window = {};
      const slotsOf = obj => Object.keys(obj).map(k => ({ k, v: obj[k] })).concat(new Array(Math.max(0, 4 - Object.keys(obj).length)).fill(null)).slice(0, 8);
      const snap = (text, code, cls, wcls) => steps.push({ text, code, mem: [
        { type: "string", title: "s · window [l, r]", data: s, cls: cls || {}, size: 1 },
        { type: "string", title: "t (required)", data: t, cls: wcls || {}, size: 1 },
        { type: "hashmap", title: "need · quotas from t", mode: "open", slots: slotsOf(need), probe: [], hit: -1, formula: "required = " + required + " distinct chars" },
        { type: "hashmap", title: "window · counts in [l, r]", mode: "open", slots: slotsOf(window), probe: [], hit: -1, formula: "" }
      ]});
      let l = 0, formed = 0, ansLen = Infinity, ansL = 0;
      snap("Count t's quotas. required = " + required + " distinct chars. formed counts how many quotas the window satisfies.", 0, {}, {});
      for (let r = 0; r < s.length; r++) {
        window[s[r]] = (window[s[r]] || 0) + 1;
        if (need[s[r]] && window[s[r]] === need[s[r]]) formed++;
        snap(`Expand: '<b>${s[r]}</b>' → window count ${window[s[r]]}. ${need[s[r]] ? (window[s[r]] === need[s[r]] ? "Quota met → formed = " + formed : "not at quota yet") : "not needed by t"}.`, 5, { [r]: "hl", [l]: "hot" }, {});
        while (formed === required) {
          if (r - l + 1 < ansLen) { ansLen = r - l + 1; ansL = l; }
          snap(`VALID window [${l}..${r}] len ${r - l + 1}${ansLen === r - l + 1 ? " — NEW best!" : " (not better)"}. Now shrink.`, 7, { [r]: "hl", [l]: "hot" }, {});
          window[s[l]]--;
          if (need[s[l]] && window[s[l]] < need[s[l]]) {
            formed--;
            snap(`Evict '<b>${s[l]}</b>' → count ${window[s[l]]} DROPS below quota → formed = ${formed}, window invalid, stop shrinking.`, 8, { [r]: "hl", [l]: "done" }, {});
          } else {
            snap(`Evict '<b>${s[l]}</b>' (count ${window[s[l]]}) — still satisfies t → keep shrinking.`, 8, { [r]: "hl", [l]: "done" }, {});
          }
          l++;
        }
      }
      const best = ansLen === Infinity ? "" : s.slice(ansL, ansL + ansLen).join("");
      const last = steps[steps.length - 1];
      const brute = (() => {
        const nd = {}; t.forEach(c => nd[c] = (nd[c] || 0) + 1);
        let b = "";
        for (let i = 0; i < s.length; i++) {
          const w = {};
          for (let j = i; j < s.length; j++) {
            w[s[j]] = (w[s[j]] || 0) + 1;
            if (Object.keys(nd).every(c => (w[c] || 0) >= nd[c])) {
              if (!b || j - i + 1 < b.length) b = s.slice(i, j + 1).join("");
              break;
            }
          }
        }
        return b;
      })();
      last.text = best ? `Best window: '<b>${best}</b>' (len ${best.length}).` : "No window of s contains all of t → return <b>''</b>.";
      last.result = best;
      last.correct = best === brute;
      last.memNote = "Time: O(n + m). Space: O(m) for the two maps.";
      return { steps, result: best, correct: best === brute, memNote: last.memNote };
    },
    function (vals) {
      const s = String(vals.s).split(""), t = String(vals.t).split("");
      const steps = [];
      const needArr = new Array(128).fill(0);
      t.forEach(c => needArr[c.charCodeAt(0)]++);
      const required = needArr.filter(x => x > 0).length;
      const windowArr = new Array(128).fill(0);
      const active = () => {
        const out = [];
        for (let i = 65; i < 123; i++) {
          if (needArr[i] > 0 || windowArr[i] > 0) out.push({ i, s: String.fromCharCode(i) + ":" + windowArr[i] });
        }
        return out;
      };
      const snap = (text, code, cls, clsw) => steps.push({ text, code, mem: [
        { type: "string", title: "s · window [l, r]", data: s, cls: cls || {}, size: 1 },
        { type: "string", title: "t (required)", data: t, cls: clsw || {}, size: 1 },
        { type: "array", title: "windowCounts[128] · active slots (slot = ASCII code)", data: active().map(x => x.s), size: 8 }
      ]});
      let l = 0, matched = 0, ansLen = Infinity, ansL = 0;
      snap("Same algorithm, different container: counts live in int windowCounts[128], slot = ord(char). No hashing — O(1) worst case.", 1, {}, {});
      for (let r = 0; r < s.length; r++) {
        const c = s[r].charCodeAt(0);
        windowArr[c]++;
        if (needArr[c] > 0 && windowArr[c] === needArr[c]) matched++;
        snap(`Expand: '<b>${s[r]}'</b> → count[${c}] = ${windowArr[c]}. ${needArr[c] > 0 ? (windowArr[c] === needArr[c] ? "quota met → matched = " + matched : "not at quota yet") : "not needed"}.`, 6, { [r]: "hl", [l]: "hot" }, {});
        while (matched === required) {
          if (r - l + 1 < ansLen) { ansLen = r - l + 1; ansL = l; }
          snap(`VALID [${l}..${r}] len ${r - l + 1}${ansLen === r - l + 1 ? " — NEW best!" : ""} → shrink.`, 8, { [r]: "hl", [l]: "hot" }, {});
          const out = s[l].charCodeAt(0);
          windowArr[out]--;
          if (needArr[out] > 0 && windowArr[out] < needArr[out]) {
            matched--;
            snap(`Evict '<b>${s[l]}</b>' → below quota → matched = ${matched}, invalid, stop.`, 9, { [r]: "hl", [l]: "done" }, {});
          } else {
            snap(`Evict '<b>${s[l]}</b>' — still valid → keep shrinking.`, 9, { [r]: "hl", [l]: "done" }, {});
          }
          l++;
        }
      }
      const best = ansLen === Infinity ? "" : s.slice(ansL, ansL + ansLen).join("");
      const last = steps[steps.length - 1];
      const brute = (() => {
        const nd = {}; t.forEach(c => nd[c] = (nd[c] || 0) + 1);
        let b = "";
        for (let i = 0; i < s.length; i++) {
          const w = {};
          for (let j = i; j < s.length; j++) {
            w[s[j]] = (w[s[j]] || 0) + 1;
            if (Object.keys(nd).every(c => (w[c] || 0) >= nd[c])) {
              if (!b || j - i + 1 < b.length) b = s.slice(i, j + 1).join("");
              break;
            }
          }
        }
        return b;
      })();
      last.text = best ? `Best window: '<b>${best}</b>' (len ${best.length}).` : "No valid window → return <b>''</b>.";

  realLife: "<p><b>k-mer searching</b>: does a genome/database string contain a fixed-length chunk with the same letter histogram as a query — the sliding-multiset pattern used in bioinformatics and plagiarism tools.</p><p><b>Anagram detection</b>: word games and search indexers check fixed-length windows of text for query-word letter multisets.</p>",
  dsDive: `<h3>Sliding-window invariants for this problem</h3>
<p>A permutation is a re-ORDERING → ignore order, compare MULTISETS. <b>Fixed window</b> of exactly |s1| slides over s2: each slide adds one char and removes one. <b>Validity:</b> window multiset == s1 multiset ⇔ all 26 slots have equal counts. <b>Shrink condition:</b> none — the window size is CONSTANT; the only update is the O(1) matches bookkeeping.</p>
<p><b>count[26] vs dict:</b> the lowercase alphabet is exactly 26 letters → two int[26] arrays indexed by <span class="code-var">ord(c) − 97</span> beat any hash structure (C++ unordered_map = chaining; Python dict = open addressing, linear probing h(k,i) = (hash(k)+i) mod m). The <b>matches counter</b> is the real insight: adding/removing a char changes the equality status of AT MOST ONE slot, so matches updates in O(1) instead of a full 26-slot comparison per slide.</p>`,
  code: [
    "c1 = [0]*26; c2 = [0]*26                   # target + window counters",
    "for i in range(len(s1)):",
    "    c1[ord(s1[i])-97] += 1; c2[ord(s2[i])-97] += 1",
    "matches = sum(1 for i in range(26) if c1[i] == c2[i])",
    "for i in range(len(s1), len(s2)):",
    "    if matches == 26: return True           # short-circuit before slide",
    "    add = ord(s2[i])-97; c2[add] += 1       # incoming char",
    "    if c2[add] == c1[add]: matches += 1",
    "    elif c2[add] == c1[add]+1: matches -= 1",
    "    rem = ord(s2[i-len(s1)])-97; c2[rem] -= 1  # outgoing char",
    "    if c2[rem] == c1[rem]: matches += 1",
    "    elif c2[rem] == c1[rem]-1: matches -= 1",
    "return matches == 26"
  ],
  steps: [
    function (vals) {
      const s1 = String(vals.s1).split(""), s2 = String(vals.s2).split("");
      const steps = [];
      const c1 = new Array(26).fill(0), c2 = new Array(26).fill(0);
      const activeLetters = () => {
        const set = new Set();
        s1.forEach(c => set.add(c));
        s2.forEach(c => set.add(c));
        return Array.from(set).sort();
      };
      const c1View = () => activeLetters().filter(c => c1[c.charCodeAt(0) - 97] > 0).map(c => c + ":" + c1[c.charCodeAt(0) - 97]);
      const c2View = () => activeLetters().filter(c => c2[c.charCodeAt(0) - 97] > 0).map(c => c + ":" + c2[c.charCodeAt(0) - 97]);
      const snap = (text, code, cls, clsw) => steps.push({ text, code, mem: [
        { type: "string", title: "s1 · target multiset", data: s1, cls: clsw || {}, size: 1 },
        { type: "string", title: "s2 · fixed window [i−|s1|+1 .. i]", data: s2, cls: cls || {}, size: 1 },
        { type: "array", title: "c1 · target counts", data: c1View(), size: 8 },
        { type: "array", title: "c2 · window counts", data: c2View(), size: 8 }
      ]});
      if (s1.length > s2.length) {
        steps.push({ text: "|s1| > |s2| → no window can fit → <b>false</b>.", code: 0, mem: [
          { type: "string", title: "s1", data: s1, size: 1 }, { type: "string", title: "s2", data: s2, size: 1 }
        ], result: "false", correct: true, memNote: "O(1) time." });
        return { steps, result: "false", correct: true, memNote: "O(1) time." };
      }
      for (let i = 0; i < s1.length; i++) {
        c1[s1[i].charCodeAt(0) - 97]++;
        c2[s2[i].charCodeAt(0) - 97]++;
      }
      let matches = 0;
      for (let i = 0; i < 26; i++) if (c1[i] === c2[i]) matches++;
      snap(`Seed: first |s1|=${s1.length} chars of s2 counted into c2. matches = <b>${matches}</b>/26 slots equal.`, 3, { [s1.length - 1]: "hl" }, {});
      for (let i = s1.length; i < s2.length; i++) {
        if (matches === 26) {
          snap(`matches == 26 BEFORE the slide → window [${i - s1.length}..${i - 1}] is a permutation → <b>true</b>.`, 5, { [i - 1]: "done" }, {});
          const last = steps[steps.length - 1];
          last.result = "true";
          last.correct = true;
          last.memNote = "Time: O(n). Space: O(1).";
          return { steps, result: "true", correct: true, memNote: last.memNote };
        }
        const add = s2[i].charCodeAt(0) - 97;
        c2[add]++;
        const addMsg = c2[add] === c1[add] ? "matches → " + (matches + 1) : (c2[add] === c1[add] + 1 ? "overshot → " + (matches - 1) : "unchanged");
        if (c2[add] === c1[add]) matches++;
        else if (c2[add] === c1[add] + 1) matches--;
        const rem = s2[i - s1.length].charCodeAt(0) - 97;
        c2[rem]--;
        const remMsg = c2[rem] === c1[rem] ? "matches → " + (matches + 1) : (c2[rem] === c1[rem] - 1 ? "dropped → " + (matches - 1) : "unchanged");
        if (c2[rem] === c1[rem]) matches++;
        else if (c2[rem] === c1[rem] - 1) matches--;
        snap(`Slide to [${i - s1.length + 1}..${i}]: add '<b>${s2[i]}</b>' (${addMsg}), remove '<b>${s2[i - s1.length]}</b>' (${remMsg}) → matches = <b>${matches}</b>.`, 6, { [i]: "hl", [i - s1.length]: "done" }, {});
      }
      const last = steps[steps.length - 1];
      last.result = matches === 26 ? "true" : "false";
      const brute = (() => {
        const target = {}; s1.forEach(c => target[c] = (target[c] || 0) + 1);
        for (let i = 0; i + s1.length <= s2.length; i++) {
          const w = {};
          for (let j = i; j < i + s1.length; j++) w[s2[j]] = (w[s2[j]] || 0) + 1;
          if (Object.keys(target).every(c => w[c] === target[c])) return true;
        }
        return false;
      })();
      last.correct = (matches === 26) === brute;
      last.text = last.result === "true" ? `Final window is a permutation → <b>true</b>.` : `No window's multiset equals s1's → <b>false</b>.`;
      last.memNote = "Time: O(n). Space: O(1) — two 26-slot arrays.";
      return { steps, result: last.result, correct: last.correct, memNote: last.memNote };
    },
    function (vals) {
      const s1 = String(vals.s1).split(""), s2 = String(vals.s2).split("");
      const steps = [];
      const target = {}; s1.forEach(c => target[c] = (target[c] || 0) + 1);
      const window = {};
      const slotsOf = obj => Object.keys(obj).map(k => ({ k, v: obj[k] })).concat(new Array(Math.max(0, 4 - Object.keys(obj).length)).fill(null)).slice(0, 8);
      const snap = (text, code, cls) => steps.push({ text, code, mem: [
        { type: "string", title: "s1 · target multiset", data: s1, size: 1 },
        { type: "string", title: "s2 · fixed window", data: s2, cls: cls || {}, size: 1 },
        { type: "hashmap", title: "target · Counter(s1)", mode: "open", slots: slotsOf(target), probe: [], hit: -1, formula: "" },
        { type: "hashmap", title: "window · Counter(window)", mode: "open", slots: slotsOf(window), probe: [], hit: -1, formula: "" }
      ]});
      if (s1.length > s2.length) {
        steps.push({ text: "|s1| > |s2| → <b>false</b>.", code: 0, mem: [
          { type: "string", title: "s1", data: s1, size: 1 }, { type: "string", title: "s2", data: s2, size: 1 }
        ], result: "false", correct: true, memNote: "O(1) time." });
        return { steps, result: "false", correct: true, memNote: "O(1) time." };
      }
      for (let i = 0; i < s1.length; i++) window[s2[i]] = (window[s2[i]] || 0) + 1;
      const eq = () => Object.keys(target).every(c => window[c] === target[c]) && Object.keys(window).every(c => window[c] === (target[c] || 0));
      if (eq()) {
        steps.push({ text: "First window already matches → <b>true</b>.", code: 3, mem: [
          { type: "string", title: "s1", data: s1, size: 1 }, { type: "string", title: "s2", data: s2, cls: { [s1.length - 1]: "done" }, size: 1 }
        ], result: "true", correct: true, memNote: "Time: O(k). Space: O(σ)." });
        return { steps, result: "true", correct: true, memNote: "Time: O(k). Space: O(σ)." };
      }
      snap(`Seed the first ${s1.length} chars. Comparing counters now — full comparison per slide, O(σ) each.`, 2, { [s1.length - 1]: "hl" });
      for (let i = s1.length; i < s2.length; i++) {
        window[s2[i]] = (window[s2[i]] || 0) + 1;
        const left = s2[i - s1.length];
        window[left]--;
        if (window[left] === 0) delete window[left];
        const ok = eq();
        snap(`Slide to [${i - s1.length + 1}..${i}]: add '<b>${s2[i]}</b>', remove '<b>${left}</b>'. Compare → ${ok ? "EQUAL → <b>true</b>!" : "not equal → keep sliding"}.`, 4, { [i]: "hl", [i - s1.length]: "done" });
        if (ok) {
          const last = steps[steps.length - 1];
          last.result = "true";
          last.correct = true;
          last.memNote = "Time: O(n·σ). Space: O(σ).";
          return { steps, result: "true", correct: true, memNote: last.memNote };
        }
      }
      const last = steps[steps.length - 1];
      last.result = "false";
      last.text = "No window's Counter equals the target → <b>false</b>.";
      const brute = (() => {
        const t = {}; s1.forEach(c => t[c] = (t[c] || 0) + 1);
        for (let i = 0; i + s1.length <= s2.length; i++) {
          const w = {};
          for (let j = i; j < i + s1.length; j++) w[s2[j]] = (w[s2[j]] || 0) + 1;
          if (Object.keys(t).every(c => w[c] === t[c])) return true;
        }
        return false;
      })();
      last.correct = !brute;
      last.memNote = "Time: O(n·σ). Space: O(σ).";
      return { steps, result: "false", correct: !brute, memNote: last.memNote };
    }
  ]
});
