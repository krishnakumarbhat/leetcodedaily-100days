/* shared helpers (same as section 01): open-addressing visuals */
function emptySlots(m) { return new Array(m).fill(null); }
function hmod(k, m) { return ((k % m) + m) % m; }
/* simulate linear-probing lookup; returns {hit:slot|null, probe:[...]} */
function probeFind(slots, m, key) {
  const probe = [];
  for (let j = 0; j < m; j++) {
    const s = hmod(key + j, m);
    probe.push(s);
    if (slots[s] && slots[s].k === key) return { hit: s, probe };
    if (!slots[s]) return { hit: null, probe };
  }
  return { hit: null, probe };
}
/* simulate linear-probing insert; returns placed slot */
function probeInsert(slots, m, key, val) {
  for (let j = 0; j < m; j++) {
    const s = hmod(key + j, m);
    if (!slots[s]) { slots[s] = { k: key, v: val }; return s; }
  }
  return -1;
}
/* alphanumeric test for the palindrome problems */
function isAlnum(c) { return /[a-zA-Z0-9]/.test(c); }
/* independent reference: brute-force max area (used as the verdict) */
function bruteMaxArea(h) {
  let b = 0;
  for (let i = 0; i < h.length; i++)
    for (let j = i + 1; j < h.length; j++)
      b = Math.max(b, Math.min(h[i], h[j]) * (j - i));
  return b;
}
/* independent reference: prefix/suffix trapped water (used as verdict) */
function refTrap(h) {
  if (!h.length) return 0;
  const n = h.length, lm = [h[0]], rm = new Array(n);
  rm[n - 1] = h[n - 1];
  let t = 0;
  for (let i = 1; i < n; i++) lm[i] = Math.max(lm[i - 1], h[i]);
  for (let i = n - 2; i >= 0; i--) rm[i] = Math.max(rm[i + 1], h[i]);
  for (let i = 0; i < n; i++) t += Math.max(0, Math.min(lm[i], rm[i]) - h[i]);
  return t;
}
/* independent reference: sorted-set of unique zero-sum triplets */
function refTriplets(nums) {
  const s = new Set();
  for (let i = 0; i < nums.length; i++)
    for (let j = i + 1; j < nums.length; j++)
      for (let k = j + 1; k < nums.length; k++)
        if (nums[i] + nums[j] + nums[k] === 0)
          s.add([nums[i], nums[j], nums[k]].sort((a, b) => a - b).join(","));
  return [...s].sort();
}
/* independent reference: normalized palindrome verdict */
function refPalindrome(s) {
  const clean = s.toLowerCase().replace(/[^a-z0-9]/g, "");
  return clean === clean.split("").reverse().join("");
}

/* ================================================================
 * PROBLEM 0011 — CONTAINER WITH MOST WATER
 * ================================================================ */
NC150.register({
  id: "0011", title: "Container With Most Water", difficulty: "Medium",
  url: "https://leetcode.com/problems/container-with-most-water/",
  tags: ["two pointers", "array"],
  approaches: ["Approach 1 · Brute force (O(n²))", "Approach 2 · Two pointers (best)"],
  complexities: [
    { time: "O(n²)", space: "O(1)", note: "baseline — every pair" },
    { time: "O(n)", space: "O(1)", note: "BEST — shrink from the ends" }
  ],
  compare: [
    { name: "Brute force", tech: "nested loops", time: "O(n²)", space: "O(1)", when: "tiny n only", best: false },
    { name: "Two pointers", tech: "move the shorter wall", time: "O(n)", space: "O(1)", when: "always — the answer", best: true }
  ],
  inputs: [
    { name: "heights", label: "heights =", type: "list", default: "[1,8,6,2,5,4,8,3,7]" }
  ],
  examples: [
    { label: "Ex 1", values: { heights: "[1,8,6,2,5,4,8,3,7]" }, result: "49" },
    { label: "Ex 2", values: { heights: "[1,1]" }, result: "1" },
    { label: "Plateau", values: { heights: "[4,3,1,1,1,3,4]" }, result: "24" }
  ],
  realLife: "<p><b>Water reservoirs / dam siting</b>: engineers pick two banks that maximize impounded water — same max-rectangle problem.</p><p><b>Stock & chart analysis</b>: the 'biggest rectangle under a chart' idea (volume profiles, heat-map selection) is this exact geometry.</p>",
  dsDive: `<h3>The two-pointer math that makes O(n) provable</h3>
<div class="equation">area(l, r) = min(height[l], height[r]) · (r − l)</div>
<p>Width and height both matter, but at any moment ONE wall is the bottleneck. Fix l and r with height[l] ≤ height[r]: every container still using wall l has height ≤ height[l] and width ≤ (r − l), so it can never beat the current area. Wall l is provably useless → discard it by moving l inward. Same argument mirrors at r. Each move permanently removes one candidate wall, so exactly n−1 areas are measured.</p>
<p><b>Key contrast with binary search:</b> here we do NOT need sorted data — the 'monotonic' property is not about values but about the area formula: the discarded wall can never participate in a better answer, no matter what values lie ahead.</p>`,
  code: [
    "best = 0",
    "for l in range(n):                    # every left wall",
    "    for r in range(l + 1, n):         # every right wall",
    "        area = min(h[l], h[r]) * (r - l)",
    "        best = max(best, area)",
    "return best"
  ],
  steps: [
    function (vals) {
      const heights = vals.heights, n = heights.length;
      const steps = [];
      let best = 0;
      const snap = (text, code, cls) => steps.push({ text, code, mem: [
        { type: "array", title: "heights (walls)", data: heights, cls: cls || {}, showIdx: true, size: 4 },
        { type: "array", title: "best area so far", data: [best], size: 8 }
      ]});
      if (n < 2) {
        const last = { text: "Fewer than 2 walls → no container exists → <b>0</b>.", code: 1, mem: [], result: "0", correct: true, memNote: "O(1)." };
        steps.push(last);
        return { steps, result: "0", correct: true, memNote: "O(1)." };
      }
      snap("Baseline: try EVERY pair (l, r) and measure the rectangle — O(n²).", 0, {});
      for (let l = 0; l < n; l++) {
        for (let r = l + 1; r < n; r++) {
          const area = Math.min(heights[l], heights[r]) * (r - l);
          const cls = {}; cls[l] = "hot"; cls[r] = "hot";
          if (area > best) {
            const old = best; best = area;
            snap(`Pair (${l},${r}): min(${heights[l]},${heights[r]}) × width ${r - l} = <b>${area}</b> &gt; best ${old} → best = <b>${best}</b>.`, 4, cls);
          } else {
            snap(`Pair (${l},${r}): area <b>${area}</b> ≤ best ${best} → keep <b>${best}</b>.`, 4, cls);
          }
        }
      }
      const last = steps[steps.length - 1];
      last.result = String(best);
      last.correct = best === bruteMaxArea(heights);
      last.memNote = "Space: O(1). Time: O(n²) — n(n−1)/2 pairs.";
      return { steps, result: String(best), correct: last.correct, memNote: last.memNote };
    },
    function (vals) {
      const heights = vals.heights, n = heights.length;
      const steps = [];
      const snap = (text, code, cls, scalars) => steps.push({ text, code, mem: [
        { type: "array", title: "heights (walls)", data: heights, cls: cls || {}, showIdx: true, size: 4 },
        { type: "array", title: "h[l] · h[r] · best", data: scalars || [], size: 8 }
      ]});
      if (n < 2) {
        const last = { text: "Fewer than 2 walls → <b>0</b>.", code: 1, mem: [], result: "0", correct: true, memNote: "O(1)." };
        steps.push(last);
        return { steps, result: "0", correct: true, memNote: "O(1)." };
      }
      let l = 0, r = n - 1, best = 0;
      snap("Start with MAXIMAL width: l at index 0, r at the last index.", 2, { [l]: "hot", [r]: "hot" }, [heights[l], heights[r], best]);
      while (l < r) {
        const area = Math.min(heights[l], heights[r]) * (r - l);
        const cls = { [l]: "hot", [r]: "hot" };
        if (area > best) {
          best = area;
          snap(`Measure (${l},${r}): min(${heights[l]},${heights[r]}) × width ${r - l} = <b>${area}</b> → NEW best <b>${best}</b>.`, 4, cls, [heights[l], heights[r], best]);
        } else {
          snap(`Measure (${l},${r}): area <b>${area}</b> ≤ best ${best} → best stays <b>${best}</b>.`, 4, cls, [heights[l], heights[r], best]);
        }
        if (heights[l] < heights[r]) {
          snap(`h[l]=<b>${heights[l]}</b> &lt; h[r]=<b>${heights[r]}</b> → the LEFT wall caps the water. Any partner of wall ${l} fits ≤ ${heights[l]}×(r−l) — wall ${l} can never win → discard it: <b>l++</b>.`, 8, cls, [heights[l], heights[r], best]);
          l++;
        } else {
          snap(`h[r]=<b>${heights[r]}</b> ≤ h[l]=<b>${heights[l]}</b> → the RIGHT wall caps (or ties). Discard wall ${r}: <b>r--</b>.`, 10, cls, [heights[l], heights[r], best]);
          r--;
        }
      }
      const last = steps[steps.length - 1];
      last.result = String(best);
      last.correct = best === bruteMaxArea(heights);
      last.memNote = "Space: O(1). Time: O(n) — one measurement per discarded wall.";
      return { steps, result: String(best), correct: last.correct, memNote: last.memNote };
    }
  ]
});

/* ================================================================
 * PROBLEM 0015 — 3SUM
 * ================================================================ */
NC150.register({
  id: "0015", title: "3Sum", difficulty: "Medium",
  url: "https://leetcode.com/problems/3sum/",
  tags: ["two pointers", "hashmap"],
  approaches: ["Approach 1 · Sort + two pointers (best)", "Approach 2 · Pivot + hash map"],
  complexities: [
    { time: "O(n²)", space: "O(1)", note: "BEST — sort once, walk per pivot" },
    { time: "O(n²)", space: "O(n)", note: "hash-set 2-sum + dedupe set" }
  ],
  compare: [
    { name: "Brute force", tech: "3 nested loops", time: "O(n³)", space: "O(1)", when: "tiny n only", best: false },
    { name: "Sort + two pointers", tech: "sorted 2-sum per pivot", time: "O(n²)", space: "O(1)", when: "general case", best: true },
    { name: "Pivot + hash map", tech: "set lookups + dedupe", time: "O(n²)", space: "O(n)", when: "no sort allowed", best: false }
  ],
  inputs: [
    { name: "nums", label: "nums =", type: "list", default: "[-1,0,1,2,-1,-4]" }
  ],
  examples: [
    { label: "Ex 1", values: { nums: "[-1,0,1,2,-1,-4]" }, result: "[[-1,-1,2],[-1,0,1]]" },
    { label: "Ex 2 (zeros)", values: { nums: "[0,0,0,0]" }, result: "[[0,0,0]]" },
    { label: "Ex 3 (none)", values: { nums: "[1,2,3]" }, result: "[]" }
  ],
  realLife: "<p><b>Chemistry / recipe balancing</b>: finding trios of amounts that cancel out (pH buffers, alloy compositions) is literally a+b+c=0 search.</p><p><b>Payment reconciliation</b>: 'which three invoices net to zero?' — deduplication against mirrored groups is the same sorted-set problem.</p>",
  dsDive: `<h3>Dedupe on sorted triplets — and the hash tables underneath</h3>
<p>With a sorted array every triplet is emitted in sorted order (a ≤ b ≤ c), and the <b>skip-duplicates</b> rule jumps past repeated values — so the exact same value-triple can never be recorded twice. No set needed at all in Approach 1.</p>
<div class="equation">a = nums[i] &nbsp;|&nbsp; need b + c = −a &nbsp;|&nbsp; sorted 2-sum: move l up / r down</div>
<p>Approach 2 achieves uniqueness by hashing the canonical sorted tuple instead. Under the hood, the dedupe set is a hash table: <b>Python</b> = open addressing with linear probing <span class="code-var">h(k, i) = (hash(k) + i) mod m</span>; <b>C++</b> <span class="code-cpp">std::unordered_set</span> = separate chaining (bucket lists). Both give O(1) average per op — the O(n²) time bound is dominated by the pivot loop, not the hash ops.</p>`,
  code: [
    [
      "nums.sort()                          # O(n log n) — enables everything",
      "for i in range(n - 2):",
      "    if i > 0 and nums[i] == nums[i-1]: continue   # skip dup pivot",
      "    if nums[i] > 0: break            # positives can't sum to 0",
      "    target = -nums[i]; l, r = i + 1, n - 1",
      "    while l < r:                     # sorted 2-sum, O(n)",
      "        s = nums[l] + nums[r]",
      "        if s < target: l += 1",
      "        elif s > target: r -= 1",
      "        else:",
      "            record [nums[i], nums[l], nums[r]]",
      "            while l < r and nums[l] == nums[l+1]: l += 1  # skip dup b",
      "            while l < r and nums[r] == nums[r-1]: r -= 1  # skip dup c",
      "            l += 1; r -= 1"
    ],
    [
      "nums.sort()                          # only for canonical keys",
      "seen = set()                         # dedupe: open addressing",
      "for i in range(n - 2):",
      "    if nums[i] > 0: break",
      "    partners = set()                 # inner 2-sum hash set",
      "    for j in range(i + 1, n):",
      "        need = -(nums[i] + nums[j])",
      "        if need in partners:         # O(1) probe lookup",
      "            trip = (nums[i], need, nums[j])",
      "            if trip not in seen: seen.add(trip); record trip",
      "        partners.add(nums[j])"
    ]
  ],
  steps: [
    function (vals) {
      const nums = vals.nums.slice().sort((a, b) => a - b);
      const n = nums.length;
      const steps = [];
      const found = [];
      const snap = (text, code, cls) => {
        const mem = [{ type: "array", title: "nums (sorted)", data: nums, cls: cls || {}, showIdx: true, size: 4 }];
        if (found.length) mem.push({ type: "array", title: "triplets found", data: found.map(t => "[" + t.join(",") + "]"), size: 8 });
        steps.push({ text, code, mem });
      };
      if (n < 3) {
        const last = { text: "Fewer than 3 numbers → no triplets → <b>[]</b>.", code: 0, mem: [{ type: "array", title: "nums (sorted)", data: nums, showIdx: true, size: 4 }], result: "[]", correct: true, memNote: "O(1)." };
        steps.push(last);
        return { steps, result: "[]", correct: true, memNote: "O(1)." };
      }
      snap("Step 1: <b>sort</b> — O(n log n). Equal values become neighbours (that is what makes dedupe free).", 0, {});
      for (let i = 0; i < n - 2; i++) {
        if (nums[i] > 0) {
          snap(`Pivot <b>${nums[i]}</b> &gt; 0 → all later values are positive, a+b+c can never be 0 → stop.`, 3, { [i]: "done" });
          break;
        }
        if (i > 0 && nums[i] === nums[i - 1]) {
          snap(`Pivot <b>${nums[i]}</b> equals the previous pivot → same 'a' ⇒ same triplets → <b>skip</b>.`, 2, { [i]: "hot" });
          continue;
        }
        const target = -nums[i];
        let l = i + 1, r = n - 1;
        snap(`Pivot i=${i} → <b>a = ${nums[i]}</b>. Need b + c = <b>${target}</b> on the slice (${l}..${r}).`, 4, { [i]: "hl", [l]: "hot", [r]: "hot" });
        while (l < r) {
          const sum = nums[l] + nums[r];
          const cls = { [i]: "hl", [l]: "hot", [r]: "hot" };
          if (sum < target) {
            snap(`b + c = ${sum} &lt; ${target} → pair too small → <b>l++</b> (need a bigger b).`, 7, cls);
            l++;
          } else if (sum > target) {
            snap(`b + c = ${sum} &gt; ${target} → pair too big → <b>r--</b> (need a smaller c).`, 8, cls);
            r--;
          } else {
            found.push([nums[i], nums[l], nums[r]]);
            snap(`b + c = ${sum} = ${target} → record triplet <b>[${nums[i]}, ${nums[l]}, ${nums[r]}]</b>.`, 9, cls);
            while (l < r && nums[l] === nums[l + 1]) {
              l++;
              snap(`Skip duplicate b = <b>${nums[l]}</b> — same value triple would repeat.`, 11, { [i]: "hl", [l]: "hot", [r]: "hot" });
            }
            while (l < r && nums[r] === nums[r - 1]) {
              r--;
              snap(`Skip duplicate c = <b>${nums[r]}</b> — same value triple would repeat.`, 12, { [i]: "hl", [l]: "hot", [r]: "hot" });
            }
            l++; r--;
          }
        }
      }
      const last = steps[steps.length - 1];
      last.result = JSON.stringify(found);
      last.correct = JSON.stringify(found.map(t => t.join(",")).sort()) === JSON.stringify(refTriplets(vals.nums));
      last.memNote = "Space: O(1) extra. Time: sort O(n log n) + n pivots × O(n) walk = O(n²).";
      return { steps, result: last.result, correct: last.correct, memNote: last.memNote };
    },
    function (vals) {
      const nums = vals.nums.slice().sort((a, b) => a - b);
      const n = nums.length;
      const steps = [];
      const found = [];
      const m = 8;
      const slots = emptySlots(m);
      const snap = (text, code, probe, hit, cls) => {
        const mem = [
          { type: "array", title: "nums (sorted)", data: nums, cls: cls || {}, showIdx: true, size: 4 },
          { type: "hashmap", title: "partners set · open addressing", mode: "open", slots: slots.map(x => x ? { k: x.k, v: x.v } : null), probe: probe || [], hit: hit !== undefined ? hit : -1, formula: "h(k, i) = (hash(k) + i) mod 8" }
        ];
        if (found.length) mem.push({ type: "array", title: "triplets found", data: found.map(t => "[" + t.join(",") + "]"), size: 8 });
        steps.push({ text, code, mem });
      };
      if (n < 3) {
        const last = { text: "Fewer than 3 numbers → <b>[]</b>.", code: 0, mem: [{ type: "array", title: "nums (sorted)", data: nums, showIdx: true, size: 4 }], result: "[]", correct: true, memNote: "O(1)." };
        steps.push(last);
        return { steps, result: "[]", correct: true, memNote: "O(1)." };
      }
      snap("Sort only to get CANONICAL triplet keys (a ≤ b ≤ c) for dedupe.", 0, [], -1, {});
      for (let i = 0; i < n - 2; i++) {
        slots.fill(null);
        if (nums[i] > 0) {
          snap(`Pivot <b>${nums[i]}</b> &gt; 0 → stop: only positive values remain.`, 3, [], -1, { [i]: "done" });
          break;
        }
        snap(`Pivot i=${i} → <b>a = ${nums[i]}</b>. Empty the partner set — the inner 2-sum starts fresh.`, 1, [], -1, { [i]: "hl" });
        for (let j = i + 1; j < n; j++) {
          const need = -(nums[i] + nums[j]);
          const cls = { [i]: "hl", [j]: "hot" };
          const r = probeFind(slots, m, need);
          if (r.hit !== null) {
            const trip = [nums[i], need, nums[j]].sort((a, b) => a - b);
            const dup = found.some(t => t.join() === trip.join());
            if (!dup) found.push(trip);
            snap(`j=${j}: b=<b>${nums[j]}</b>. Complement <b>${need}</b> found in the set (probe ${r.probe.join("→")}) → triplet <b>[${trip}]</b> ${dup ? "already known — dedupe skips it" : "recorded!"}.`, 6, r.probe, r.hit, cls);
          } else {

        }

      return { steps, result: last.result, correct: last.correct, memNote: last.memNote };
    }
  ]
});
