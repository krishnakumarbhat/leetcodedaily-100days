/* ================================================================
 * SHARED HELPERS — input clamping keeps every animation small
 * ================================================================ */
function capStr(s, n) {
  s = String(s === null || s === undefined ? "" : s);
  return s.length > n ? s.slice(0, n) : s;
}
function capList(a, n, mx) {
  a = (a || []).map(function (x) { return Number(x); });
  if (mx !== undefined) a = a.map(function (x) { return Math.max(-mx, Math.min(mx, Math.round(x))); });
  return a.length > n ? a.slice(0, n) : a;
}
function capInt(v, lo, hi) {
  v = Number(v);
  if (!Number.isFinite(v)) return lo;
  return Math.max(lo, Math.min(hi, Math.round(v)));
}
function arrView(title, data, cls, size) {
  return { type: "array", title: title, data: data, cls: cls || {}, showIdx: true, size: size || 4 };
}
function gridView(title, data, cols, cls) {
  return { type: "grid", title: title, data: data, cols: cols, cls: cls || {} };
}

/* ================================================================
 * PROBLEM 0005 — LONGEST PALINDROMIC SUBSTRING
 * ================================================================ */
NC150.register({
  id: "0005", title: "Longest Palindromic Substring", difficulty: "Medium",
  url: "https://leetcode.com/problems/longest-palindromic-substring/",
  tags: ["dp", "string", "two pointers"],
  approaches: ["Approach 1 · Expand around center (best)", "Approach 2 · Bottom-up DP table"],
  complexities: [
    { time: "O(n²)", space: "O(1)", note: "BEST — no extra memory" },
    { time: "O(n²)", space: "O(n²)", note: "full palindrome table" }
  ],
  compare: [
    { name: "Brute force", tech: "check every substring", time: "O(n³)", space: "O(1)", when: "tiny strings only", best: false },
    { name: "Expand around center", tech: "2n−1 centers, walk out", time: "O(n²)", space: "O(1)", when: "general case", best: true },
    { name: "Bottom-up DP table", tech: "dp[i][j] = s[i]==s[j] ∧ inner", time: "O(n²)", space: "O(n²)", when: "need all palindromes", best: false }
  ],
  inputs: [
    { name: "s", label: "s =", type: "str", default: "babad" }
  ],
  examples: [
    { label: "Ex 1", values: { s: "babad" }, result: '"bab"' },
    { label: "Ex 2", values: { s: "cbbd" }, result: '"bb"' },
    { label: "Ex 3", values: { s: "a" }, result: '"a"' }
  ],
  realLife: "<p><b>Genomics</b>: palindromic motifs in DNA (e.g. restriction-enzyme cut sites) are found by exactly this expansion trick — scan every base as a center and extend while the flanks mirror.</p><p><b>Spell-check / autocorrect</b>: detecting mirror phrases in text mines, and <b>compression</b>: LZ-family algorithms look for the longest matching (often palindromic-ish) block backwards. O(n²) center expansion beats O(n³) naive substring checks on real inputs.</p>",
  dsDive: `<h3>Why centers instead of substrings?</h3>
<p>Every palindrome has a <b>mirror axis</b>: a single character (odd length) or the gap between two characters (even length). There are exactly <b>2n−1</b> axes, so expanding each axis until the mirrors disagree touches each substring at most once.</p>
<div class="equation">expand(l, r): while s[l] == s[r]: l−1, r+1 → palindrome s[l+1 .. r−1]</div>
<p>In memory this is pure cache-friendly pointer walking — two indices, no table. The DP variant instead stores <b>dp[i][j]</b> = 's[i..j] is a palindrome' where a cell depends on the cell <b>down-left</b>: dp[i][j] = s[i]==s[j] and dp[i+1][j−1]. The table wastes half its cells (j &lt; i) and O(n²) RAM, which is why the center method is the interview answer.</p>`,
  code: [
    [
      "def longest_pal(s):",
      "    best = ''",
      "    for i in range(len(s)):",
      "        l = r = i                      # odd center: single char",
      "        while l >= 0 and r < len(s) and s[l] == s[r]:",
      "            if r - l + 1 > len(best): best = s[l:r+1]",
      "            l -= 1; r += 1             # expand both flanks",
      "        l, r = i, i + 1                # even center: gap",
      "        while l >= 0 and r < len(s) and s[l] == s[r]:",
      "            if r - l + 1 > len(best): best = s[l:r+1]",
      "            l -= 1; r += 1",
      "    return best"
    ],
    [
      "def longest_pal(s):",
      "    n = len(s); start, max_len = 0, 1",
      "    dp = [[False]*n for _ in range(n)]",
      "    for i in range(n): dp[i][i] = True       # single chars",
      "    for length in range(2, n + 1):          # grow by length",
      "        for i in range(n - length + 1):",
      "            j = i + length - 1",
      "            if s[i] == s[j] and (length <= 2 or dp[i+1][j-1]):",
      "                dp[i][j] = True",
      "                if length > max_len: start, max_len = i, length",
      "    return s[start:start+max_len]"
    ]
  ],
  steps: [
    function (vals) {
      const s = capStr(vals.s, 6);
      const n = s.length;
      const steps = [];
      let best = "";
      const snap = (text, code, cls) => steps.push({ text: text, code: code, mem: [
        { type: "string", title: "s", data: s.split(""), cls: cls || {}, size: 1 },
        { type: "array", title: "best palindrome so far", data: best ? best.split("") : [], cls: {}, showIdx: true, size: 1 }
      ] });
      if (n === 0) {
        snap("Empty string → nothing to expand; answer is the empty string.", 1, {});
        const last = steps[steps.length - 1];
        last.result = '""'; last.correct = true;
        last.memNote = "Time O(n²), space O(1).";
        return { steps: steps, result: '""', correct: true, memNote: last.memNote };
      }
      snap("Scan every mirror axis — 2n−1 of them: one per char (odd) plus one per gap (even).", 1, {});
      function expand(l, r) {
        while (l >= 0 && r < n && s[l] === s[r]) { l--; r++; }
        return [l + 1, r - 1];
      }
      for (let c = 0; c < n; c++) {
        const p1 = expand(c, c);
        const len1 = p1[1] - p1[0] + 1;
        if (len1 > best.length) best = s.slice(p1[0], p1[1] + 1);
        snap(`Axis ${c} (odd, char "${s[c]}"): expand → "${s.slice(p1[0], p1[1] + 1)}" (len ${len1})${len1 > best.length ? " — new best!" : " — not longer"}.`, 4, { [p1[0]]: "hot", [p1[1]]: "done" });
        if (c + 1 < n) {
          const p2 = expand(c, c + 1);
          const len2 = p2[1] - p2[0] + 1;
          if (len2 > best.length) best = s.slice(p2[0], p2[1] + 1);
          snap(`Axis ${c}|${c + 1} (even, gap): expand → "${s.slice(p2[0], p2[1] + 1)}" (len ${len2})${len2 > best.length ? " — new best!" : " — not longer"}.`, 5, { [p2[0]]: "hot", [p2[1]]: "done" });
        }
      }
      const last = steps[steps.length - 1];
      last.result = '"' + best + '"';
      last.correct = true;
      last.memNote = "Time O(n²), space O(1) — n centers, each expands at most n.";
      return { steps: steps, result: '"' + best + '"', correct: true, memNote: last.memNote };
    },
    function (vals) {
      const s = capStr(vals.s, 6);
      const n = s.length;
      const steps = [];
      if (n === 0) {
        const last = { text: "Empty string → no substrings; answer is the empty string.", code: 0, mem: [gridView("dp — palindrome table", [[]], 1, {})] };
        last.result = '""'; last.correct = true; last.memNote = "Time O(n²), space O(n²).";
        steps.push(last);
        return { steps: steps, result: '""', correct: true, memNote: last.memNote };
      }
      const dp = [];
      for (let i = 0; i < n; i++) dp.push(new Array(n).fill("·"));
      let start = 0, maxLen = 1;
      const snap = (text, code, cls) => steps.push({ text: text, code: code, mem: [gridView("dp[i][j] = s[i..j] palindrome?", dp.map(r => r.slice()), n, cls)] });
      snap("Base case: every single character is a palindrome (diagonal).", 1, {});
      for (let i = 0; i < n; i++) { dp[i][i] = "✓"; snap(`dp[${i}][${i}] = ✓ — "${s[i]}" alone is a palindrome.`, 2, { [i + "," + i]: "done" }); }
      for (let len = 2; len <= n; len++) {
        for (let i = 0; i + len - 1 < n; i++) {
          const j = i + len - 1;
          const ok = s[i] === s[j] && (len === 2 || dp[i + 1][j - 1] === "✓");
          dp[i][j] = ok ? "✓" : "✗";
          if (ok && len > maxLen) { maxLen = len; start = i; }
          const inner = len === 2 ? "no inner substring" : "inner dp[" + (i + 1) + "][" + (j - 1) + "] = " + dp[i + 1][j - 1];
          snap(`"${s.slice(i, j + 1)}" (len ${len}): ends ${s[i]} vs ${s[j]} ${s[i] === s[j] ? "match ✓, " + inner + " → palindrome ✓" : "differ ✗ → not a palindrome"}.`, 4, { [i + "," + j]: "done", ...(len > 2 && s[i] === s[j] ? { [(i + 1) + "," + (j - 1)]: "hl" } : {}) });
        }
      }
      const res = s.slice(start, start + maxLen);
      const last = steps[steps.length - 1];
      last.result = '"' + res + '"';
      last.correct = true;
      last.memNote = "Time O(n²), space O(n²) — table filled by substring length, longest ✓ tracked.";
      return { steps: steps, result: '"' + res + '"', correct: true, memNote: last.memNote };
    }
  ]
});

/* ================================================================
 * PROBLEM 0070 — CLIMBING STAIRS
 * ================================================================ */
NC150.register({
  id: "0070", title: "Climbing Stairs", difficulty: "Easy",
  url: "https://leetcode.com/problems/climbing-stairs/",
  tags: ["dp", "fibonacci"],
  approaches: ["Approach 1 · DP array (bottom-up)", "Approach 2 · Two-variable rolling"],
  complexities: [
    { time: "O(n)", space: "O(n)", note: "full dp array" },
    { time: "O(n)", space: "O(1)", note: "BEST — only last two matter" }
  ],
  compare: [
    { name: "Recursion (naive)", tech: "ways(n) = ways(n−1)+ways(n−2)", time: "O(2ⁿ)", space: "O(n)", when: "never — recomputes everything", best: false },
    { name: "DP array", tech: "dp[i] = dp[i−1] + dp[i−2]", time: "O(n)", space: "O(n)", when: "want full table", best: false },
    { name: "Rolling variables", tech: "two vars shift each step", time: "O(n)", space: "O(1)", when: "general case", best: true }
  ],
  inputs: [
    { name: "n", label: "n =", type: "int", default: "5" }
  ],
  examples: [
    { label: "Ex 1", values: { n: "2" }, result: "2" },
    { label: "Ex 2", values: { n: "3" }, result: "3" },
    { label: "Ex 3", values: { n: "5" }, result: "8" }
  ],
  realLife: "<p><b>Fibonacci in disguise</b>: this exact recurrence powers <b>CPU branch prediction</b> (how many ways to arrange pipeline stages), <b>rabbit-population models</b>, and <b>counting paths in state machines</b> — any system where the next state depends on the previous two.</p><p><b>UI layouts</b>: number of ways to tile a 2×n wall with 1×1 and 2×1 bricks (Domino tiling) is the same DP — a favorite in graphics shader packing algorithms.</p>",
  dsDive: `<h3>The recurrence that only needs a window</h3>
<p>ways(i) = ways(i−1) + ways(i−2): the last step into stair i came from stair i−1 (one step) or stair i−2 (a 2-step).</p>
<div class="equation">dp[i] = dp[i−1] + dp[i−2] → Fₙ₊₁ (Fibonacci)</div>
<p>The full dp array is O(n) RAM for a recurrence whose <b>dependency depth is 2</b>. Once dp[i−2] is used, it is never read again — so two rolling variables hold the whole future. This 'shrink the window to the dependency width' trick is the single most common 1D-DP space optimization; the same idea gives the rolling rows in LCS and the two pointers in house robber.</p>`,
  code: [
    [
      "def climb_stairs(n):",
      "    dp = [0] * (n + 1)",
      "    dp[0] = 1; dp[1] = 1        # 0 stairs: 1 way; 1 stair: 1 way",
      "    for i in range(2, n + 1):",
      "        dp[i] = dp[i - 1] + dp[i - 2]   # from one step or two",
      "    return dp[n]"
    ],
    [
      "def climb_stairs(n):",
      "    prev2, prev1 = 1, 1         # ways(0), ways(1)",
      "    for i in range(2, n + 1):",
      "        cur = prev1 + prev2",
      "        prev2, prev1 = prev1, cur    # slide the window",
      "    return prev1"
    ]
  ],
  steps: [
    function (vals) {
      const n = capInt(vals.n, 1, 25);
      const steps = [];
      const dp = new Array(n + 1).fill(0);
      const snap = (text, code, cls) => steps.push({ text: text, code: code, mem: [
        arrView("dp[i] = ways to reach stair i", dp.slice(), cls || {}),
        { type: "array", title: "stairs", data: Array.from({ length: n }, (_, i) => i + 1), cls: {}, showIdx: true, size: 4 }
      ] });
      dp[0] = 1; dp[1] = 1;
      snap("Base cases: dp[0] = 1 (start, do nothing), dp[1] = 1 (one 1-step).", 2, { 0: "done", 1: "done" });
      for (let i = 2; i <= n; i++) {
        dp[i] = dp[i - 1] + dp[i - 2];
        snap(`Stair ${i}: last move came from stair ${i - 1} (${dp[i - 1]} ways) or stair ${i - 2} (${dp[i - 2]} ways) → dp[${i}] = ${dp[i - 1]} + ${dp[i - 2]} = <b>${dp[i]}</b>.`, 4, { [i]: "hot", [i - 1]: "done", [i - 2]: "done" });
      }
      const last = steps[steps.length - 1];
      last.result = String(dp[n]);
      last.correct = true;
      last.memNote = "Time O(n), space O(n) — the full table, one cell per stair.";
      return { steps: steps, result: String(dp[n]), correct: true, memNote: last.memNote };
    },
    function (vals) {
      const n = capInt(vals.n, 1, 25);
      const steps = [];
      let prev2 = 1, prev1 = 1;
      const snap = (text, code, cls) => steps.push({ text: text, code: code, mem: [
        arrView("rolling window · [ways(i−2), ways(i−1)]", [prev2, prev1], cls || {}, 8)
      ] });
      snap("Only the last two values are ever needed — keep them in two variables (O(1) memory).", 1, { 0: "done", 1: "done" });
      for (let i = 2; i <= n; i++) {
        const cur = prev1 + prev2;
        snap(`Step ${i}: ways(${i}) = ways(${i - 1}) + ways(${i - 2}) = ${prev1} + ${prev2} = <b>${cur}</b> — shift the window right.`, 4, { 0: "done", 1: "hot" });
        prev2 = prev1; prev1 = cur;
      }
      const last = steps[steps.length - 1];
      last.result = String(prev1);
      last.correct = true;
      last.memNote = "Time O(n), space O(1) — two variables slide like a window of width 2.";
      return { steps: steps, result: String(prev1), correct: true, memNote: last.memNote };
    }
  ]
});

/* ================================================================
 * PROBLEM 0091 — DECODE WAYS
 * ================================================================ */
NC150.register({
  id: "0091", title: "Decode Ways", difficulty: "Medium",
  url: "https://leetcode.com/problems/decode-ways/",
  tags: ["dp", "string"],
  approaches: ["Approach 1 · DP array (bottom-up)", "Approach 2 · Two-variable rolling"],
  complexities: [
    { time: "O(n)", space: "O(n)", note: "dp[i] = ways for first i chars" },
    { time: "O(n)", space: "O(1)", note: "BEST — dependency depth 2" }
  ],
  compare: [
    { name: "Brute recursion", tech: "try 1 and 2-digit takes", time: "O(2ⁿ)", space: "O(n)", when: "never — exponential", best: false },
    { name: "DP array", tech: "dp[i] = take1 + take2", time: "O(n)", space: "O(n)", when: "want full table", best: false },
    { name: "Rolling variables", tech: "window of two dp values", time: "O(n)", space: "O(1)", when: "general case", best: true }
  ],
  inputs: [
    { name: "s", label: "s =", type: "str", default: "226" }
  ],
  examples: [
    { label: "Ex 1", values: { s: "12" }, result: "2" },
    { label: "Ex 2", values: { s: "226" }, result: "3" },
    { label: "Ex 3", values: { s: "06" }, result: "0" }
  ],
  realLife: "<p><b>Message protocols</b>: any codec that maps symbols to variable-length tokens (QR alphanumeric modes, UTF-8 continuation bytes, base64 groupings) must count how many ways a byte stream can be split into valid tokens — exactly this DP.</p><p><b>Autocomplete parsers</b>: counting segmentations of a string against a dictionary of valid tokens (e.g. 'illness' → 'ill' + 'ness') is the same recurrence, with a dictionary lookup replacing the 10..26 range check.</p>",
  dsDive: `<h3>Decision at each digit: take 1 or take 2?</h3>
<p>When you stand at prefix s[0..i], the last decoded letter used either <b>one digit</b> (s[i−1], must be 1..9) or <b>two digits</b> (s[i−2..i−1], must be 10..26). These branches are disjoint, so ways add.</p>
<div class="equation">dp[i] = dp[i−1]·[s[i−1]≠'0'] + dp[i−2]·[10 ≤ s[i−2:i] ≤ 26]</div>
<p>The Iverson brackets (0 or 1) are the legality gates. Like climbing stairs, cell i only reads i−1 and i−2 — the classic <b>dependency width 2</b> recurrence, so two rolling variables replace the array. A leading '0' kills the first digit branch and a '30' kills the two-digit branch, which is how '06' scores 0.</p>`,
  code: [
    [
      "def num_decodings(s):",
      "    dp = [0] * (len(s) + 1)",
      "    dp[0] = 1                       # empty prefix: 1 way",
      "    dp[1] = 0 if s[0] == '0' else 1",
      "    for i in range(2, len(s) + 1):",
      "        if s[i-1] != '0': dp[i] += dp[i-1]      # take 1 digit",
      "        two = int(s[i-2:i])",
      "        if 10 <= two <= 26: dp[i] += dp[i-2]    # take 2 digits",
      "    return dp[len(s)]"
    ],
    [
      "def num_decodings(s):",
      "    dp0, dp1 = 1, 0 if s[0] == '0' else 1   # ways(i-2), ways(i-1)",
      "    for i in range(2, len(s) + 1):",
      "        cur = 0",
      "        if s[i-1] != '0': cur += dp1",
      "        if 10 <= int(s[i-2:i]) <= 26: cur += dp0",
      "        dp0, dp1 = dp1, cur",
      "    return dp1"
    ]
  ],
  steps: [
    function (vals) {
      const s = capStr(vals.s, 10);
      const n = s.length;
      const steps = [];
      const dp = new Array(n + 1).fill(0);
      const snap = (text, code, cls) => steps.push({ text: text, code: code, mem: [
        arrView("dp[i] = ways to decode first i chars", dp.slice(), cls || {}),
        { type: "string", title: "s", data: s.split(""), cls: {}, size: 1 }
      ] });
      if (n === 0) {
        snap("Empty string → no digits to decode → 0 ways.", 0, {});
        const last = steps[steps.length - 1];
        last.result = "0"; last.correct = true; last.memNote = "Time O(n), space O(n).";
        return { steps: steps, result: "0", correct: true, memNote: last.memNote };
      }

<div class="equation">dp[i][j] = dp[i−1][j−1] + 1 if match, else max(dp[i−1][j], dp[i][j−1])</div>
<p>Row-major fill reads left and up — both already computed — so the table is a single cache-friendly sweep. The rolling variant notices cell (i, j) only touches row i−1: keep <b>prev</b> and <b>cur</b> rows and swap, cutting space from O(m·n) to O(n) with identical values. Reconstructing the actual subsequence (not just its length) still requires the full table or parent pointers.</p>`,
