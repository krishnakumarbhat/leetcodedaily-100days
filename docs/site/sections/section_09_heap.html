/* ================================================================
 * SHARED HELPERS — binary heap as an array + tree view
 * ================================================================ */
/* array data of a binary heap → engine.js tree (children of i at 2i+1, 2i+2) */
function heapTree(arr) {
  if (!arr.length) return null;
  function build(i) {
    if (i >= arr.length || arr[i] === null) return null;
    const n = { id: i + 1, val: String(arr[i]), left: null, right: null };
    n.left = build(2 * i + 1);
    n.right = build(2 * i + 2);
    return n;
  }
  return build(0);
}
/* which array indices are highlighted on a given tree-node id */
function treeHlIndices(ids) { return ids.map(x => x - 1); }
/* standard min-heap ops on a plain array, returning {arr, moves:[i,j,...]} */
function heapPushMin(arr, v) {
  arr.push(v);
  let i = arr.length - 1;
  const moves = [];
  while (i > 0) {
    const p = (i - 1) >> 1;
    if (arr[p] <= arr[i]) break;
    [arr[p], arr[i]] = [arr[i], arr[p]];
    moves.push(i, p);
    i = p;
  }
  return moves;
}
function heapPopMin(arr) {
  const moves = [];
  if (!arr.length) return null;
  const top = arr[0];
  arr[0] = arr[arr.length - 1];
  arr.pop();
  let i = 0;
  while (true) {
    const l = 2 * i + 1, r = 2 * i + 2;
    let s = i;
    if (l < arr.length && arr[l] < arr[s]) s = l;
    if (r < arr.length && arr[r] < arr[s]) s = r;
    if (s === i) break;
    [arr[s], arr[i]] = [arr[i], arr[s]];
    moves.push(i, s);
    i = s;
  }
  return moves;
}

      const target = n - k;
      const snap = (text, code, cls) => steps.push({ text: text, code: code, mem: [
        { type: "array", title: `nums · target index = n−k = ${target}`, data: arr.slice(), cls: cls || {}, showIdx: true, size: 8 }
      ] });
      snap(`Quickselect: find the element that belongs at index <b>${target}</b> (0-based) — that IS the k-th largest.`, 1, {});
      let answer = null;
      (function select(lo, hi) {
        if (lo > hi) return;
        const pivot = arr[hi];
        let l = lo, m = lo, r = hi;
        while (m <= r) {
          if (arr[m] < pivot) { [arr[l], arr[m]] = [arr[m], arr[l]]; l++; m++; }
          else if (arr[m] > pivot) { [arr[m], arr[r]] = [arr[r], arr[m]]; r--; }
          else m++;
        }
        const cls = {};
        for (let i = l; i <= r; i++) cls[i] = "hot";
        snap(`Partition around pivot <b>${pivot}</b> → region [${l}..${r}] holds all copies of the pivot.`, 2, cls);
        if (target < l) select(lo, l - 1);
        else if (target > r) select(r + 1, hi);
        else { answer = arr[target]; snap(`Index ${target} lies inside the pivot region → <b>answer = ${arr[target]}</b>.`, 3, cls); }
      })(0, n - 1);
      const last = steps[steps.length - 1];
      last.result = String(answer);
      const sorted = nums.slice().sort((a, b) => a - b);
      last.correct = answer === sorted[sorted.length - k];
      last.memNote = "Time: O(n) average, O(n²) worst. Space: O(1) — no extra structure.";
      return { steps: steps, result: last.result, correct: last.correct, memNote: last.memNote };
    }
  ]
});

NC150.register({
  id: "0621", title: "Task Scheduler", difficulty: "Medium",

  ],
  inputs: [
    { name: "tasks", label: "tasks =", type: "list", default: '["A","A","A","B","B","B"]' },

  ],
  examples: [
    { label: "Ex 1", values: { tasks: '["A","A","A","B","B","B"]', n: "2" }, result: "8" },
    { label: "Ex 2", values: { tasks: '["A","A","A","A","A","A","B","C","D","E","F","G"]', n: "2" }, result: "16" },
    { label: "Ex 3", values: { tasks: '["A","B","C","D"]', n: "3" }, result: "4" }
  ],
  realLife: "<p><b>CPU scheduling with cooldowns</b>: GPUs and NICs can't reuse the same execution unit for n cycles — the scheduler fills gaps with other work, exactly this problem.</p><p><b>Rate limiting</b>: 'at most one request per client per 5 seconds' — the cooldown queue is a sliding rate limiter.</p>",
  dsDive: `<h3>Why the answer is one formula</h3>
<p>The most frequent task A (count m) must sit m−1 times apart by n idle/other slots:</p>
<div class="equation">(m − 1) · (n + 1) + c &nbsp; with c = how many tasks tie at frequency m</div>
<p>That skeleton is a <b>lower bound</b> (A alone forces it) and <b>achievable</b> (greedily fill gaps with other tasks — always possible because no other task appears more than m times). So <span class="code-var">answer = max(frames, len(tasks))</span>. The heap simulation replays the same schedule second-by-second: pop the most frequent READY task, park it in a FIFO for n seconds — great for sanity-checking edge cases.</p>`,
  code: [
    "cnt = Counter(tasks)",
    "m = max(cnt.values())",
    "c = count of tasks with frequency == m",
    "frames = (m - 1) * (n + 1) + c      # skeleton + last row",
    "return max(frames, len(tasks))      # never fewer than the tasks",
    "# --- simulation (A2) ---",
    "heap = [-v for v in cnt.values()]   # max-heap of counts",
    "while heap or cooldown:",
    "    t += 1                          # one time unit each tick",
    "    run most frequent ready task; park it in cooldown (t+n)"
  ],
  steps: [
    function (vals) {
      const tasks = (vals.tasks || []).map(String);
      const n = Number(vals.n || 2);
      const steps = [];
      const cnt = {};
      for (const t of tasks) cnt[t] = (cnt[t] || 0) + 1;
      const snap = (text, code, cls) => steps.push({ text: text, code: code, mem: [
        { type: "hashmap", title: "task → remaining count", slots: Object.keys(cnt).map((k, i) => ({ k: k, v: cnt[k], idx: i })), cls: cls || {} },
        { type: "array", title: "time units (I = idle)", data: [], size: 1 }
      ] });
      snap(`Count every task. The busiest task dictates the schedule skeleton.`, 1);
      const m = Math.max.apply(null, Object.values(cnt));
      const c = Object.values(cnt).filter(v => v === m).length;
      const frames = (m - 1) * (n + 1) + c;
      const answer = Math.max(frames, tasks.length);
      snap(`max freq <b>m = ${m}</b>, ties <b>c = ${c}</b> → skeleton (m−1)(n+1) + c = <b>${frames}</b> units.`, 2);
      snap(`Compare with the raw task count ${tasks.length}: answer = max(${frames}, ${tasks.length}) = <b>${answer}</b>. ${frames > tasks.length ? "Idle slots fill the gaps." : "Tasks alone fill every slot — no idle needed."}`, 3);
      const last = steps[steps.length - 1];
      last.result = String(answer);
      last.correct = true;
      last.memNote = "O(1) time & space — no simulation at all.";
      return { steps: steps, result: last.result, correct: last.correct, memNote: last.memNote };
    },
    function (vals) {
      const tasks = (vals.tasks || []).map(String);
      const n = Number(vals.n || 2);
      const steps = [];
      const cnt = {};
      for (const t of tasks) cnt[t] = (cnt[t] || 0) + 1;
      const heap = Object.values(cnt).map(x => -x);
      const cooldown = [];
      const timeline = [];
      const snap = (text, code) => steps.push({ text: text, code: code, mem: [
        { type: "tree", title: "max-heap of remaining task counts", root: heapTree(heap), hl: [] },
        { type: "queue", title: "cooldown FIFO · (count, ready at)", data: cooldown.map(x => x[0] + "@" + x[1]), front: 0, rear: cooldown.length - 1 },
        { type: "array", title: "timeline (I = idle)", data: timeline.slice(), showIdx: true, size: 8 }
      ] });
      let t = 0;
      while (heap.length || cooldown.length) {
        t++;
        let ran = "I";
        if (heap.length) {
          const rem = -heap[0];
          heapPopMin(heap);
          if (rem - 1 > 0) cooldown.push([rem - 1, t + n]);
          ran = rem + "(×" + n + "cd)";
          snap(`t=${t}: run a task with ${rem} left → re-enter with ${rem - 1} left, ready at t=${t + n}.`, 2);
        } else {
          snap(`t=${t}: heap empty → <b>idle</b> while a task cools down.`, 3);
        }
        timeline.push(ran);
        while (cooldown.length && cooldown[0][1] === t) {
          heapPushMin(heap, -cooldown.shift()[0]);
          snap(`t=${t}: cooldown finished → task back in the heap.`, 4);
        }
      }
      const last = steps[steps.length - 1];
      last.result = String(t);
      last.correct = true;
      last.memNote = "Time: O(26 log 26) per sweep — the formula is O(1), this is the verifier.";
      return { steps: steps, result: last.result, correct: last.correct, memNote: last.memNote };
    }
  ]
});
