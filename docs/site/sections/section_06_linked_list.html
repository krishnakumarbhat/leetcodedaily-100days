<script>
const SECTION = { id: "06", title: "Linked List" };
const U = window.NC150.utils;

/* ---------- shared helpers for list animations ---------- */
/* ADDR(i): fake-but-consistent hex address of visual node i (8-byte ptr) */
function ADDR(i) { return U.addr(i, 8); }
/* chain(vals): nodes array for the 'list' view; next=true = forward pointer */
function chain(arr) { return arr.map((v, i) => ({ v, next: i < arr.length - 1 ? true : null })); }
/* clone view nodes so generators can mutate for flips/cycles without
   corrupting already-emitted steps */
function cloneNodes(nodes) { return nodes.map(n => ({ v: n.v, next: n.next, hl: !!n.hl, hot: !!n.hot, done: !!n.done })); }

/* ================================================================
 * PROBLEM 0002 — ADD TWO NUMBERS
 * ================================================================ */
NC150.register({
  id: "0002", title: "Add Two Numbers", difficulty: "Medium",
  url: "https://leetcode.com/problems/add-two-numbers/",
  tags: ["linked list", "math"],
  approaches: ["Approach 1 · Iterative: dummy + carry (best)", "Approach 2 · Recursive carry"],
  complexities: [
    { time: "O(max(n,m))", space: "O(1)", note: "BEST — one pass, no recursion" },
    { time: "O(max(n,m))", space: "O(max(n,m))", note: "call stack per digit" }
  ],
  compare: [
    { name: "Brute force", tech: "convert to int, add, convert back", time: "O(n+m)", space: "O(n+m)", when: "never — digits exceed 64-bit", best: false },
    { name: "Iterative dummy + carry", tech: "column addition on the fly", time: "O(n)", space: "O(1)", when: "general case", best: true },
    { name: "Recursive carry", tech: "carry threaded through call chain", time: "O(n)", space: "O(n)", when: "short lists, clarity", best: false }
  ],
  inputs: [
    { name: "l1", label: "l1 = (digits reversed)", type: "list", default: "[2,4,3]" },
    { name: "l2", label: "l2 = (digits reversed)", type: "list", default: "[5,6,4]" }
  ],
  examples: [
    { label: "Ex 1", values: { l1: "[2,4,3]", l2: "[5,6,4]" }, result: "[7,0,8]" },
    { label: "Ex 2", values: { l1: "[0]", l2: "[0]" }, result: "[0]" },
    { label: "Ex 3", values: { l1: "[9,9,9,9,9,9,9]", l2: "[9,9,9,9]" }, result: "[8,9,9,9,0,0,0,1]" },
    { label: "Carry storm", values: { l1: "[9,9,9]", l2: "[1]" }, result: "[0,0,0,1]" }
  ],
  realLife: "<p>Any system that adds numbers LONGER than 64 bits — BigInt, RSA arithmetic, cryptocurrency key math — cannot use CPU integer registers. It stores the number as a linked list / array of digits and runs exactly this grade-school column addition with carry. Same trick when you sum huge spreadsheet cells in Google Sheets.</p><p>Network packet checksums (TCP/IP) are added the same way, one word at a time, with carries folded back into the sum.</p>",
  dsDive: `<h3>Why the dummy node matters</h3>
<p>The result chain is built by appending digits one at a time. <b>Without</b> a dummy, the FIRST append must special-case: <span class="code-cpp">head = tail = newNode</span>. <b>With</b> a dummy, every append is identical: <span class="code-cpp">tail-&gt;next = newNode; tail = newNode</span> — and at the end you simply skip the dummy. One less branch in the hot loop, and the dummy's existence proves the 'empty result' case never needs separate code.</p>
<p><b>Carry discipline:</b> after both lists are exhausted the loop still runs once if carry = 1 (e.g. 999 + 1 = 1000). Forgetting that final carry digit is the #1 bug on this problem.</p>`,
  code: [
    "dummy = ListNode(0)                       # sentinel before result head",
    "cur, carry = dummy, 0",
    "while l1 or l2 or carry:                  # missing node contributes 0",
    "    s = carry",
    "    if l1: s += l1.val; l1 = l1.next      # peel digit",
    "    if l2: s += l2.val; l2 = l2.next",
    "    carry = s // 10                       # carry to next column",
    "    cur.next = ListNode(s % 10)           # this column's digit",
    "    cur = cur.next",
    "return dummy.next"
  ],
  steps: [
    function (vals) {
      const a = vals.l1, b = vals.l2;
      const na = chain(a), nb = chain(b);
      const res = [];
      const steps = [];
      const snap = (text, code) => {
        const mem = [
          { type: "list", title: "l1 (342)", nodes: cloneNodes(na) },
          { type: "list", title: "l2 (465)", nodes: cloneNodes(nb) }
        ];
        if (res.length) mem.push({ type: "list", title: "result (built so far)", nodes: chain(res) });
        steps.push({ text, code, mem });
      };
      snap("Both heads are the ONES digits — column addition works left to right. Start with carry = 0.", 0);
      let i = 0, j = 0, carry = 0, expected = [];
      const col = (x, y, carry) => { const s = x + y + carry; return [s % 10, Math.floor(s / 10)]; };
      while (i < a.length || j < b.length || carry) {
        const da = i < a.length ? a[i] : 0;
        const db = j < b.length ? b[j] : 0;
        if (i < na.length) { na[i].hot = true; }
        if (j < nb.length) { nb[j].hot = true; }
        const [d, c] = col(da, db, carry);
        const t = carry ? " (plus carry!)" : "";
        snap(`Column ${Math.max(i, j) + 1}: <b>${da} + ${db} + ${carry ? carry : "carry 0"}</b> = ${da + db + carry} → digit <b>${d}</b>, carry <b>${c}</b>${t}.`, 2);
        if (i < na.length) { na[i].hot = false; na[i].done = true; }
        if (j < nb.length) { nb[j].hot = false; nb[j].done = true; }
        res.push(d); expected.push(d);
        carry = c; i++; j++;
        snap(`Append <b>${d}</b> to the result chain. Carry now <b>${c}</b>.`, 6);
      }
      const last = steps[steps.length - 1];
      last.result = JSON.stringify(res);
      const big = (arr) => arr.reduce((acc, x) => acc + x, "");
      const aNum = big(a.slice().reverse()), bNum = big(b.slice().reverse());
      last.correct = big(res.reverse()) === String(Number(aNum) + Number(bNum));
      res.reverse();
      last.memNote = "Time: O(max(n,m)) one pass. Space: O(1) besides the answer chain.";
      return { steps, result: JSON.stringify(res), correct: last.correct, memNote: last.memNote };
    },
    function (vals) {
      const a = vals.l1, b = vals.l2;
      const na = chain(a), nb = chain(b);
      const res = [];
      const steps = [];
      const snap = (text, code) => {
        const mem = [
          { type: "list", title: "l1", nodes: cloneNodes(na) },
          { type: "list", title: "l2", nodes: cloneNodes(nb) }
        ];
        if (res.length) mem.push({ type: "list", title: "result", nodes: chain(res) });
        steps.push({ text, code, mem });
      };
      snap("Recursive view: add(a, b, carry) = (digit, add(a.next, b.next, newCarry)). The carry is threaded DOWN the call chain, digits are appended on the way UP.", 0);
      let carry = 0;
      const depth = Math.max(a.length, b.length);
      for (let k = 0; k < depth; k++) {
        const da = k < a.length ? a[k] : 0, db = k < b.length ? b[k] : 0;
        if (k < na.length) na[k].hot = true;
        if (k < nb.length) nb[k].hot = true;
        snap(`Call stack depth ${k + 1}: computing column ${k + 1} = ${da} + ${db} + carry ${carry}.`, 3);
        const s = da + db + carry;
        res.push(s % 10); carry = Math.floor(s / 10);
        if (k < na.length) { na[k].hot = false; na[k].done = true; }
        if (k < nb.length) { nb[k].hot = false; nb[k].done = true; }
        snap(`Return from depth ${k + 1}: digit <b>${s % 10}</b> appended; carry <b>${carry}</b> bubbles back up.`, 5);
      }
      if (carry) { res.push(carry); snap(`Final carry <b>${carry}</b> gets its own node — the base case triggers.`, 4); }
      const last = steps[steps.length - 1];
      last.result = JSON.stringify(res);
      last.correct = res.join("") === String(Number(a.slice().reverse().join("")) + Number(b.slice().reverse().join("")));
      last.memNote = "Time: O(max(n,m)). Space: O(max(n,m)) recursion stack.";
      return { steps, result: JSON.stringify(res), correct: last.correct, memNote: last.memNote };
    }
  ]
});

/* ================================================================
 * PROBLEM 0019 — REMOVE NTH NODE FROM END OF LIST
 * ================================================================ */
NC150.register({
  id: "0019", title: "Remove Nth Node From End of List", difficulty: "Medium",
  url: "https://leetcode.com/problems/remove-nth-node-from-end-of-list/",
  tags: ["linked list", "two pointers"],
  approaches: ["Approach 1 · One pass: fixed-gap two pointers (best)", "Approach 2 · Two pass: length count"],
  complexities: [
    { time: "O(n)", space: "O(1)", note: "BEST — single pass" },
    { time: "O(n)", space: "O(1)", note: "two passes, simpler logic" }
  ],
  compare: [
    { name: "Count + delete", tech: "two full passes", time: "O(n)", space: "O(1)", when: "simplicity", best: false },
    { name: "Fixed-gap pointers", tech: "right is n ahead of left", time: "O(n)", space: "O(1)", when: "single-pass constraint", best: true },
    { name: "Recursion unwind", tech: "count on return path", time: "O(n)", space: "O(n)", when: "never — stack waste", best: false }
  ],
  inputs: [
    { name: "head", label: "head =", type: "list", default: "[1,2,3,4,5]" },
    { name: "n", label: "n =", type: "int", default: "2" }
  ],
  examples: [
    { label: "Ex 1", values: { head: "[1,2,3,4,5]", n: "2" }, result: "[1,2,3,5]" },
    { label: "Ex 2", values: { head: "[1]", n: "1" }, result: "[]" },
    { label: "Ex 3", values: { head: "[1,2]", n: "1" }, result: "[1]" },
    { label: "Remove head", values: { head: "[1,2,3]", n: "3" }, result: "[2,3]" }
  ],
  realLife: "<p>Text editors / browser DOM keep singly linked node lists (e.g. undo history); 'delete the n-th most recent' is a daily operation. The fixed-gap trick also powers **rate limiting**: a sliding window of n requests is tracked by two timestamps n apart — no storage of the whole window needed.</p>",
  dsDive: `<h3>The measuring-stick intuition</h3>
<p><b>right</b> walks exactly n nodes ahead of <b>left</b>. When right steps off the list (null), left is sitting on the node BEFORE the victim — the only node that can do the deletion. Why? The victim is n-th from the END, so it is n steps before null: from the victim's predecessor, right (n steps ahead) must be at null exactly.</p>
<p>The <b>dummy node</b> is load-bearing here: if the victim is the real head (n == length), left would start at head — no predecessor exists. dummy → head makes dummy the predecessor, so the same skip code works for every case.</p>`,
  code: [
    "dummy = ListNode(0, head)                 # sentinel: handles head-removal",
    "left = right = dummy",
    "for _ in range(n):                        # stretch the gap to n",
    "    right = right.next",
    "while right.next:                         # slide until right hits the end",
    "    left = left.next",
    "    right = right.next",
    "left.next = left.next.next               # skip the victim",
    "return dummy.next"
  ],
  steps: [
    function (vals) {
      const h = vals.head, n = vals.n;
      const nodes = chain(h);
      const steps = [];
      let left = -1, right = -1;
      const snap = (text, code) => {
        const v = cloneNodes(nodes);
        if (left >= 0) v[left].hot = true;
        if (right >= 0) v[right].done = true;
        steps.push({ text, code, mem: [{ type: "list", title: `list · left→n${left + 1} (hot) · right→n${right + 1} (green)`, nodes: v }] });
      };
      snap("dummy → head. Stretch the gap: move right n = " + n + " steps ahead of left.", 0);
      for (let i = 0; i < n; i++) { right++; snap("right moves → node " + (right + 1) + ". Gap is now " + (right - left) + ".", 2); }
      while (right < h.length - 1) {
        left++; right++;
        const v = cloneNodes(nodes);
        v[left].hot = true; v[right].done = true;
        steps.push({ text: "Slide: left → node " + (left + 1) + ", right → node " + (right + 1) + ".", code: 4, mem: [{ type: "list", title: "sliding the gap", nodes: v }] });
      }
      const victim = left + 1;
      const result = h.filter((_, i) => i !== victim);
      const v = cloneNodes(nodes);
      v[left].hot = true;
      if (victim < v.length) v[victim].done = true;
      steps.push({ text: `Right is at the end → left (node ${left + 1}) sits BEFORE the victim (node ${victim + 1}). Delete by skipping: left.next = left.next.next.`, code: 7, mem: [{ type: "list", title: "skip the victim", nodes: v }] });
      if (victim === 0) {
        steps.push({ text: `Victim was the HEAD — the dummy is what made this deletion uniform. Result starts at old node 2.`, code: 8, mem: [{ type: "list", title: "result", nodes: chain(result) }] });
      } else {
        steps.push({ text: `Final list: <b>${result.length ? result.join("→") : "empty"}</b>.`, code: 8, mem: [{ type: "list", title: "result", nodes: chain(result) }] });
      }
      const last = steps[steps.length - 1];
      last.result = JSON.stringify(result);
      last.correct = result.join("") === h.filter((_, i) => i !== h.length - n).join("");
      last.memNote = "Time: O(n) one pass. Space: O(1) — only two pointers.";
      return { steps, result: JSON.stringify(result), correct: last.correct, memNote: last.memNote };
    },
    function (vals) {
      const h = vals.head, n = vals.n;
      const nodes = chain(h);
      const steps = [];
      const snap = (text, code, clsIdx) => {
        const v = cloneNodes(nodes);
        if (clsIdx !== undefined) v[clsIdx].hot = true;
        steps.push({ text, code, mem: [{ type: "list", title: "list", nodes: v }] });
      };
      snap("Pass 1: count the length — walk every node until null. Here length = " + h.length + ".", 0);
      for (let i = 0; i < h.length; i++) snap("Counting: node " + (i + 1) + " → length so far " + (i + 1) + ".", 2);
      const len = h.length;
      const target = len - n;
      snap("n-th from end = index <b>" + target + "</b> from the head (0-based).", 4);
      let prev = -1;
      for (let i = 0; i < target; i++) { prev = i; snap("Walk pass 2: at node " + (i + 1) + " — keep its predecessor in mind.", 5); }
      const result = h.filter((_, i) => i !== target);
      const v = cloneNodes(nodes);
      if (prev >= 0) v[prev].hot = true;
      if (target < v.length) v[target].done = true;
      steps.push({ text: `Node ${target + 1} is the victim → predecessor's next skips it.`, code: 7, mem: [{ type: "list", title: "before", nodes: v }] });
      steps.push({ text: `Final list: <b>${result.length ? result.join("→") : "empty"}</b>.`, code: 8, mem: [{ type: "list", title: "result", nodes: chain(result) }] });
      const last = steps[steps.length - 1];
      last.result = JSON.stringify(result);
      last.correct = result.join("") === h.filter((_, i) => i !== len - n).join("");
      last.memNote = "Time: O(n) twice = O(n). Space: O(1).";
      return { steps, result: JSON.stringify(result), correct: last.correct, memNote: last.memNote };
    }
  ]
});

/* ================================================================
 * PROBLEM 0021 — MERGE TWO SORTED LISTS
 * ================================================================ */
NC150.register({
  id: "0021", title: "Merge Two Sorted Lists", difficulty: "Easy",
  url: "https://leetcode.com/problems/merge-two-sorted-lists/",
  tags: ["linked list", "merge"],
  approaches: ["Approach 1 · Iterative with dummy (best)", "Approach 2 · Recursive merge"],
  complexities: [
    { time: "O(n + m)", space: "O(1)", note: "BEST — rewires pointers, no copies" },
    { time: "O(n + m)", space: "O(n + m)", note: "call stack per node" }
  ],
  compare: [
    { name: "Copy + sort", tech: "dump both, sort all", time: "O((n+m) log(n+m))", space: "O(n+m)", when: "never — destroys the O(n) advantage", best: false },
    { name: "Iterative dummy", tech: "peel smaller head each round", time: "O(n+m)", space: "O(1)", when: "general case", best: true },
    { name: "Recursive", tech: "merge = smaller head + merge(rest)", time: "O(n+m)", space: "O(n+m)", when: "elegance, small inputs", best: false }
  ],
  inputs: [
    { name: "l1", label: "l1 =", type: "list", default: "[1,2,4]" },
    { name: "l2", label: "l2 =", type: "list", default: "[1,3,4]" }
  ],
  examples: [
    { label: "Ex 1", values: { l1: "[1,2,4]", l2: "[1,3,4]" }, result: "[1,1,2,3,4,4]" },
    { label: "Ex 2", values: { l1: "[]", l2: "[]" }, result: "[]" },
    { label: "Ex 3", values: { l1: "[]", l2: "[0]" }, result: "[0]" },
    { label: "Lopsided", values: { l1: "[5,6,7]", l2: "[1]" }, result: "[1,5,6,7]" }
  ],
  realLife: "<p>Database <b>merge joins</b>: two sorted tables are merged by peeling the smaller head — the exact same loop, at scale. The <b>merge</b> phase of Merge Sort is this algorithm (it IS the sort's backbone), and git uses it to splice two sorted commit histories into one.</p>",
  dsDive: `<h3>Why the 'tail leftover' shortcut is legal</h3>
<p>When one list empties, its remaining nodes are ALREADY sorted and ALREADY linked — you don't copy them, you just splice the whole remaining chain: <span class="code-cpp">tail-&gt;next = l1 ? l1 : l2</span>. That turns the last few rounds of peeling into O(1) work.</p>
<p>Compare with arrays: merging two arrays REQUIRES copying every element into new memory (no way to splice). Linked lists win here — pointer rewiring is the whole point of the data structure.</p>`,
  code: [
    "dummy = tail = ListNode(0)",
    "while l1 and l2:",
    "    if l1.val < l2.val:                   # peel the smaller head",
    "        tail.next = l1; l1 = l1.next",
    "    else:",
    "        tail.next = l2; l2 = l2.next",
    "    tail = tail.next",
    "tail.next = l1 or l2                      # splice the leftover chain",
    "return dummy.next"
  ],
  steps: [
    function (vals) {
      const a = vals.l1, b = vals.l2;
      const na = chain(a), nb = chain(b);
      const res = [];
      const steps = [];
      const snap = (text, code) => {
        const mem = [
          { type: "list", title: "l1", nodes: cloneNodes(na) },
          { type: "list", title: "l2", nodes: cloneNodes(nb) }
        ];
        if (res.length) mem.push({ type: "list", title: "merged so far", nodes: chain(res) });
        steps.push({ text, code, mem });
      };
      snap("Both lists sorted. Each round the answer is min(head1, head2) — a MERGE, not a re-sort.", 0);
      let i = 0, j = 0;
      while (i < a.length && j < b.length) {
        if (i < na.length) na[i].hot = true;
        if (j < nb.length) nb[j].hot = true;
        if (a[i] <= b[j]) {
          snap(`Heads: ${a[i]} vs ${b[j]} → take <b>${a[i]}</b> from l1.`, 2);
          res.push(a[i]);
          na[i].hot = false; na[i].done = true;
          i++;
        } else {
          snap(`Heads: ${a[i]} vs ${b[j]} → take <b>${b[j]}</b> from l2.`, 4);
          res.push(b[j]);
          nb[j].hot = false; nb[j].done = true;
          j++;
        }
        snap(`Append <b>${res[res.length - 1]}</b> to the merged tail.`, 6);
      }
      if (i < a.length) {
        const rest = a.slice(i);

          if (cache.size > cap) cache.delete(cache.keys().next().value);
        }
      }
      last.correct = JSON.stringify(out) === JSON.stringify(expected);
      last.memNote = "Time: O(capacity) per op — the scan kills it at scale. Space: O(capacity).";
      return { steps, result: JSON.stringify(out), correct: last.correct, memNote: last.memNote };
    }
  ]
});

  ],
  realLife: "<p>This is the 'two runners on an implicit graph' pattern: cycle detection WITHOUT building the graph. Real uses: <b>birthday-paradox dedup</b> in distributed hashing, detecting <b>hash-table probe cycles</b> (rehashed keys looping), and <b>IP loop detection</b> where the 'next hop' function f(i) is only computable on the fly — you cannot store all states.</p>",
  dsDive: `<h3>Why the array IS a linked list</h3>
<p>Define f(i) = nums[i]. Start at index 0 and chase: 0 → nums[0] → nums[nums[0]] → … Each value v ∈ [1, n] can be the image of TWO indices (that is what 'duplicate' means), so some value is pointed at twice — the walk must enter a cycle. The cycle ENTRY is the value pointed to by two different indices: EXACTLY the duplicate.</p>
<p>Floyd's meet point is inside the cycle, not at its entry. The second phase — walking from 0 and from the meet point at equal speed — converges at the entry in ≤ n steps. The same machinery as 0141, reused with zero extra memory.</p>`,
  code: [
    "slow = fast = nums[0]",
    "while True:",
    "    slow = nums[slow]          # 1 jump",
    "    fast = nums[nums[fast]]    # 2 jumps",
    "    if slow == fast: break     # meet inside the cycle",
    "slow = nums[0]",
    "while slow != fast:            # entry hunt: both go 1 step",

    "    fast = nums[fast]",

      walk.push(nums[0]);
