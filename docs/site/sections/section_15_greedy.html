/* ============ SHARED VERIFICATION HELPERS (independent checks) ============ */
function minJumps(nums) {
  if (nums.length <= 1) return 0;
  let jumps = 0, cur = 0, far = 0;
  for (let i = 0; i < nums.length - 1; i++) {
    far = Math.max(far, i + nums[i]);
    if (i === cur) { jumps++; cur = far; }
  }
  return jumps;
}
function canJumpGreedy(nums) {
  let reach = 0;
  for (let i = 0; i < nums.length; i++) {
    if (i > reach) return false;
    reach = Math.max(reach, i + nums[i]);
  }
  return reach >= nums.length - 1;
}
function canJumpBack(nums) {
  let pos = nums.length - 1;
  for (let i = nums.length - 2; i >= 0; i--) {
    if (i + nums[i] >= pos) pos = i;
  }
  return pos === 0;
}
function bruteMaxSub(nums) {
  let best = -Infinity;
  for (let i = 0; i < nums.length; i++) {
    let s = 0;
    for (let j = i; j < nums.length; j++) { s += nums[j]; if (s > best) best = s; }
  }
  return best;
}
function validStart(gas, cost, s) {
  const n = gas.length;
  let bal = 0;
  for (let k = 0; k < n; k++) {
    bal += gas[(s + k) % n] - cost[(s + k) % n];
    if (bal < 0) return false;
  }
  return true;
}
function bruteStart(gas, cost) {
  for (let s = 0; s < gas.length; s++) if (validStart(gas, cost, s)) return s;
  return -1;
}
function bruteParen(s) {
  let open = new Set([0]);
  for (const ch of s) {
    const nxt = new Set();
    for (const o of open) {
      if (ch === "(" || ch === "*") nxt.add(o + 1);
      if (ch === ")" || ch === "*") { if (o > 0) nxt.add(o - 1); }
    }
    open = nxt;
    if (!open.size) return false;
  }
  return open.has(0);
}
function checkParts(s, parts) {
  let idx = 0;
  for (const len of parts) {
    idx += len;
    for (const ch of new Set(s.slice(idx - len, idx))) if (s.lastIndexOf(ch) >= idx) return false;
  }
  return true;
}
function canStraights(hand, k) {
  if (hand.length % k) return false;
  const cnt = {};
  for (const c of hand) cnt[c] = (cnt[c] || 0) + 1;
  const keys = Object.keys(cnt).map(Number).sort((a, b) => a - b);
  for (const key of keys) {
    if (!cnt[key]) continue;
    const need = cnt[key];
    for (let v = key; v < key + k; v++) {
      if (cnt[v] === undefined || cnt[v] < need) return false;
      cnt[v] -= need;
    }
  }
  return true;
}
function mergeTarget(triplets, target) {
  const best = [0, 0, 0];
  for (const t of triplets) {
    if (t[0] <= target[0] && t[1] <= target[1] && t[2] <= target[2]) {
      best[0] = Math.max(best[0], t[0]);
      best[1] = Math.max(best[1], t[1]);
      best[2] = Math.max(best[2], t[2]);
    }
  }
  return best[0] === target[0] && best[1] === target[1] && best[2] === target[2];
}

    { name: "Backwards greedy", tech: "scan left for the first index that reaches pos", time: "O(n)", space: "O(1)", when: "different viewpoint", best: false },

  realLife: "<p><b>Packet routing / network hops</b>: the minimum number of router hops to a destination, where each router knows only how far it can forward — identical interval greedy.</p><p><b>Game level design</b>: 'minimum moves to the finish' with variable jump lengths; the farthest-reach-per-move bound is the standard trick.</p>",
  dsDive: `<h3>Why the farthest-reach greedy is optimal</h3>
<p>Think of jumps as BFS layers: jump #k covers the interval (curEndₖ₋₁, curEndₖ], built from the farthest reach of every index inside the previous interval. No plan can jump beyond farthest, so extending each layer to the max reach is never worse (exchange argument: swap any plan's jump for the greedy one and the reach only widens). One pass, two counters.</p>
<div class="equation">reach(i) = i + nums[i] &nbsp;→&nbsp; curEnd ← max reach(i) over i ∈ (prevEnd, curEnd]</div>
<p>The backwards greedy is the mirror: repeatedly pull the landing zone pos leftwards to the LEFTMOST index that can reach it — the longest possible jump, hence the fewest.</p>`,
  code: [
    [ "def jump(nums):",
      "    n = len(nums); jumps = 0",
      "    cur_end = farthest = 0          # current jump's interval",
      "    for i in range(n - 1):",
      "        farthest = max(farthest, i + nums[i])",
      "        if i == cur_end:            # interval exhausted → must jump",
      "            jumps += 1",
      "            cur_end = farthest",
      "    return jumps" ],
    [ "def jump(nums):",
      "    n = len(nums); jumps = 0",
      "    pos = n - 1                      # target index",
      "    while pos > 0:",
      "        i = 0",
      "        while i + nums[i] < pos: i += 1   # leftmost index reaching pos",
      "        jumps += 1; pos = i",
      "    return jumps" ]

  steps: [

      const reach = nums.map((v, i) => i + v);

        { type: "array", title: "reach = i + nums[i]", data: reach.slice(), cls: clsR || {}, showIdx: true, size: 4 }
      ]});
      if (n <= 1) {

      }
      let jumps = 0, curEnd = 0, farthest = 0;
      snap(`BFS-style greedy: index i can reach i + nums[i]. Jumps are BFS layers — each layer widens one interval.`, 1, { 0: "hot" }, { 0: "hot" });
      for (let i = 0; i < n - 1; i++) {
        farthest = Math.max(farthest, reach[i]);
        snap(`i=${i}: nums[i]=<b>${nums[i]}</b> → reach <b>${reach[i]}</b>; farthest so far = <b>${farthest}</b>.`, 4, { [i]: "hot" }, { [i]: "hot" });
        if (i === curEnd) {
          jumps++;
          snap(`i hit the current interval end (curEnd=${curEnd}) → <b>jump #${jumps}</b>; the interval now extends to farthest = ${farthest}.`, 5, { [curEnd]: "done", [farthest]: "hl" }, { [farthest]: "hl" });
          curEnd = farthest;
        }
      }
      const last = steps[steps.length - 1];
      last.result = String(jumps);
      last.correct = jumps === minJumps(nums);
      last.memNote = "Time O(n), space O(1) — two running counters only.";
      return { steps, result: last.result, correct: last.correct, memNote: last.memNote };
    },
    function (vals) {
      const nums = (vals.nums || []).map(Number);
      const n = nums.length;
      const reach = nums.map((v, i) => i + v);
      const steps = [];
      const snap = (text, code, clsA, clsR) => steps.push({ text, code, mem: [
        { type: "array", title: "nums · i = scanning index", data: nums.slice(), cls: clsA || {}, showIdx: true, size: 4 },
        { type: "array", title: "reach = i + nums[i]", data: reach.slice(), cls: clsR || {}, showIdx: true, size: 4 }
      ]});
      if (n <= 1) {
        steps.push({ text: "Only one position — <b>0</b> jumps.", code: 7, mem: [], result: "0", correct: true, memNote: "O(n) time, O(1) space." });
        return { steps, result: "0", correct: true, memNote: "O(n) time, O(1) space." };
      }
      let jumps = 0, pos = n - 1;
      snap(`Backwards greedy: work from the LAST index; each step picks the LEFTMOST index that can reach the current position (the longest possible backwards jump).`, 1, { [n - 1]: "done" }, {});
      while (pos > 0) {
        let found = -1;
        for (let i = 0; i < pos; i++) {
          if (reach[i] >= pos) {
            found = i;
            snap(`i=${i}: reach ${reach[i]} ≥ ${pos} → this index can jump onto pos. Leftmost = farthest back = one jump.`, 5, { [i]: "hot", [pos]: "done" }, { [i]: "hot" });
            break;
          }
          snap(`i=${i}: reach ${reach[i]} &lt; ${pos} → not far enough, scan further left.`, 5, { [i]: "hot", [pos]: "done" }, { [i]: "hot" });
        }
        if (found === -1) {
          jumps = -1;
          snap(`No index reaches pos=${pos} → the end is unreachable → <b>-1</b>.`, 5, {}, {});
          break;
        }
        jumps++;
        pos = found;
        snap(`<b>Jump #${jumps}</b>: landing zone pos moves to ${pos}.`, 6, { [pos]: "done" }, {});

      const last = steps[steps.length - 1];
      last.result = String(jumps);
      last.correct = jumps === minJumps(nums);

NC150.register({
  id: "0053", title: "Maximum Subarray", difficulty: "Medium",
  url: "https://leetcode.com/problems/maximum-subarray/",
  tags: ["greedy", "DP", "array"],
  approaches: ["Approach 1 · Kadane (best)", "Approach 2 · Prefix minimum"],
  complexities: [
    { time: "O(n)", space: "O(1)", note: "BEST — restart-or-extend rule" },
    { time: "O(n)", space: "O(1)", note: "hunt the cheapest starting prefix" }
  ],
  compare: [
    { name: "Kadane", tech: "cur = max(x, cur + x)", time: "O(n)", space: "O(1)", when: "the standard", best: true },
    { name: "Prefix minimum", tech: "best = max(S[i] − min S[j])", time: "O(n)", space: "O(1)", when: "derivation-friendly", best: false },
    { name: "Brute force", tech: "sum every window", time: "O(n²)", space: "O(1)", when: "tiny n only", best: false }
  ],
  inputs: [
    { name: "nums", label: "nums =", type: "list", default: "[-2,1,-3,4,-1,2,1,-5,4]" }
  ],
  examples: [
    { label: "Ex 1", values: { nums: "[5,4,-1,7,8]" }, result: "23" },
    { label: "Ex 2", values: { nums: "[1]" }, result: "1" },
    { label: "Ex 3", values: { nums: "[-2,-1]" }, result: "-1" }
  ],
  realLife: "<p><b>Trading bots</b>: the best contiguous run of daily returns is exactly max subarray — run in O(n) over millions of price ticks, with start/end timestamps tracked for free.</p><p><b>Signal processing</b>: finding the strongest contiguous burst in a sensor stream; Kadane's window tracking locates the burst boundaries.</p>",
  dsDive: `<h3>The restart rule, and why it is safe</h3>
<p>Kadane keeps <span class="code-var">cur = max(x, cur + x)</span>. The proof is local: if the running subarray is negative, extending it only drags the sum down, so restarting at x dominates. Equivalently, the max subarray equals max over i of (prefix S[i] − smallest prefix before i) — the A2 prefix-min view hunts that cheapest starting prefix.</p>
<div class="equation">best = max<sub>i</sub> ( S<sub>i</sub> − min<sub>j&lt;i</sub> S<sub>j</sub> ), &nbsp; S<sub>i</sub> = Σ<sub>k≤i</sub> nums[k]</div>
<p>Both are O(n) with O(1) extra state: one counter pair (A1) or one running prefix plus its running minimum (A2).</p>`,
  code: [
    [ "def max_subarray(nums):",
      "    best = -inf; cur = 0",
      "    for x in nums:",
      "        cur = max(x, cur + x)      # restart or extend",
      "        best = max(best, cur)",
      "    return best" ],
    [ "def max_subarray(nums):",
      "    running = min_pref = 0; best = -inf",
      "    for x in nums:",
      "        running += x",
      "        best = max(best, running - min_pref)   # subarray ending here",
      "        min_pref = min(min_pref, running)      # cheapest start",
      "    return best" ]
  ],
  steps: [
    function (vals) {
      const nums = (vals.nums || []).map(Number);
      const steps = [];
      const snap = (text, code, cls, st) => steps.push({ text, code, mem: [
        { type: "array", title: "nums · red = current subarray, green = best so far", data: nums.slice(), cls: cls || {}, showIdx: true, size: 4 },
        { type: "array", title: "running state · cur, best", data: st, cls: { 0: "hot" }, showIdx: true, size: 8 }
      ]});
      if (!nums.length) {
        steps.push({ text: "Empty array → sum 0.", code: 5, mem: [], result: "0", correct: true, memNote: "O(n)." });
        return { steps, result: "0", correct: true, memNote: "O(n)." };
      }
      let best = -Infinity, cur = 0, l = 0, bl = 0, br = -1;
      snap(`Kadane: cur = max(nums[i], cur + nums[i]) — either EXTEND the running subarray or RESTART at nums[i].`, 1, {}, [0, "−∞"]);
      for (let i = 0; i < nums.length; i++) {
        const prev = cur;
        const restart = prev + nums[i] < nums[i];
        if (restart) { cur = nums[i]; l = i; } else { cur += nums[i]; }
        const cls = {};
        for (let j = l; j <= i; j++) cls[j] = "hot";
        snap(`i=${i}: max(${nums[i]}, ${prev} + ${nums[i]}) = <b>${cur}</b> → ${restart ? "RESTART at " + i : "extend window [" + l + ".." + i + "]"}.`, 3, cls, [cur, best === -Infinity ? "−∞" : best]);
        if (cur > best) { best = cur; bl = l; br = i; }
        const cls2 = {};
        for (let j = bl; j <= br; j++) cls2[j] = "done";
        snap(`best = max(best, cur) = <b>${best}</b> (window [${bl}..${br}]).`, 4, cls2, [cur, best]);
      }
      const last = steps[steps.length - 1];
      last.result = String(best);
      last.correct = best === bruteMaxSub(nums);
      last.memNote = "Time O(n), space O(1) — cur and best only.";
      return { steps, result: last.result, correct: last.correct, memNote: last.memNote };
    },
    function (vals) {
      const nums = (vals.nums || []).map(Number);
      const n = nums.length;
      const steps = [];
      const pref = Array(n).fill("·");
      const snap = (text, code, cls, clsP) => steps.push({ text, code, mem: [
        { type: "array", title: "nums · i = current", data: nums.slice(), cls: cls || {}, showIdx: true, size: 4 },
        { type: "array", title: "prefix sums S[i] (green = min prefix so far)", data: pref.slice(), cls: clsP || {}, showIdx: true, size: 4 }
      ]});
      if (!n) {
        steps.push({ text: "Empty array → sum 0.", code: 6, mem: [], result: "0", correct: true, memNote: "O(n)." });
        return { steps, result: "0", correct: true, memNote: "O(n)." };
      }
      let running = 0, minP = 0, minIdx = -1, best = -Infinity;
      snap(`Prefix view: best subarray ending at i = S[i] − smallest S[j] with j &lt; i. Hunt the cheapest starting prefix.`, 1, {}, {});
      for (let i = 0; i < n; i++) {
        running += nums[i];
        pref[i] = running;
        const cand = running - minP;
        if (cand > best) best = cand;
        const clsP = { [i]: "hot" };
        if (minIdx >= 0) clsP[minIdx] = "done";
        snap(`i=${i}: S = ${running}; S − minPrefix(${minP}) = <b>${cand}</b> → best = ${best}.`, 4, { [i]: "hot" }, clsP);
        if (running < minP) {
          minP = running; minIdx = i;
          const clsP2 = { [i]: "hot" };
          clsP2[minIdx] = "done";
          snap(`S = ${running} is the new smallest prefix → future subarrays can start right after index ${i}.`, 5, { [i]: "hot" }, clsP2);
        }
      }
      const last = steps[steps.length - 1];
      last.result = String(best);
      last.correct = best === bruteMaxSub(nums);
      last.memNote = "Time O(n), space O(1) — running sum + min prefix.";
      return { steps, result: last.result, correct: last.correct, memNote: last.memNote };
    }
  ]
});
