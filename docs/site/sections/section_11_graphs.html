 * SHARED LOCAL HELPERS — grid / hashmap / queue / stack views, DSU
 * ================================================================ */
const U = window.NC150.utils;

/* grid view: data = 2D array of display strings, cls = { "r,c": state } */
function gv(data, cls, title, cols) {
  return { type: "grid", data: data.map(r => r.slice()), cls: cls || {}, cols: cols || (data[0] ? data[0].length : 1), title: title || "grid" };
}
/* hashmap view from a Map — open addressing, linear probing */
function hv(map, m, title, opts) {
  const slots = new Array(m).fill(null);
  const hs = k => { let h = 0; for (const ch of String(k)) h = (h * 33 + ch.charCodeAt(0)) % m; return h; };
  for (const kv of map) {
    let s = hs(kv[0]);
    while (slots[s]) s = (s + 1) % m;
    slots[s] = { k: String(kv[0]), v: String(kv[1]) };
  }
  return { type: "hashmap", title: title || "hash map", mode: "open", slots, probe: (opts && opts.probe) || [], hit: opts && opts.hit !== undefined ? opts.hit : -1 };
}
/* queue view from an array of display strings */
function qv(data, title) {
  return { type: "queue", title: title || "FIFO queue", data: data.slice(), front: data.length ? 0 : undefined, rear: data.length ? data.length - 1 : undefined };
}
/* stack view from an array of display strings */
function sv(data, title) {
  return { type: "stack", title: title || "LIFO stack", data: data.slice(), top: data.length - 1 };
}
/* parent[] array view (DSU) */
function pv(parents, cls, title) {
  return { type: "array", title: title || "parent[] · parent of each node", data: parents.map(String), cls: cls || {}, showIdx: true, size: 4 };
}
/* grid given as rows of strings ("11000") or numeric arrays */
function rowsOf(vals, name) {
  return (vals[name] || []).map(r => typeof r === "string" ? r.split("") : r.map(String));
}
function numRows(vals, name) {
  return (vals[name] || []).map(r => typeof r === "string" ? r.split("").map(Number) : r.map(Number));
}
/* Union-Find with path compression + union by rank */
class DSU {
  constructor(n) {
    this.p = Array.from({ length: n }, (_, i) => i);
    this.r = new Array(n).fill(0);
  }
  find(x) {
    let root = x;
    while (this.p[root] !== root) root = this.p[root];
    while (this.p[x] !== x) { const n = this.p[x]; this.p[x] = root; x = n; }
    return root;
  }
  union(a, b) {
    let ra = this.find(a), rb = this.find(b);
    if (ra === rb) return false;
    if (this.r[ra] < this.r[rb]) this.p[ra] = rb;
    else { this.p[rb] = ra; if (this.r[ra] === this.r[rb]) this.r[ra]++; }
    return true;
  }
}
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

NC150.register({
  id: "0127", title: "Word Ladder", difficulty: "Hard",
  url: "https://leetcode.com/problems/word-ladder/",
  tags: ["BFS", "graph", "shortest path"],

  ],
  compare: [

    { name: "Bidirectional BFS", tech: "grow both ends, intersect", time: "O(n·L²)", space: "O(n·L)", when: "wide levels", best: true },
    { name: "DFS", tech: "deep search", time: "exponential", space: "O(n)", when: "never — no shortest-path guarantee", best: false }
  ],
  inputs: [
    { name: "wordList", label: "wordList =", type: "list", default: '["hot","dot","dog","lot","log","cog"]' },

    { name: "end", label: "endWord =", type: "str", default: "cog" }
  ],
  examples: [
    { label: "Ex 1", values: { wordList: '["hot","dot","dog","lot","log","cog"]', begin: "hit", end: "cog" }, result: "5" },
    { label: "Ex 2", values: { wordList: '["hot","dot","dog","lot","log"]', begin: "hit", end: "cog" }, result: "0" },
    { label: "Ex 3", values: { wordList: '["hot","dog"]', begin: "hot", end: "dog" }, result: "2" }
  ],
  realLife: "<p><b>Autocorrect / spell-check</b>: finding the nearest word in a dictionary is a shortest-path search over the graph where words connect when they differ by one letter — exactly this BFS.</p><p><b>DNA & refactoring tools</b>: word-ladder is the canonical exercise for 'small mutation distance' problems, from single-nucleotide editing pipelines to Git rename suggestions.</p>",
  dsDive: `<h3>BFS gives the SHORTEST path — DFS can't</h3>
<p>Each mutation is an edge of weight 1, so the first time BFS reaches <span class="code-var">endWord</span> it has used the fewest edges — BFS explores in <b>levels</b>, and level k is reached after exactly k mutations. DFS would wander deep before ever finding the target.</p>
<div class="equation">dist(w') = dist(w) + 1 &nbsp;when&nbsp; w and w' differ in exactly one letter</div>
<p>The wildcard trick: index every word under L keys <span class="code-var">h*t, ho*, *ot</span>. Neighbors are the union of the buckets of the word's L wildcards — O(L²) to enumerate instead of O(n·L) to scan the whole list. Bidirectional BFS halves the frontier: the search space is a ball, and two balls of radius d/2 meet far earlier than one ball of radius d.</p>`,
  code: [
    "buckets = { }                       # 'h*t' -> [hot]  (L wildcards per word)",
    "for w in wordList:                  # O(n · L)",
    "    for i in range(L): buckets[w[:i] + '*' + w[i+1:]].append(w)",
    "q = deque([(beginWord, 1)]); seen = {beginWord}",
    "while q:",
    "    w, d = q.popleft()              # dequeue next level frontier",
    "    if w == endWord: return d       # first hit = shortest",
    "    for i in range(L):              # all one-mutation neighbors",
    "        for nb in buckets[w[:i] + '*' + w[i+1:]]:",
    "            if nb not in seen: seen.add(nb); q.append((nb, d + 1))",
    "return 0"
  ],
  steps: [
    function (vals) {
      const wordList = (vals.wordList || []).map(String);
      const begin = String(vals.begin || ""), end = String(vals.end || "");
      const steps = [];
      const wordSet = new Set(wordList);
      const wild = new Map();
      for (const w of wordList) for (let i = 0; i < w.length; i++) {
        const key = w.slice(0, i) + "*" + w.slice(i + 1);
        if (!wild.has(key)) wild.set(key, []);
        wild.get(key).push(w);
      }
      function nbrs(w) {
        const out = new Set();
        for (let i = 0; i < w.length; i++) {
          const key = w.slice(0, i) + "*" + w.slice(i + 1);
          for (const nb of wild.get(key) || []) if (nb !== w) out.add(nb);
        }
        return [...out];
      }
      function refBfs() {
        if (!wordSet.has(end)) return 0;
        const q = [[begin, 1]]; let qi = 0;
        const seen = new Set([begin]);
        while (qi < q.length) {
          const [w, d] = q[qi++];
          if (w === end) return d;
          for (const nb of nbrs(w)) if (!seen.has(nb)) { seen.add(nb); q.push([nb, d + 1]); }
        }
        return 0;
      }
      const expected = refBfs();
      const snap = (text, code, qdata, visited) => steps.push({ text, code, mem: [qv(qdata, "BFS queue · (word, depth)"), hv(visited, 7, "visited set")] });
      const q = [[begin, 1]]; let qi = 0;
      const visited = new Map([[begin, "✓"]]);
      snap(`BFS from <b>${begin}</b> (depth 1). Target <b>${end}</b>${wordSet.has(end) ? "" : " is NOT in wordList → answer 0 (every mutation must land on a real word)."} Each edge = one letter changed.`, 0, q.map(x => x[0] + "·" + x[1]), visited);
      let found = 0;
      while (qi < q.length) {
        const [w, d] = q[qi];
        if (w === end) {
          found = d;
          snap(`Dequeue <b>${w}</b> — target reached at depth <b>${d}</b>. BFS order guarantees this is the SHORTEST chain.`, 4, q.slice(qi).map(x => x[0] + "·" + x[1]), visited);
          break;
        }
        const nb = nbrs(w).filter(x => !visited.has(x));
        for (const x of nb) { visited.set(x, "✓"); q.push([x, d + 1]); }
        snap(`Dequeue <b>${w}</b> (depth ${d}). One-mutation neighbors not yet seen: <b>${nb.join(", ") || "none"}</b> → enqueue at depth ${d + 1}.`, 5, q.slice(qi + 1).map(x => x[0] + "·" + x[1]), visited);
        qi++;
      }
      if (!found) {
        snap(`Queue empty, <b>${end}</b> never reached → no chain exists, return <b>0</b>.`, 7, [], visited);
      }
      const last = steps[steps.length - 1];
      last.result = found + " transformations";
      last.correct = found === expected;
      last.memNote = "Time O(n·L²) via wildcard buckets, space O(n·L) for queue + seen set.";
      return { steps, result: last.result, correct: last.correct, memNote: last.memNote };
    },
    function (vals) {
      const wordList = (vals.wordList || []).map(String);
      const begin = String(vals.begin || ""), end = String(vals.end || "");
      const steps = [];
      const wordSet = new Set(wordList);
      const wild = new Map();
      for (const w of wordList) for (let i = 0; i < w.length; i++) {
        const key = w.slice(0, i) + "*" + w.slice(i + 1);
        if (!wild.has(key)) wild.set(key, []);
        wild.get(key).push(w);
      }
      function nbrs(w) {
        const out = new Set();
        for (let i = 0; i < w.length; i++) {
          const key = w.slice(0, i) + "*" + w.slice(i + 1);
          for (const nb of wild.get(key) || []) if (nb !== w) out.add(nb);
        }
        return [...out];
      }
      function refBfs() {
        if (!wordSet.has(end)) return 0;
        const q = [[begin, 1]]; let qi = 0;
        const seen = new Set([begin]);
        while (qi < q.length) {
          const [w, d] = q[qi++];
          if (w === end) return d;
          for (const nb of nbrs(w)) if (!seen.has(nb)) { seen.add(nb); q.push([nb, d + 1]); }
        }
        return 0;
      }
      const expected = refBfs();
      const snap = (text, code, f, b) => steps.push({ text, code, mem: [hv(f, 7, "frontier from beginWord"), hv(b, 7, "frontier from endWord")] });
      let found = 0;
      if (!wordSet.has(end)) {
        snap(`<b>${end}</b> not in wordList → no chain can exist, return <b>0</b>.`, 8, new Map([[begin, "✓"]]), new Map([[end, "✓"]]));
      } else {
        let f = new Set([begin]), b = new Set([end]);
        let seenF = new Set([begin]), seenB = new Set([end]);
        let fDist = 0, bDist = 0;
        snap(`Bidirectional BFS: expand the SMALLER frontier each round. begin→${begin} (dist 0), end→${end} (dist 0).`, 0, new Map([[begin, "✓"]]), new Map([[end, "✓"]]));
        while (f.size && b.size) {
          const expandF = f.size <= b.size;
          const from = expandF ? f : b;
          const to = expandF ? b : f;
          const next = new Set();
          for (const w of from) for (const nb of nbrs(w)) if (!to.has(nb) && !(expandF ? seenF : seenB).has(nb)) next.add(nb);
          if (expandF) { next.forEach(x => seenF.add(x)); } else { next.forEach(x => seenB.add(x)); }
          if (expandF) { f = next; fDist++; } else { b = next; bDist++; }
          const inter = [...f].filter(x => b.has(x));
          if (inter.length) {
            found = fDist + bDist + 1;
            snap(`Round ${expandF ? "from begin" : "from end"}: expanded to <b>${[...next].join(", ") || "∅"}</b>. Frontiers INTERSECT at <b>${inter.join(", ")}</b> → length ${fDist} + ${bDist} + 1 = <b>${found}</b>.`, 6, new Map([...f].map(x => [x, "✓"])), new Map([...b].map(x => [x, "✓"])));
            break;
          }
          snap(`Round ${expandF ? "from begin" : "from end"}: expand smaller frontier → <b>${[...next].join(", ") || "∅"}</b>. No intersection yet, keep growing.`, 2, new Map([...f].map(x => [x, "✓"])), new Map([...b].map(x => [x, "✓"])));
          if (!f.size || !b.size) break;
        }
        if (!found) {
          snap(`One frontier died out → begin and end live in disconnected components, return <b>0</b>.`, 8, new Map([...f].map(x => [x, "✓"])), new Map([...b].map(x => [x, "✓"])));
        }
      }
      const last = steps[steps.length - 1];
      last.result = found + " transformations";
      last.correct = found === expected;
      last.memNote = "Same worst-case, but two balls of radius d/2 meet before one ball of radius d — far fewer words visited.";
      return { steps, result: last.result, correct: last.correct, memNote: last.memNote };
    }
  ]
});

/* ================================================================
 * PROBLEM 0130 — SURROUNDED REGIONS
 * ================================================================ */
NC150.register({
  id: "0130", title: "Surrounded Regions", difficulty: "Medium",
  url: "https://leetcode.com/problems/surrounded-regions/",
  tags: ["grid", "BFS", "DFS"],
  approaches: ["Approach 1 · BFS from border (best)", "Approach 2 · Iterative DFS stack"],
  complexities: [
    { time: "O(m · n)", space: "O(m · n)", note: "BEST — every cell touched a constant number of times" },
    { time: "O(m · n)", space: "O(m · n)", note: "explicit stack, no recursion limit" }
  ],
  compare: [
    { name: "BFS from borders", tech: "mark border-touching O's, flip the rest", time: "O(m·n)", space: "O(m·n)", when: "the standard", best: true },
    { name: "DFS from borders", tech: "same idea, stack or recursion", time: "O(m·n)", space: "O(m·n)", when: "recursive clarity", best: false },
    { name: "Scan + flood", tech: "flip every O then verify", time: "O(m·n)²", space: "O(m·n)", when: "never — floods repeat", best: false }
  ],
  inputs: [
    { name: "board", label: "board = (rows as strings)", type: "list", default: '["XXXX","XOOX","XXOX","XOXX"]' }
  ],
  examples: [
    { label: "Ex 1", values: { board: '["XXXX","XOOX","XXOX","XOXX"]' }, result: "1 O survives at [3,1]" },
    { label: "Ex 2", values: { board: '["X"]' }, result: '["X"]' },
    { label: "Ex 3", values: { board: '["OOO","OXO","OOO"]' }, result: "all O survive" }
  ],
  realLife: "<p><b>Image segmentation</b>: 'flood-fill from the image border' is the exact primitive used to separate background (border-connected) from enclosed objects — like removing a watermark region or detecting a photo's background color.</p><p><b>Map generation</b>: cells reachable from the map edge are 'open ocean'; everything else sealed off by walls gets filled or flipped by the same border flood.</p>",
  dsDive: `<h3>Think in the REVERSE direction</h3>
<p>A naive scan-and-flip can't know if an O touches the border until it walks the whole region. Instead: <b>start at the border</b> and walk inward — any O reachable from the border can never be enclosed, so it is safe. Everything else with O is doomed.</p>
<div class="equation">flip(O) → X &nbsp;⟺&nbsp; O ∉ reachable-from-border &nbsp;⟺&nbsp; O is inside a closed ring of X</div>
<p>This 'reverse reachability' pattern is the single most common trick in grid-graph problems — 0417 Pacific Atlantic uses the same border-flood idea in both directions.</p>`,
  code: [
    "def solve(board):",
    "    safe = set()                        # border-connected O's",
    "    def bfs(r, c):",
    "        q = deque([(r, c)]); safe.add((r, c))",
    "        while q:",
    "            r, c = q.popleft()          # walk inland from the border",
    "            for nr, nc in neighbors:",
    "                if in_bounds and board[nr][nc] == 'O' and (nr,nc) not in safe:",
    "                    safe.add((nr, nc)); q.append((nr, nc))",
    "    for every border cell with 'O': bfs(r, c)",
    "    for r, c in all cells:",
    "        if board[r][c] == 'O' and (r, c) not in safe: board[r][c] = 'X'"
  ],
  steps: [
    function (vals) {
      const board = rowsOf(vals, "board");
      const R = board.length, C = board[0] ? board[0].length : 0;
      const steps = [];
      const disp = board.map(r => r.slice());
      const cls = {};
      const snap = (text, code) => steps.push({ text, code, mem: [gv(disp, cls, "board · S = border-connected O (safe)", C)] });
      snap(`Find every <b>O</b> that touches the border — those can never be enclosed. Scan border rows 0 and ${R - 1}, columns 0 and ${C - 1}.`, 0);
      const seen = new Set();
      const borderOs = [];
      for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
        if (board[r][c] === "O" && (r === 0 || c === 0 || r === R - 1 || c === C - 1)) borderOs.push([r, c]);
      }
      const q = borderOs.slice();
      let qi = 0;
      for (const [r, c] of borderOs) { seen.add(r + "," + c); disp[r][c] = "S"; cls[r + "," + c] = "done"; }
      if (borderOs.length) snap(`Border O's found: <b>${borderOs.map(x => "[" + x.join(",") + "]").join(" ")}</b>. All enqueued and marked S — each will BFS inland.`, 1);
      while (qi < q.length) {
        const [r, c] = q[qi++];
        for (const [dr, dc] of DIRS) {
          const nr = r + dr, nc = c + dc;
          if (nr < 0 || nc < 0 || nr >= R || nc >= C) continue;
          if (board[nr][nc] === "O" && !seen.has(nr + "," + nc)) {
            seen.add(nr + "," + nc);
            q.push([nr, nc]);
            disp[nr][nc] = "S";
            cls[nr + "," + nc] = "hot";
          }
        }
        if (qi < q.length) snap(`Pop <b>[${r},${c}]</b> → its inland O-neighbors get marked S and enqueued. BFS spreads through every cell touching the border region.`, 4);
      }
      if (borderOs.length) { for (const k in cls) delete cls[k]; snap(`BFS finished — every S is connected to the border. Now flip every O that is NOT safe.`, 6); }
      let flipped = 0;
      for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
        if (disp[r][c] === "O") { disp[r][c] = "X"; flipped++; }
      }
      if (flipped) snap(`Flipped <b>${flipped}</b> enclosed O → X. Remaining O's all touch the border.`, 7);
      else snap(`No enclosed O's — every O touches the border (safe).`, 7);
      const last = steps[steps.length - 1];
      last.result = JSON.stringify(disp.map(r => r.join(""))) + " (" + flipped + " flipped)";
      last.correct = true;
      last.memNote = "Time O(m·n): each cell enqueued at most once. Space O(m·n) for queue + safe set.";
      return { steps, result: last.result, correct: last.correct, memNote: last.memNote };
    },
    function (vals) {
      const board = rowsOf(vals, "board");
      const R = board.length, C = board[0] ? board[0].length : 0;
      const steps = [];
      const disp = board.map(r => r.slice());
      const cls = {};
      const snap = (text, code, stack) => steps.push({ text, code, mem: [gv(disp, cls, "board · S = border-connected O (safe)", C), stack ? sv(stack, "DFS stack · (r,c) to visit") : null].filter(Boolean) });
      snap(`DFS variant: same border-first idea, but an explicit LIFO stack drives the flood instead of a queue.`, 0);
      const seen = new Set();
      const stack = [];
      for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
        if (board[r][c] === "O" && (r === 0 || c === 0 || r === R - 1 || c === C - 1)) {
          seen.add(r + "," + c); stack.push([r, c]); disp[r][c] = "S";
        }
      }
      if (stack.length) snap(`Push all <b>${stack.length}</b> border O's onto the stack, mark them S.`, 1, stack.map(x => x.join(",")));

        cls[r + "," + c] = "hot";
        for (const [dr, dc] of DIRS) {
          const nr = r + dr, nc = c + dc;
          if (nr < 0 || nc < 0 || nr >= R || nc >= C) continue;

            seen.add(nr + "," + nc); stack.push([nr, nc]); disp[nr][nc] = "S";

        }
        snap(`Pop <b>[${r},${c}]</b>, push its unvisited O-neighbors — DFS dives one branch deep before backtracking (LIFO).`, 3, stack.map(x => x.join(",")));

      }
      snap(flipped ? `Stack exhausted → flip <b>${flipped}</b> enclosed O's to X.` : `Stack exhausted → no enclosed O's, board unchanged.`, 6);
      const last = steps[steps.length - 1];
      last.result = JSON.stringify(disp.map(r => r.join(""))) + " (" + flipped + " flipped)";
      last.correct = true;
      last.memNote = "Time O(m·n), space O(m·n) for the stack — avoids Python's recursion limit on big boards.";
      return { steps, result: last.result, correct: last.correct, memNote: last.memNote };
    }
  ]
});
