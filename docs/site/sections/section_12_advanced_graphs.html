<script>
const SECTION = { id: "12", title: "Advanced Graphs" };

/* ================================================================
 * SHARED HELPERS — binary min-heap, disjoint-set, memory-view
 * builders, and ground-truth reference algorithms (used by the
 * step generators to compute the real answers inline).
 * ================================================================ */

/* binary min-heap keyed on .key — powers every Dijkstra-style run */
class MiniHeap {
  constructor() { this.a = []; }
  size() { return this.a.length; }
  push(x) {
    this.a.push(x);
    let i = this.a.length - 1;
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (this.a[p].key <= this.a[i].key) break;
      const t = this.a[p]; this.a[p] = this.a[i]; this.a[i] = t;
      i = p;
    }
  }
  pop() {
    const top = this.a[0];
    const last = this.a.pop();
    if (this.a.length) {
      this.a[0] = last;
      let i = 0;
      for (;;) {
        const l = 2 * i + 1, r = 2 * i + 2;
        let m = i;
        if (l < this.a.length && this.a[l].key < this.a[m].key) m = l;
        if (r < this.a.length && this.a[r].key < this.a[m].key) m = r;
        if (m === i) break;
        const t = this.a[m]; this.a[m] = this.a[i]; this.a[i] = t;
        i = m;
      }
    }
    return top;
  }
}

/* disjoint-set with union by rank + path halving — powers Kruskal */
class DSU {
  constructor(n) {
    this.p = Array.from({ length: n }, (_, i) => i);
    this.r = new Array(n).fill(0);
  }
  find(x) {
    while (this.p[x] !== x) { this.p[x] = this.p[this.p[x]]; x = this.p[x]; }
    return x;
  }
  union(a, b) {
    a = this.find(a); b = this.find(b);
    if (a === b) return false;
    if (this.r[a] < this.r[b]) { const t = a; a = b; b = t; }
    this.p[b] = a;
    if (this.r[a] === this.r[b]) this.r[a]++;
    return true;
  }
}

/* memory-view builders (schemas match engine.js renderers) */
function hashView(title, slots, formula) {
  return { type: "hashmap", title: title, slots: slots, probe: [], hit: -1, formula: formula || "", mode: "open" };
}
function queueView(title, data, front, rear) {
  return { type: "queue", title: title, data: data, front: front, rear: rear };
}
function stackView(title, data, top) {
  return { type: "stack", title: title, data: data, top: top };
}
function arrView(title, data, cls, size) {
  return { type: "array", title: title, data: data, cls: cls || {}, showIdx: true, size: size || 4 };
}
function heapView(title, data) {
  return { type: "heap", title: title, data: data, showIdx: true, size: 8 };
}
function infStr(v) { return v === Infinity ? "∞" : String(v); }

/* ---------- ground-truth reference algorithms ---------- */

/* 0269 — Kahn's algorithm (canonical order or "") */
function refAlien(words) {
  const chars = [], inSet = {};
  words.forEach(w => String(w).split("").forEach(c => { if (!inSet[c]) { inSet[c] = 1; chars.push(c); } }));
  const adj = {}, indeg = {};
  chars.forEach(c => { adj[c] = []; indeg[c] = 0; });
  for (let i = 0; i + 1 < words.length; i++) {
    const a = String(words[i]), b = String(words[i + 1]);
    const L = Math.min(a.length, b.length);
    let j = 0;
    while (j < L && a[j] === b[j]) j++;
    if (j === L) { if (a.length > b.length) return ""; continue; }
    const x = a[j], y = b[j];
    if (x !== y && !adj[x].includes(y)) { adj[x].push(y); indeg[y]++; }
  }
  const q = chars.filter(c => indeg[c] === 0);
  const order = [];
  while (q.length) {
    const c = q.shift();
    order.push(c);
    adj[c].forEach(nxt => { indeg[nxt]--; if (indeg[nxt] === 0) q.push(nxt); });
  }
  return order.length === chars.length ? order.join("") : "";
}
/* 0269 — validator: is `order` a valid topological sort of the words? */
function validTopo(order, words) {
  const expected = refAlien(words);
  if (expected === "") return order === "";
  if (order.length !== expected.length) return false;
  const pos = {};
  for (let i = 0; i < order.length; i++) pos[order[i]] = i;
  for (let i = 0; i + 1 < words.length; i++) {
    const a = String(words[i]), b = String(words[i + 1]);
    const L = Math.min(a.length, b.length);
    let j = 0;
    while (j < L && a[j] === b[j]) j++;
    if (j === L) continue;
    const x = a[j], y = b[j];
    if (x !== y && pos[x] > pos[y]) return false;
  }
  return true;
}
/* 0332 — Hierholzer: lexicographically smallest Eulerian path */
function refItinerary(tickets) {
  if (!tickets.length) return ["JFK"];
  const adj = {};
  tickets.forEach(t => {
    const a = String(t[0]), b = String(t[1]);
    (adj[a] = adj[a] || []).push(b);
  });
  Object.keys(adj).forEach(k => adj[k].sort((x, y) => y.localeCompare(x)));
  if (!adj["JFK"]) return [];
  const route = [];
  (function dfs(u) {
    while ((adj[u] || []).length) dfs(adj[u].pop());
    route.push(u);
  })("JFK");
  return route.reverse();
}
/* 0743 — Dijkstra (reference for the Bellman-Ford approach) */
function refDelay(edges, n, k) {
  const dist = new Array(n + 1).fill(Infinity);
  if (k >= 1 && k <= n) dist[k] = 0;
  const settled = new Array(n + 1).fill(false);
  const heap = new MiniHeap();
  heap.push({ node: k, key: 0 });
  while (heap.size()) {
    const it = heap.pop();
    if (settled[it.node]) continue;
    settled[it.node] = true;
    edges.forEach(e => {
      const u = Number(e[0]), v = Number(e[1]), w = Number(e[2]);
      if (u === it.node && v >= 1 && v <= n && !settled[v] && it.key + w < dist[v]) {
        dist[v] = it.key + w;
        heap.push({ node: v, key: dist[v] });
      }
    });
  }
  if (dist.slice(1).some(d => d === Infinity)) return -1;
  return dist.slice(1).reduce((m, d) => Math.max(m, d), -1);
}
/* 0743 — Bellman-Ford (reference for the Dijkstra approach) */
function refDelayBF(edges, n, k) {
  const dist = new Array(n + 1).fill(Infinity);
  if (k >= 1 && k <= n) dist[k] = 0;
  for (let i = 1; i < n; i++) {
    let ch = false;
    edges.forEach(e => {
      const u = Number(e[0]), v = Number(e[1]), w = Number(e[2]);
      if (u >= 1 && u <= n && v >= 1 && v <= n && dist[u] !== Infinity && dist[u] + w < dist[v]) {
        dist[v] = dist[u] + w; ch = true;
      }
    });
    if (!ch) break;
  }
  if (dist.slice(1).some(d => d === Infinity)) return -1;
  return dist.slice(1).reduce((m, d) => Math.max(m, d), -1);
}
/* 0778 — binary search + BFS feasibility */
function refSwim(grid) {
  const g = grid.map(r => r.map(Number));
  const n = g.length;
  if (n === 0) return 0;
  function feas(T) {
    if (g[0][0] > T) return false;
    const seen = g.map(r => r.map(() => false));
    const q = [[0, 0]];
    seen[0][0] = true;
    while (q.length) {
      const p = q.shift();
      if (p[0] === n - 1 && p[1] === n - 1) return true;
      const dr = [1, -1, 0, 0], dc = [0, 0, 1, -1];
      for (let d = 0; d < 4; d++) {
        const nr = p[0] + dr[d], nc = p[1] + dc[d];
        if (nr >= 0 && nc >= 0 && nr < n && nc < n && !seen[nr][nc] && g[nr][nc] <= T) {
          seen[nr][nc] = true; q.push([nr, nc]);
        }
      }
    }
    return false;
  }
  let lo = 0, hi = n * n - 1, ans = hi;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (feas(mid)) { ans = mid; hi = mid - 1; } else { lo = mid + 1; }
  }
  return ans;
}
/* 0787 — Bellman-Ford capped at k stops */
function refCheapestBF(flights, n, src, dst, k) {
  let dist = new Array(n).fill(Infinity);
  if (src >= 0 && src < n) dist[src] = 0;
  const rounds = Math.max(k + 1, 0);
  for (let i = 0; i < rounds; i++) {
    const nd = dist.slice();
    flights.forEach(f => {
      const u = Number(f[0]), v = Number(f[1]), w = Number(f[2]);
      if (u >= 0 && u < n && v >= 0 && v < n && dist[u] !== Infinity && dist[u] + w < nd[v]) nd[v] = dist[u] + w;
    });
    dist = nd;
  }
  return dist[dst] === Infinity ? -1 : dist[dst];
}
/* 0787 — Dijkstra keyed on price, with a stop limit */
function refCheapestDJ(flights, n, src, dst, k) {
  const heap = new MiniHeap();
  heap.push({ node: src, key: 0, stops: 0 });
  let best = Infinity;
  let guard = 0;
  while (heap.size() && guard++ < 500) {
    const it = heap.pop();
    if (it.key >= best) continue;
    if (it.node === dst) { best = it.key; break; }
    if (it.stops > k) continue;
    flights.forEach(f => {
      const u = Number(f[0]), v = Number(f[1]), w = Number(f[2]);
      if (u === it.node && v >= 0 && v < n && it.stops + 1 <= k + 1) heap.push({ node: v, key: it.key + w, stops: it.stops + 1 });
    });
  }
  return best === Infinity ? -1 : best;
}
/* 1584 — Prim (reference for the Kruskal approach) */
function refMST(pts) {
  const p = pts.map(pt => [Number(pt[0]), Number(pt[1])]);
  const n = p.length;
  if (n <= 1) return 0;
  const inMST = new Array(n).fill(false);
  const heap = new MiniHeap();
  heap.push({ to: 0, key: 0 });
  let cost = 0;
  while (heap.size()) {
    const it = heap.pop();
    if (inMST[it.to]) continue;
    inMST[it.to] = true;
    cost += it.key;
    for (let v = 0; v < n; v++) {
      if (inMST[v]) continue;
      heap.push({ to: v, key: Math.abs(p[it.to][0] - p[v][0]) + Math.abs(p[it.to][1] - p[v][1]) });
    }
  }
  return cost;
}
/* 1584 — Kruskal (reference for the Prim approach) */
function refKruskal(pts) {
  const p = pts.map(pt => [Number(pt[0]), Number(pt[1])]);
  const n = p.length;
  if (n <= 1) return 0;
  const edges = [];
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++)
    edges.push([i, j, Math.abs(p[i][0] - p[j][0]) + Math.abs(p[i][1] - p[j][1])]);
  edges.sort((a, b) => a[2] - b[2]);
  const dsu = new DSU(n);
  let cost = 0, joined = 0;
  for (const e of edges) {
    if (dsu.find(e[0]) !== dsu.find(e[1])) {
      dsu.union(e[0], e[1]);
      cost += e[2];
      joined++;
      if (joined === n - 1) break;
    }
  }
  return cost;
}

/* ================================================================
 * PROBLEM 0269 — ALIEN DICTIONARY
 * ================================================================ */
NC150.register({
  id: "0269", title: "Alien Dictionary", difficulty: "Hard",
  url: "https://leetcode.com/problems/alien-dictionary/",
  tags: ["graph", "topological sort"],
  approaches: ["Approach 1 · Kahn BFS (indegree)", "Approach 2 · DFS postorder"],
  complexities: [
    { time: "O(V + E)", space: "O(V)", note: "BEST — one queue pass" },
    { time: "O(V + E)", space: "O(V)", note: "cycle via 3-color marking" }
  ],
  compare: [
    { name: "Kahn BFS", tech: "indegree + queue", time: "O(V+E)", space: "O(V)", when: "the standard, iterative", best: true },
    { name: "DFS postorder", tech: "3-color cycle detection", time: "O(V+E)", space: "O(V)", when: "recursion allowed", best: false }
  ],
  inputs: [
    { name: "words", label: "words =", type: "list", default: '["wrt","wrf","er","ett","rftt"]' }
  ],
  examples: [
    { label: "Ex 1", values: { words: '["wrt","wrf","er","ett","rftt"]' }, result: '"wertf"' },
    { label: "Ex 2", values: { words: '["z","x"]' }, result: '"zx"' },
    { label: "Ex 3", values: { words: '["z","x","z"]' }, result: '"" (cycle)' }
  ],
  realLife: "<p><b>Custom sort orders</b>: internationalized apps that sort a catalog in a non-Latin alphabet — the ordering is learned by diffing dictionary words, exactly like this.</p><p><b>Compiler build order</b>: resolving an import/package dependency graph is Kahn's algorithm in production.</p>",
  dsDive: `<h3>Topological sort: two mechanical ways</h3>
<p><b>Kahn:</b> every char with indegree 0 is safe to output first. Popping it removes its edges; chars that become indegree-0 are next. Finish with fewer chars than the alphabet ⇒ a cycle → invalid dictionary.</p>
<div class="equation">wrt → wrf: first diff t→f | w→e, r→t, e→r ⇒ order w e r t f</div>
<p><b>DFS:</b> the recursion stack doubles as the cycle detector — revisiting a char still in state 1 (on the stack) is a cycle. Reverse postorder IS a topological order. Both run in O(V+E); Kahn is iterative, DFS needs no extra indegree bookkeeping.</p>`,
  code: [
    [
      "adj = {} ; indeg = {}",
      "for pair (a, b) of adjacent words:",
      "    x, y = first differing chars → edge x → y",
      "    (if b is a prefix of a → invalid → return '')",
      "queue ← every char with indegree 0",
      "while queue: pop c → result += c;",
      "    for nxt in adj[c]: indeg[nxt] -= 1",
      "        if indeg[nxt] == 0: queue.push(nxt)",
      "return result if len(result) == #chars else ''"
    ],
    [
      "vis[c] ∈ {0, 1, 2}    # 1 = on the recursion stack",
      "def dfs(c):",
      "    vis[c] = 1",
      "    for nxt in adj[c]:",
      "        if vis[nxt] == 1: CYCLE → return ''",
      "        if vis[nxt] == 0: dfs(nxt)",
      "    vis[c] = 2 ; order.append(c)   # postorder",
      "for c in chars: if vis[c] == 0: dfs(c)",
      "return ''.join(reversed(order))"
    ]
  ],
  steps: [
    function (vals) {
      const words = (vals.words || []).map(w => String(w));
      const steps = [];
      const chars = [], inSet = {};
      words.forEach(w => w.split("").forEach(c => { if (!inSet[c]) { inSet[c] = 1; chars.push(c); } }));
      const adj = {}, indeg = {};
      chars.forEach(c => { adj[c] = []; indeg[c] = 0; });
      let invalid = false;
      const snap = (text, code, q, head, order) => steps.push({
        text: text, code: code,
        mem: [
          hashView("indegree · open addressing", chars.map(c => ({ k: c, v: String(indeg[c]) })), "h(c) = code(c) mod 8"),
          hashView("adjacency · x → later chars", chars.map(c => ({ k: c, v: adj[c].length ? "→ " + adj[c].join(",") : "—" }))),
          queueView("queue · indegree 0", (q || []).slice(head || 0), 0, Math.max((q || []).length - (head || 0) - 1, 0)),
          arrView("result (topological order)", order || [], {}, 1)
        ]
      });
      if (!chars.length) {
        const e = { text: "No words → empty alphabet → return empty string.", code: 8, mem: [], result: '""', correct: true, memNote: "O(1)." };
        steps.push(e);
        return { steps: steps, result: '""', correct: true, memNote: "O(1)." };
      }
      snap("Collect the alphabet: every letter appearing in any word. Then diff adjacent words to discover precedence edges.", 0, [], 0, []);
      for (let i = 0; i + 1 < words.length; i++) {
        const a = words[i], b = words[i + 1];
        const L = Math.min(a.length, b.length);
        let j = 0;
        while (j < L && a[j] === b[j]) j++;
        if (j === L) {
          if (a.length > b.length) {
            invalid = true;
            snap('Pair "<b>' + a + '</b>", "<b>' + b + '</b>": no differing char but the first is longer → prefix rule broken → return ""', 3, [], 0, []);
            break;
          }
          continue;
        }
        const x = a[j], y = b[j];
        if (x !== y && !adj[x].includes(y)) {
          adj[x].push(y);
          indeg[y]++;
          snap('Diff "<b>' + a + '</b>" vs "<b>' + b + '</b>" at position ' + j + ' → edge <b>' + x + ' → ' + y + '</b> (indeg[' + y + '] = ' + indeg[y] + ').', 2, [], 0, []);
        }
      }
      if (invalid) {
        const last = steps[steps.length - 1];
        last.result = '""';
        last.correct = refAlien(words) === "";
        last.memNote = "Invalid input → no valid order. Time O(V+E).";
        return { steps: steps, result: '""', correct: refAlien(words) === "", memNote: last.memNote };
      }
      const q = [];
      chars.forEach(c => { if (indeg[c] === 0) q.push(c); });
      snap("Seed the queue with every char whose indegree is 0 — <b>" + q.join(", ") + "</b> is ready to be emitted first.", 4, q, 0, []);
      const order = [];
      let head = 0;
      while (head < q.length) {
        const c = q[head++];
        order.push(c);
        adj[c].forEach(nxt => {
          indeg[nxt]--;
          if (indeg[nxt] === 0) q.push(nxt);
        });
        snap('Pop <b>' + c + '</b> → emit it. Decrement neighbor indegrees; newly-zero neighbors join the queue.', 5, q, head, order.slice());
      }
      if (order.length !== chars.length) {
        snap('Only ' + order.length + ' of ' + chars.length + ' chars emitted → an edge points into a CYCLE → return ""', 8, q, head, order.slice());
        const last = steps[steps.length - 1];
        last.result = '""';
        last.correct = refAlien(words) === "";
        last.memNote = "Cycle detected → invalid dictionary. Time O(V+E), space O(V).";
        return { steps: steps, result: '""', correct: refAlien(words) === "", memNote: last.memNote };
      }
      const res = order.join("");
      snap('All ' + order.length + ' chars emitted → topological order <b>"' + res + '"</b>.', 8, q, head, order.slice());
      const last = steps[steps.length - 1];
      last.result = JSON.stringify(res);
      last.correct = refAlien(words) === res;
      last.memNote = "Time O(V+E): each char popped once, each edge relaxed once. Space O(V).";
      return { steps: steps, result: JSON.stringify(res), correct: refAlien(words) === res, memNote: last.memNote };
    },
    function (vals) {
      const words = (vals.words || []).map(w => String(w));
      const steps = [];
      const chars = [], inSet = {};
      words.forEach(w => w.split("").forEach(c => { if (!inSet[c]) { inSet[c] = 1; chars.push(c); } }));
      const adj = {}, indeg = {};

      return { steps: steps, result: JSON.stringify(res), correct: validTopo(res, words), memNote: last.memNote };

        snap('Pop <b>(' + it.r + ',' + it.c + ')</b> at level <b>' + it.key + '</b> → the cheapest cell left, settle it.', 2);
        if (it.r === n - 1 && it.c === n - 1) {
          answer = it.key;
          snap('Target (n−1,n−1) settled → swim time = <b>' + answer + '</b>.', 3);
          break;
        }
        const dr = [1, -1, 0, 0], dc = [0, 0, 1, -1];
        for (let d = 0; d < 4; d++) {
          const nr = it.r + dr[d], nc = it.c + dc[d];
          if (nr < 0 || nc < 0 || nr >= n || nc >= n || settled[nr][nc]) continue;
          const nl = Math.max(it.key, grid[nr][nc]);
          if (nl < t[nr][nc]) {
            t[nr][nc] = nl;
            heap.push({ r: nr, c: nc, key: nl });
            snap('Neighbor (' + nr + ',' + nc + ') at ' + grid[nr][nc] + ' → path max ' + it.key + ' → <b>' + nl + '</b>; push.', 4);
          }
        }
      }
      const last = steps[steps.length - 1];
      last.result = String(answer);
      last.correct = refSwim(grid) === answer;
      last.memNote = "Time O(n² log n), space O(n²). Settle-once per cell.";
      return { steps: steps, result: String(answer), correct: refSwim(grid) === answer, memNote: last.memNote };
    },
    function (vals) {
      const grid = (vals.grid || []).map(r => r.map(Number));
      const n = grid.length;
      const steps = [];
      if (n === 0) {
        const e = { text: "Empty grid → swim time 0.", code: 0, mem: [], result: "0", correct: true, memNote: "O(1)." };
        steps.push(e);
        return { steps: steps, result: "0", correct: true, memNote: "O(1)." };
      }
      const snap = (text, code, cls) => steps.push({
        text: text, code: code,
        mem: [
          { type: "grid", title: "grid · BFS reachability at level T (done = reached)", data: grid.map(r => r.slice()), cls: cls || {}, cols: n }
        ]
      });
      function explore(T) {
        const seen = grid.map(r => r.map(() => false));
        const q = [];
        if (grid[0][0] <= T) { seen[0][0] = true; q.push([0, 0]); }
        const dr = [1, -1, 0, 0], dc = [0, 0, 1, -1];
        while (q.length) {
          const p = q.shift();
          for (let d = 0; d < 4; d++) {
            const nr = p[0] + dr[d], nc = p[1] + dc[d];
            if (nr >= 0 && nc >= 0 && nr < n && nc < n && !seen[nr][nc] && grid[nr][nc] <= T) {
              seen[nr][nc] = true;
              q.push([nr, nc]);
            }
          }
        }
        return seen;
      }
      snap("Binary search the answer over [0, " + (n * n - 1) + "]: 'is the grid crossable at level T?'.", 0, {});
      let lo = 0, hi = n * n - 1, ans = hi;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        const seen = explore(mid);
        const cls = {};
        seen.forEach((row, r) => row.forEach((v, c) => { if (v) cls[r + "," + c] = "done"; }));
        if (seen[n - 1][n - 1]) {
          ans = mid;
          hi = mid - 1;
          snap('T = <b>' + mid + '</b>: bottom-right REACHED → ans = ' + mid + ', try smaller (hi = ' + hi + ').', 3, cls);
        } else {
          lo = mid + 1;
          snap('T = <b>' + mid + '</b>: bottom-right blocked → raise the floor (lo = ' + lo + ').', 5, cls);
        }
      }
      const last = steps[steps.length - 1];
      last.result = String(ans);
      last.correct = refSwim(grid) === ans;
      last.memNote = "Time O(n² log n) — log n BFS passes. Space O(n²).";
      return { steps: steps, result: String(ans), correct: refSwim(grid) === ans, memNote: last.memNote };
    }
  ]
});
