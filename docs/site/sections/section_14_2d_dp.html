/* ================================================================
 * SHARED HELPERS — input clamping keeps every animation grid finite
 * ================================================================ */
function capInt(v, lo, hi) {
  v = Number(v);
  if (!Number.isFinite(v)) return lo;
  return Math.max(lo, Math.min(hi, Math.round(v)));
}
function capStr(s, n) {
  s = String(s === null || s === undefined ? "" : s);
  return s.length > n ? s.slice(0, n) : s;
}
function capList(a, n, mx) {
  a = (a || []).map(function (x) { return Number(x); });
  if (mx !== undefined) a = a.map(function (x) { return Math.max(-mx, Math.min(mx, Math.round(x))); });
  return a.length > n ? a.slice(0, n) : a;
}
function capMat(m, R, C) {
  m = m || [];
  const out = [];
  for (let r = 0; r < Math.min(m.length, R); r++) {
    out.push((m[r] || []).slice(0, C).map(function (x) { return Number(x); }));
  }
  return out;
}
function gridView(title, data, cols, cls) {
  return { type: "grid", title: title, data: data, cols: cols, cls: cls || {} };
}

  return { type: "array", title: title, data: data, cls: cls || {}, showIdx: true, size: size || 4 };

  ],
  realLife: "<p><b>Regex engines</b> (grep, ripgrep, JavaScript's <span class='code-var'>RegExp</span>): matching a pattern with <b>.*</b> against a file is exactly this DP — the engine fills an m×n table instead of backtracking exponentially.</p><p><b>Router / URL matching</b> in web frameworks: patterns like <span class='code-var'>/users/*/posts</span> compile to a similar automaton. Globbing in shells and gitignore files is the same problem with fewer operators.</p>",
  dsDive: `<h3>Why a 2D table instead of backtracking?</h3>
<p>Naive recursion on <span class="code-var">*</span> re-explores the same (i, j) state from many branches — exponential. The DP table stores each state once; a cell is <b>referenced, never recomputed</b>.</p>
<div class="equation">dp[i][j] = match(s[i], p[j]) and dp[i+1][j+1]  (plain char)<br>dp[i][j] = dp[i][j+2] or (match(s[i], p[j]) and dp[i+1][j])  (star)</div>
<p>Read the table bottom-up: row i describes the <b>suffix</b> s[i:], so every cell depends only on cells below and to the right — already computed. The star's two branches are exactly the two classical choices: <b>skip</b> the 'c*' pair, or <b>consume one</b> c and stay.</p>
<p><b>Space optimization:</b> the recurrence only touches the next row → a rolling 2-row table runs in O(m) memory, still O(m·n) time. Python's <span class="code-var">re</span> module goes further: it compiles the pattern to an NFA (Thompson construction) and simulates it with a bit-parallel row — literally the same DP with bit tricks.</p>`,
  code: [
    [
      "def is_match(s, p):",
      "    m, n = len(s), len(p)",
      "    dp = [[False] * (n + 1) for _ in range(m + 1)]",
      "    dp[m][n] = True                       # empty s matches empty p",
      "    for j in range(n - 1, -1, -1):        # row m: only x* chains match ''",
      "        dp[m][j] = (p[j+1] == '*') and dp[m][j+2]",
      "    for i in range(m - 1, -1, -1):        # fill bottom-up",
      "        for j in range(n - 1, -1, -1):",
      "            if j + 1 < n and p[j + 1] == '*':",
      "                dp[i][j] = dp[i][j+2] or (match(s[i], p[j]) and dp[i+1][j])",
      "            else:",
      "                dp[i][j] = match(s[i], p[j]) and dp[i+1][j+1]",
      "    return dp[0][0]"
    ],
    [
      "memo = {}                                # (i, j) -> s[i:] matches p[j:]",
      "def dfs(i, j):",
      "    if i == m and j == n: return True     # both exhausted",
      "    if i == m:                             # s empty: only x* suffixes",
      "        return j + 1 < n and p[j+1] == '*' and dfs(i, j + 2)",
      "    if (i, j) in memo: return memo[(i, j)]",
      "    if j + 1 < n and p[j + 1] == '*':",
      "        memo[i, j] = dfs(i, j + 2) or (match(s[i], p[j]) and dfs(i + 1, j))",
      "    else:",
      "        memo[i, j] = match(s[i], p[j]) and dfs(i + 1, j + 1)",
      "    return memo[i, j]",
      "return dfs(0, 0)"
    ]
  ],
  steps: [
    function (vals) {
      const s = capStr(vals.s, 5), p = capStr(vals.p, 7);
      const m = s.length, n = p.length;
      const dp = [], perm = {}, steps = [];
      for (let i = 0; i <= m; i++) dp.push(new Array(n + 1).fill("?"));
      const match = (i, j) => s[i] === p[j] || p[j] === ".";
      const snap = (text, code, hl) => {
        const cls = Object.assign({}, perm);
        if (hl) cls[hl] = "hl";
        steps.push({ text: text, code: code, mem: [gridView("dp[i][j] = does s[i:] match p[j:]?", dp.map(r => r.slice()), n + 1, cls)] });
      };
      snap("Base case: empty s and empty p match → <b>dp[m][n] = T</b>. Work bottom-up, so every cell reads already-computed cells.", 3, m + "," + n);
      dp[m][n] = "T"; perm[m + "," + n] = "done";
      for (let j = n - 1; j >= 0; j--) {
        dp[m][j] = (p[j + 1] === "*") ? dp[m][j + 2] : "F";
        perm[m + "," + j] = "done";
        snap("Row m (s exhausted): p[j:] must be a chain of <b>x*</b> pairs. p[" + j + "]='" + p[j] + "' " + (p[j + 1] === "*" ? "+ * → copies dp[m][" + (j + 2) + "]" : "(no star) → can't match empty s") + " → <b>dp[m][" + j + "] = " + dp[m][j] + "</b>.", 5, m + "," + j);
      }
      for (let i = m - 1; i >= 0; i--) {
        for (let j = n - 1; j >= 0; j--) {
          let v;
          if (j + 1 < n && p[j + 1] === "*") {
            const skip = dp[i][j + 2] === "T";
            const use = match(i, j) && dp[i + 1][j] === "T";
            v = skip || use;
            dp[i][j] = v ? "T" : "F";
            perm[i + "," + j] = "done";
            snap("s[" + i + "]='" + s[i] + "', p[" + j + "][" + (j + 1) + "]='" + p[j] + "*': branch A <b>skip</b> c* → dp[" + i + "][" + (j + 2) + "]=" + dp[i][j + 2] + "; branch B <b>consume</b> one " + p[j] + (match(i, j) ? " (char matches!)" : " (char doesn't match)") + (match(i, j) ? " → dp[" + (i + 1) + "][" + j + "]=" + dp[i + 1][j] : " → dead") + ". → <b>dp[" + i + "][" + j + "] = " + dp[i][j] + "</b>.", 9, i + "," + j);
          } else {
            const ok = match(i, j) && dp[i + 1][j + 1] === "T";
            dp[i][j] = ok ? "T" : "F";
            perm[i + "," + j] = "done";
            snap("s[" + i + "]='" + s[i] + "' " + (match(i, j) ? "matches" : "vs") + " p[" + j + "]='" + p[j] + "'" + (match(i, j) ? " → look right-below: dp[" + (i + 1) + "][" + (j + 1) + "]=" + dp[i + 1][j + 1] : " — no match → dead") + ". → <b>dp[" + i + "][" + j + "] = " + dp[i][j] + "</b>.", 11, i + "," + j);
          }
        }
      }
      const res = dp[0][0] === "T";
      const last = steps[steps.length - 1];
      last.result = String(res);
      last.memNote = "Time O(m·n), space O(m·n). Table filled once, bottom-up.";
      return { steps: steps, result: String(res), correct: true, memNote: last.memNote };
    },
    function (vals) {
      const s = capStr(vals.s, 5), p = capStr(vals.p, 7);
      const m = s.length, n = p.length;
      const memo = [], steps = [];
      for (let i = 0; i <= m; i++) memo.push(new Array(n + 1).fill("?"));
      const match = (i, j) => s[i] === p[j] || p[j] === ".";
      const stack = [];
      const snap = (text, code, hl) => {
        const cls = {};
        if (hl) cls[hl] = "hl";
        steps.push({ text: text, code: code, mem: [
          gridView("memo — states already solved", memo.map(r => r.slice()), n + 1, cls),
          { type: "stack", title: "recursion stack · (i, j) states", data: stack.slice(), top: stack.length - 1 }
        ] });
      };
      snap("Top-down: dfs(i, j) asks the same question but only visits reachable states, remembering each answer in <b>memo</b>.", 1);
      function dfs(i, j) {
        if (i === m && j === n) return true;
        if (i === m) return j + 1 < n && p[j + 1] === "*" && dfs(i, j + 2);
        if (memo[i][j] !== "?") return memo[i][j] === "T";
        stack.push(i + "," + j);
        let v;
        if (j + 1 < n && p[j + 1] === "*") {
          v = dfs(i, j + 2) || (match(i, j) && dfs(i + 1, j));
        } else {
          v = match(i, j) && dfs(i + 1, j + 1);
        }
        memo[i][j] = v ? "T" : "F";
        snap("Solved state (" + i + ", " + j + "): s[" + i + "]='" + s[i] + "' vs p[" + j + "]='" + p[j] + (j + 1 < n && p[j + 1] === "*" ? "*" : "") + "' → " + (v ? "T (matched!)" : "F (no match)") + ". Stored in memo for reuse.", 7, i + "," + j);
        stack.pop();
        return v;
      }
      const res = dfs(0, 0);
      const last = steps[steps.length - 1];
      last.result = String(res);
      last.memNote = "Time O(m·n), space O(m·n) + call stack. Only reachable states computed.";
      return { steps: steps, result: String(res), correct: true, memNote: last.memNote };
    }
  ]
});

  realLife: "<p><b>Robot / drone route counting</b>: warehouse robots on a grid floor — how many monotone paths exist between docks is this exact DP. Repeating it per timestamp animates a heat map of likely positions.</p><p><b>Lattice paths in quantitative finance</b>: binomial option-pricing trees count the same paths; the DP table is literally the Pascal-triangle recurrence <span class='code-var'>dp = top + left</span>.</p>",
  dsDive: `<h3>The grid IS a Pascal triangle in disguise</h3>
<p>Every cell's value is the sum of the two cells above and left — exactly how Pascal's triangle is built. That is why the answer also equals a binomial coefficient.</p>
<div class="equation">paths(m, n) = C(m + n − 2, m − 1) = dp[r][c] = dp[r−1][c] + dp[r][c−1]</div>
<p>Memory layout: each row is a contiguous array; the C-style nested array is an <b>array of row pointers</b>, so rows live at unrelated addresses. Row-major fill order reads left-to-right in the same cache line — a textbook <b>cache-friendly</b> loop.</p>
<p><b>Space trick:</b> the recurrence only needs the previous row, so a single rolling row of length n replaces the full table: O(n) memory, identical answer. With obstacles present (Unique Paths II), the same rolling row still works.</p>`,
  code: [
    [
      "def unique_paths(m, n):",
      "    dp = [[0] * (n + 1) for _ in range(m + 1)]",
      "    dp[0][1] = 1                      # sentinel seed — first cell gets 1",
      "    for r in range(1, m + 1):",
      "        for c in range(1, n + 1):",
      "            dp[r][c] = dp[r - 1][c] + dp[r][c - 1]   # from top + from left",
      "    return dp[m][n]"
    ],
    [
      "def unique_paths(m, n):",
      "    k = min(m - 1, n - 1)             # smaller side → fewer iterations",
      "    ans = 1",
      "    for i in range(1, k + 1):",
      "        ans = ans * (m + n - 1 - i) // i   # build C(m+n-2, m-1)",

        }
      }
      const res = dp[m][n];
      const last = steps[steps.length - 1];
      last.result = res;

    function (vals) {

          if (cur === target) { ways++; results.push(cur + " ✓"); }

          snap("Leaf: sum = " + cur + " " + (cur === target ? "<b>= target → way counted!</b>" : "≠ target → no way."), 2);
          return;
        }
        stack.push(i + ":" + cur);
        snap("Index " + i + ", num " + nums[i] + ", running sum " + cur + ": branch <b>+" + nums[i] + "</b> → " + (cur + nums[i]) + ", branch <b>−" + nums[i] + "</b> → " + (cur - nums[i]) + ".", 3);
        dfs(i + 1, cur + nums[i]);
        dfs(i + 1, cur - nums[i]);
        stack.pop();
      }
      dfs(0, 0);
      const res = String(ways);
      const last = steps[steps.length - 1];
      last.result = res;
      last.memNote = "Time O(2ⁿ), space O(n). Full binary tree of signs.";
      return { steps: steps, result: res, correct: true, memNote: last.memNote };
    }
  ]
});
