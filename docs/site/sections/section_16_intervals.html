/* ============ SHARED HELPERS ============ */
function ivStr(iv) { return "[" + iv.join(",") + "]"; }
function sortIv(a) { return a.slice().sort((x, y) => x[0] - y[0] || x[1] - y[1]); }
function sortIvEnd(a) { return a.slice().sort((x, y) => x[1] - y[1] || x[0] - y[0]); }
function arrView(ivs, cls, title) {
  return { type: "array", title: title || "intervals", data: (ivs || []).map(ivStr), cls: cls || {}, showIdx: true, size: 8 };
}
function heapPush(arr, item) {
  let lo = 0, hi = arr.length;
  while (lo < hi) {
    const m = (lo + hi) >> 1, a = arr[m];
    if (a[0] < item[0] || (a[0] === item[0] && a[1] < item[1])) lo = m + 1; else hi = m;
  }
  arr.splice(lo, 0, item);
  return lo;
}
function heapPop(arr) { return arr.shift(); }
function heapView(heap, title) {
  return { type: "queue", title: title || "min-heap", data: heap.map(x => x[0] === x[1] ? String(x[0]) : x[0] + "·e" + x[1]), front: heap.length ? 0 : -1, rear: heap.length ? heap.length - 1 : -1 };
}
function refMergeAll(ivs) {
  const a = sortIv(ivs), r = [];
  for (const iv of a) {
    if (!r.length || iv[0] > r[r.length - 1][1]) r.push([iv[0], iv[1]]);
    else r[r.length - 1][1] = Math.max(r[r.length - 1][1], iv[1]);
  }
  return r;
}
function refCanAttend(ivs) {
  const ev = [];
  for (const iv of ivs) { ev.push([iv[0], 1]); ev.push([iv[1], -1]); }
  ev.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  let act = 0;
  for (const e of ev) { act += e[1]; if (act > 1) return false; }
  return true;
}
function refAdjacent(ivs) {
  const a = sortIv(ivs);
  for (let i = 1; i < a.length; i++) if (a[i][0] < a[i - 1][1]) return false;
  return true;
}
function refRoomsHeap(ivs) {
  const a = sortIv(ivs), ends = [];
  let rooms = 0;
  for (const iv of a) {
    if (ends.length && ends[0][0] <= iv[0]) ends.shift();
    heapPush(ends, [iv[1], iv[1]]);
    rooms = Math.max(rooms, ends.length);
  }
  return rooms;
}
function refRooms2(ivs) {
  const a = sortIv(ivs);
  const starts = a.map(x => x[0]), ends = a.map(x => x[1]).sort((x, y) => x - y);
  let rooms = 0, e = 0;
  for (const s of starts) { if (s >= ends[e]) e++; else rooms++; }
  return rooms;
}
function refKeep(ivs) {
  const a = sortIvEnd(ivs);
  const dp = [];
  let best = 0;
  for (let i = 0; i < a.length; i++) {
    let v = 1;
    for (let j = 0; j < i; j++) if (a[j][1] <= a[i][0]) v = Math.max(v, dp[j] + 1);
    dp[i] = v; best = Math.max(best, v);
  }
  return best;
}
function refBrute(ivs, qs) {
  return qs.map(q => {
    let b = Infinity;
    for (const iv of ivs) if (iv[0] <= q && q <= iv[1]) b = Math.min(b, iv[1] - iv[0] + 1);
    return b === Infinity ? -1 : b;
  });
}

/* ================================================================
 * PROBLEM 0056 — MERGE INTERVALS
 * ================================================================ */
NC150.register({
  id: "0056", title: "Merge Intervals", difficulty: "Medium",
  url: "https://leetcode.com/problems/merge-intervals/",
  tags: ["sorting", "array"],
  approaches: ["Approach 1 · Sort + merge sweep (best)", "Approach 2 · In-place merge — O(1) space"],
  complexities: [
    { time: "O(n log n)", space: "O(n)", note: "BEST — sort once, then linear sweep" },
    { time: "O(n log n)", space: "O(1)", note: "overwrites input, no result array" }
  ],
  compare: [
    { name: "Brute pairwise", tech: "check every pair, union", time: "O(n²)", space: "O(n)", when: "tiny n only", best: false },
    { name: "Sort + sweep", tech: "sort by start, absorb overlaps", time: "O(n log n)", space: "O(n)", when: "general case", best: true },
    { name: "In-place merge", tech: "write pointer over input", time: "O(n log n)", space: "O(1)", when: "memory-critical", best: false }
  ],
  inputs: [
    { name: "intervals", label: "intervals =", type: "list", default: "[[1,3],[2,6],[8,10],[15,18]]" }
  ],
  examples: [
    { label: "Ex 1", values: { intervals: "[[1,3],[2,6],[8,10],[15,18]]" }, result: "[[1,6],[8,10],[15,18]]" },
    { label: "Ex 2", values: { intervals: "[[1,4],[4,5]]" }, result: "[[1,5]]" },
    { label: "Ex 3", values: { intervals: "[[1,4],[0,4]]" }, result: "[[0,4]]" }
  ],
  realLife: "<p><b>Calendar apps</b>: bookings from different sources (email invites, calendar feeds) arrive unsorted — 'merge my day into free blocks' is literally this algorithm.</p><p><b>Log/telemetry pipelines</b>: collapse overlapping uptime windows or error bursts into one contiguous event before reporting.</p>",
  dsDive: `<h3>Sorting turns a 2D problem into a 1D sweep</h3>
<p>Two intervals <b>[a,b]</b> and <b>[c,d]</b> overlap iff <span class="code-var">c ≤ b</span> (after sorting by start). Once sorted, overlap is <b>local</b> — only the last merged interval can touch the current one, so one pass suffices.</p>
<div class="equation">overlap ⇔ c ≤ b &nbsp;&nbsp;→&nbsp;&nbsp; merged = [a, max(b, d)]</div>
<p>The sweep maintains a single invariant: <b>res[last] is the interval that could still grow</b>. Every later interval either starts inside it (extend the end) or after it (finalize and open a new one). No interval is ever revisited — the sort does all the heavy lifting, <span class="code-var">O(n log n)</span>.</p>`,
  code: [
    "def merge(intervals):",
    "    intervals.sort(key=lambda x: x[0])     # sort by start → O(n log n)",
    "    res = []",
    "    for s, e in intervals:                 # one sweep",
    "        if not res or s > res[-1][1]:      # disjoint from last merged",
    "            res.append([s, e])",
    "        else:",
    "            res[-1][1] = max(res[-1][1], e) # overlap → extend end",
    "    return res"
  ],
  steps: [
    function (vals) {
      const ivs = (vals.intervals || []).map(iv => [Number(iv[0]), Number(iv[1])]);
      const steps = [];
      const snap = (text, code, mem) => steps.push({ text, code, mem });
      snap("Raw input as given. Step 1: <b>sort by start time</b> — O(n log n) once, then one linear sweep.", 0, [arrView(ivs, {}, "input intervals")]);
      const sorted = sortIv(ivs);
      snap("Sorted by start (ties broken by end). Now sweep left→right: touching or overlapping neighbors merge.", 1, [arrView(sorted, {}, "sorted by start")]);
      const res = [];
      snap("Sweep start: maintain <b>res[last]</b> — the only interval that can still absorb what follows.", 3, [arrView(sorted, {}, "sorted by start"), arrView(res, {}, "merged result")]);
      for (let i = 0; i < sorted.length; i++) {
        const s = sorted[i][0], e = sorted[i][1];
        if (res.length === 0 || s > res[res.length - 1][1]) {
          res.push([s, e]);
          const prevEnd = res.length > 1 ? res[res.length - 2][1] : "—";
          snap(`<b>[${s},${e}]</b>: start ${s} is AFTER last merged end ${prevEnd} → disjoint. Append as a new merged interval.`, 5, [arrView(sorted, { [i]: "hot" }, "sorted by start"), arrView(res, { [res.length - 1]: "done" }, "merged result")]);
        } else {
          const oldEnd = res[res.length - 1][1];
          res[res.length - 1][1] = Math.max(oldEnd, e);
          snap(`<b>[${s},${e}]</b>: start ${s} ≤ last merged end ${oldEnd} → <b>overlap</b>. Absorb it: end ${oldEnd} → <b>${res[res.length - 1][1]}</b>.`, 7, [arrView(sorted, { [i]: "hot" }, "sorted by start"), arrView(res, { [res.length - 1]: "done" }, "merged result")]);
        }
      }
      const last = steps[steps.length - 1];
      last.result = JSON.stringify(res);
      last.correct = JSON.stringify(res) === JSON.stringify(refMergeAll(ivs));
      last.memNote = "Time: O(n log n) sort + O(n) sweep. Space: O(n) for the result array.";
      return { steps, result: last.result, correct: last.correct, memNote: last.memNote };
    },
    function (vals) {
      const ivs = (vals.intervals || []).map(iv => [Number(iv[0]), Number(iv[1])]);
      const data = sortIv(ivs);
      const steps = [];
      const snap = (text, code, cls) => steps.push({ text, code, mem: [arrView(data, cls, "intervals — merged IN PLACE")] });
      snap("Same sort, but no result array: a <b>write pointer w</b> rebuilds the merged list inside the input. Read pointer r sweeps ahead.", 1, {});
      let w = 0;
      for (let r = 1; r < data.length; r++) {
        if (data[r][0] <= data[w][1]) {
          const old = data[w][1];
          data[w][1] = Math.max(data[w][1], data[r][1]);
          snap(`r=${r} <b>[${data[r].join(",")}]</b> overlaps w=${w} <b>[${data[w][0]},${old}]</b> → absorb: end → <b>${data[w][1]}</b>. (cell ${w} mutated in place)`, 5, { [w]: "hot", [r]: "hl" });
        } else {
          w++;
          data[w] = data[r];
          snap(`r=${r} <b>[${data[r].join(",")}]</b> is disjoint → keep it: w ${w - 1} → <b>${w}</b>, copy interval to cell ${w}.`, 8, { [w]: "hot", [r]: "hl" });
        }
      }
      const res = data.slice(0, w + 1);
      const cls = {};
      res.forEach((_, i) => cls[i] = "done");
      snap(`Done: result lives in cells 0..${w} → ${JSON.stringify(res)}. No extra array was ever allocated.`, 9, cls);
      const last = steps[steps.length - 1];
      last.result = JSON.stringify(res);
      last.correct = JSON.stringify(res) === JSON.stringify(refMergeAll(ivs));
      last.memNote = "Time: O(n log n). Space: O(1) extra — the input array is reused.";
      return { steps, result: last.result, correct: last.correct, memNote: last.memNote };
    }
  ]
});

/* ================================================================
 * PROBLEM 0057 — INSERT INTERVAL
 * ================================================================ */
NC150.register({
  id: "0057", title: "Insert Interval", difficulty: "Medium",
  url: "https://leetcode.com/problems/insert-interval/",
  tags: ["interval", "binary search"],
  approaches: ["Approach 1 · 3-phase linear scan (best)", "Approach 2 · Binary-search insert + merge"],
  complexities: [
    { time: "O(n)", space: "O(n)", note: "BEST — input is already sorted" },
    { time: "O(n)", space: "O(n)", note: "log n to find the gap, then O(n) merge" }
  ],
  compare: [
    { name: "Insert + re-sort", tech: "splice then sort everything", time: "O(n log n)", space: "O(n)", when: "rarely needed", best: false },
    { name: "3-phase scan", tech: "before · absorb · after", time: "O(n)", space: "O(n)", when: "general case", best: true },
    { name: "Binary-search insert", tech: "locate gap, splice, sweep-merge", time: "O(n)", space: "O(n)", when: "log n lookup matters", best: false }
  ],
  inputs: [
    { name: "intervals", label: "intervals =", type: "list", default: "[[1,3],[6,9]]" },
    { name: "interval", label: "new =", type: "list", default: "[4,8]" }
  ],
  examples: [
    { label: "Ex 1", values: { intervals: "[[1,3],[6,9]]", interval: "[2,5]" }, result: "[[1,5],[6,9]]" },
    { label: "Ex 2", values: { intervals: "[[1,2],[3,5],[6,7],[8,10],[12,16]]", interval: "[4,8]" }, result: "[[1,2],[3,10],[12,16]]" },
    { label: "Ex 3", values: { intervals: "[]", interval: "[5,7]" }, result: "[[5,7]]" }
  ],
  realLife: "<p><b>Booking systems</b>: a sorted schedule of confirmed bookings exists; a new request arrives — find where it goes and merge any collisions without rebuilding the whole calendar.</p><p><b>Coverage registries</b>: inserting a new feature window into a sorted list of active ranges (feature flags, IP leases) with automatic coalescing of neighbors.</p>",
  dsDive: `<h3>Why three phases and no more</h3>
<p>The input is sorted and disjoint, so the new interval has a unique impact zone: everything strictly before its start is untouched, everything overlapping absorbs, everything after is untouched. The linear scan <b>partitions</b> the array once — each element is touched at most twice.</p>
<div class="equation">absorb: new = [ min(new₀, sᵢ), max(new₁, eᵢ) ] &nbsp; while sᵢ ≤ new₁</div>
<p>The binary-search variant trades the scan for <span class="code-var">O(log n)</span> positioning (first end ≥ new.start) but the splice still costs O(n) — so the win is the search, not the merge. Both stay <span class="code-var">O(n)</span> overall.</p>`,
  code: [
    "def insert(intervals, new_iv):",
    "    res = []; i = 0",
    "    while i < n and intervals[i][1] < new_iv[0]:",
    "        res.append(intervals[i]); i += 1       # phase 1: ends before",
    "    while i < n and intervals[i][0] <= new_iv[1]:",
    "        new_iv = [min(new_iv[0], intervals[i][0]),",
    "                  max(new_iv[1], intervals[i][1])]",
    "        i += 1                                 # phase 2: absorb overlaps",
    "    res.append(new_iv)                         # insert the merged one",
    "    while i < n:",
    "        res.append(intervals[i]); i += 1       # phase 3: starts after",
    "    return res"
  ],
  steps: [
    function (vals) {
      const ivs = (vals.intervals || []).map(iv => [Number(iv[0]), Number(iv[1])]);
      const nin = (vals.interval || []).map(Number);
      const ns = nin.length === 2 ? nin[0] : 0, ne = nin.length === 2 ? nin[1] : 0;
      const steps = [];
      const sorted = sortIv(ivs);
      const newView = cur => ({ type: "array", title: "new interval (absorbing)", data: [ivStr(cur)], cls: { 0: "hot" }, showIdx: true, size: 8 });
      const resView = () => arrView(res, {}, "result");
      const snap = (text, code, cls, cur) => steps.push({ text, code, mem: [arrView(sorted, cls, "intervals (sorted)"), newView(cur), resView()] });
      const res = [];
      snap(`Merge <b>[${ns},${ne}]</b> into the sorted, disjoint list in 3 phases. <b>Phase 1</b>: copy everything that ends before new.start = ${ns}.`, 1, {}, [ns, ne]);
      let i = 0;
      while (i < sorted.length && sorted[i][1] < ns) {
        res.push(sorted[i]);
        snap(`<b>[${sorted[i].join(",")}]</b> ends ${sorted[i][1]} < ${ns} → fully before the new interval, copy verbatim.`, 3, { [i]: "done" }, [ns, ne]);
        i++;
      }
      snap(`<b>Phase 2</b>: absorb every interval whose start ≤ new.end = ${ne}. They merge into one.`, 4, {}, [ns, ne]);
      let cur = [ns, ne];
      while (i < sorted.length && sorted[i][0] <= cur[1]) {
        const old = cur.slice();
        cur = [Math.min(cur[0], sorted[i][0]), Math.max(cur[1], sorted[i][1])];
        snap(`<b>[${sorted[i].join(",")}]</b>: start ${sorted[i][0]} ≤ ${old[1]} → overlap. Merged interval widens: [${old.join(",")}] → <b>[${cur.join(",")}]</b>.`, 5, { [i]: "hl" }, cur);
        i++;
      }
      res.push(cur);
      snap(`Absorption done. Push the merged interval <b>[${cur.join(",")}]</b>. <b>Phase 3</b>: everything after starts above ${cur[1]} → copy verbatim.`, 8, {}, cur);
      while (i < sorted.length) {
        res.push(sorted[i]);
        snap(`<b>[${sorted[i].join(",")}]</b>: start ${sorted[i][0]} > merged end ${cur[1]} → disjoint, copy verbatim.`, 10, { [i]: "done" }, cur);
        i++;
      }
      const last = steps[steps.length - 1];
      last.result = JSON.stringify(res);
      last.correct = JSON.stringify(res) === JSON.stringify(refMergeAll(ivs.concat([[ns, ne]])));
      last.memNote = "Time: O(n) — each interval inspected at most twice. Space: O(n).";
      return { steps, result: last.result, correct: last.correct, memNote: last.memNote };
    },
    function (vals) {
      const ivs = (vals.intervals || []).map(iv => [Number(iv[0]), Number(iv[1])]);
      const nin = (vals.interval || []).map(Number);
      const ns = nin.length === 2 ? nin[0] : 0, ne = nin.length === 2 ? nin[1] : 0;
      const steps = [];
      const sorted = sortIv(ivs);
      const newView = () => ({ type: "array", title: "new interval", data: [ivStr([ns, ne])], cls: { 0: "hot" }, showIdx: true, size: 8 });
      const mark = (lo, hi, mid) => { const m = {}; m[mid] = "hot"; if (lo !== mid) m[lo] = "done"; if (hi !== mid && hi < sorted.length) m[hi] = "hl"; return m; };
      const snap = (text, code, mem) => steps.push({ text, code, mem });
      snap("Step 1: binary search for the first interval whose <b>end ≥ new.start</b> — everything before it stays untouched. Search in [0, n).", 1, [arrView(sorted, {}, "intervals"), newView()]);
      let lo = 0, hi = sorted.length, mid = -1;
      while (lo < hi) {
        mid = (lo + hi) >> 1;
        if (sorted[mid][1] < ns) {
          lo = mid + 1;
          snap(`mid=${mid} <b>[${sorted[mid].join(",")}]</b> ends ${sorted[mid][1]} < ${ns} → too early, jump right: lo → ${lo}.`, 4, [arrView(sorted, mark(lo, hi, mid), "intervals · lo/done · hi/hl · mid/hot"), newView()]);
        } else {
          hi = mid;
          snap(`mid=${mid} <b>[${sorted[mid].join(",")}]</b> ends ${sorted[mid][1]} ≥ ${ns} → candidate zone, pull left: hi → ${hi}.`, 5, [arrView(sorted, mark(lo, hi, mid), "intervals · lo/done · hi/hl · mid/hot"), newView()]);
        }
      }
      const data = sorted.slice();
      data.splice(lo, 0, [ns, ne]);
      snap(`Insertion point k=${lo}: splice <b>[${ns},${ne}]</b> in — list stays sorted. Now one merge sweep from the start.`, 6, [arrView(data, {}, "after splice"), newView()]);
      const res = [];
      for (let k = 0; k < data.length; k++) {
        if (res.length && data[k][0] <= res[res.length - 1][1]) {
          const old = res[res.length - 1][1];
          res[res.length - 1][1] = Math.max(old, data[k][1]);
          snap(`<b>[${data[k].join(",")}]</b>: start ${data[k][0]} ≤ last end ${old} → merge: end → <b>${res[res.length - 1][1]}</b>.`, 10, [arrView(data, { [k]: "hot" }, "after splice"), arrView(res, { [res.length - 1]: "done" }, "result")]);
        } else {
          res.push(data[k]);
          snap(`<b>[${data[k].join(",")}]</b>: disjoint → append to result.`, 12, [arrView(data, { [k]: "hot" }, "after splice"), arrView(res, { [res.length - 1]: "done" }, "result")]);
        }
      }
      const last = steps[steps.length - 1];
      last.result = JSON.stringify(res);
      last.correct = JSON.stringify(res) === JSON.stringify(refMergeAll(ivs.concat([[ns, ne]])));
      last.memNote = "Time: O(n) overall (splice + merge sweep). Space: O(n).";
      return { steps, result: last.result, correct: last.correct, memNote: last.memNote };
    }
  ]
});

/* ================================================================

      for (let qi = 0; qi < qSorted.length; qi++) {
        const q = qSorted[qi][0], orig = qSorted[qi][1];
        snap(`Query <b>${q}</b> (originally index ${orig}): add every interval with start ≤ ${q}.`, 5, [arrView(sortedIv, {}, "intervals (sorted)"), qView(), heapView(heap, "min-heap · size·end"), ansView()]);
        const added = [];
        while (j < sortedIv.length && sortedIv[j][0] <= q) {
          const l = sortedIv[j][0], r = sortedIv[j][1];
          heapPush(heap, [r - l + 1, r]);
          added.push("[" + l + "," + r + "]");
          j++;
        }
        snap(added.length
          ? `Added ${added.join(" ")} — size = end − start + 1. Heap stays sorted by (size, end).`
          : "No new interval starts at or before " + q + ".",
          7, [arrView(sortedIv, { [j - 1]: "hot" }, "intervals (sorted)"), qView(), heapView(heap, "min-heap · size·end"), ansView()]);
        const expired = [];
        while (heap.length && heap[0][1] < q) expired.push(heapPop(heap));
        snap(expired.length
          ? "Expired " + expired.map(x => "size " + x[0] + " (ends " + x[1] + ")").join(", ") + ": end < " + q + " → can never contain the query again."
          : "Nothing expired — every live interval ends at ≥ " + q + ".",
          9, [arrView(sortedIv, {}, "intervals (sorted)"), qView(), heapView(heap, "min-heap · size·end"), ansView()]);
        if (heap.length) {
          ans[orig] = heap[0][0];
          snap(`Heap top = size <b>${heap[0][0]}</b> (ends at ${heap[0][1]}) → smallest interval containing ${q} → answers[${orig}] = <b>${ans[orig]}</b>.`, 10, [arrView(sortedIv, {}, "intervals (sorted)"), qView(), heapView(heap, "min-heap · size·end"), ansView()]);
        } else {
          snap(`Heap empty → no interval contains ${q} → answers[${orig}] = <b>-1</b>.`, 10, [arrView(sortedIv, {}, "intervals (sorted)"), qView(), heapView(heap, "min-heap · size·end"), ansView()]);
        }
      }
      const last = steps[steps.length - 1];
      last.result = JSON.stringify(ans);
      last.correct = JSON.stringify(ans) === JSON.stringify(refBrute(ivs, qs));
      last.memNote = "Time: O((n+q) log n) — each interval pushed/popped once. Space: O(n + q).";
      return { steps, result: last.result, correct: last.correct, memNote: last.memNote };
    },
    function (vals) {
      const ivs = (vals.intervals || []).map(iv => [Number(iv[0]), Number(iv[1])]);
      const qs = (vals.queries || []).map(Number);
      const steps = [];
      const ans = [];
      const snap = (text, code, cls) => steps.push({ text, code, mem: [
        arrView(ivs, cls, "intervals"),
        { type: "array", title: "answers", data: ans.slice(), showIdx: true, size: 8 }
      ] });
      snap("Baseline: for each query, scan EVERY interval and keep the smallest size that covers it.", 1, {});
      for (let qi = 0; qi < qs.length; qi++) {
        const q = qs[qi];
        let best = Infinity;
        snap(`Query <b>${q}</b>: scan all ${ivs.length} intervals for l ≤ ${q} ≤ r.`, 2, {});
        for (let i = 0; i < ivs.length; i++) {
          const l = ivs[i][0], r = ivs[i][1];
          if (l <= q && q <= r) {
            const sz = r - l + 1;
            const prev = best;
            best = Math.min(best, sz);
            snap(`<b>[${l},${r}]</b>: ${l} ≤ ${q} ≤ ${r} ✓ → size ${sz}${best < prev ? " &lt; " + prev + " → new best!" : " (not better)"} best = <b>${best}</b>.`, 6, { [i]: "hot" });
          } else {
            snap(`<b>[${l},${r}]</b>: does NOT contain ${q} → skip. best = ${best === Infinity ? "∞" : best}.`, 5, { [i]: "hl" });
          }
        }
        ans.push(best === Infinity ? -1 : best);
        snap(`Query ${q} → best size ${best === Infinity ? "none" : best} → answers[${qi}] = <b>${ans[ans.length - 1]}</b>.`, 7, {});
      }
      const last = steps[steps.length - 1];
      last.result = JSON.stringify(ans);
      last.correct = JSON.stringify(ans) === JSON.stringify(refBrute(ivs, qs));
      last.memNote = "Time: O(n·q) — every query rescans everything. Space: O(1) extra.";
      return { steps, result: last.result, correct: last.correct, memNote: last.memNote };
    }
  ]
});
