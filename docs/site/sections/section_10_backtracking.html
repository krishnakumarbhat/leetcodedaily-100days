/* ================================================================
 * SHARED HELPERS — decision-tree rendering
 * ================================================================ */
/* renders the recursion call stack as a stack view + current state */
function factorial(n) { return n <= 1 ? 1 : n * factorial(n - 1); }
function bruteExists(board, word) {
  const rows = board.length, cols = rows ? Math.max.apply(null, board.map(r => r.length)) : 0;
  let ok = false;
  function dfs(r, c, i) {
    if (ok) return;
    if (i === word.length) { ok = true; return; }
    if (r < 0 || c < 0 || r >= rows || c >= cols) return;
    if (board[r][c] !== word[i]) return;
    const save = board[r][c];
    board[r][c] = "#";
    dfs(r + 1, c, i + 1); dfs(r - 1, c, i + 1); dfs(r, c + 1, i + 1); dfs(r, c - 1, i + 1);
    board[r][c] = save;
  }
  for (let r = 0; r < rows && !ok; r++) for (let c = 0; c < cols && !ok; c++) dfs(r, c, 0);
  return ok;
}
function countChars(str) {
  const c = {};
  for (const ch of str) c[ch] = (c[ch] || 0) + 1;
  return c;
}
function stateViews(cur, extra) {
  const v = [
    { type: "stack", title: "recursion stack · current choice path", data: cur.slice(), top: cur.length - 1 },
    { type: "array", title: "results found so far", data: (extra.results || []).slice(), showIdx: true, size: 8 }
  ];
  if (extra.extra) v.push(extra.extra);
  return v;
}

/* ================================================================
 * PROBLEM 0078 — SUBSETS
 * ================================================================ */
NC150.register({
  id: "0078", title: "Subsets", difficulty: "Medium",
  url: "https://leetcode.com/problems/subsets/",
  tags: ["backtracking", "bitmask"],
  approaches: ["Approach 1 · Include/exclude DFS (best)", "Approach 2 · Bitmask enumeration"],
  complexities: [
    { time: "O(n · 2ⁿ)", space: "O(n)", note: "BEST — copy each of the 2ⁿ subsets" },
    { time: "O(n · 2ⁿ)", space: "O(n)", note: "bits select elements" }
  ],
  compare: [
    { name: "DFS include/exclude", tech: "branch per element, share one path", time: "O(n·2ⁿ)", space: "O(n)", when: "the standard", best: true },
    { name: "Bitmask", tech: "mask ∈ [0, 2ⁿ), pick set bits", time: "O(n·2ⁿ)", space: "O(1)", when: "iterative mindset", best: false },
    { name: "Iterative build", tech: "extend every subset by x", time: "O(n·2ⁿ)", space: "O(2ⁿ)", when: "BFS flavor", best: false }
  ],
  inputs: [
    { name: "nums", label: "nums =", type: "list", default: "[1,2,3]" }
  ],
  examples: [
    { label: "Ex 1", values: { nums: "[1,2,3]" }, result: "8 subsets" },
    { label: "Ex 2", values: { nums: "[0]" }, result: "2 subsets" },
    { label: "Ex 3", values: { nums: "[]" }, result: "1 subset" }
  ],
  realLife: "<p><b>Feature selection</b>: trying every subset of n features for a model is the power set — pruning with branch-and-bound turns this exponential into a usable search.</p><p><b>Menu & bundle configurators</b>: 'which combinations of options exist' is literally a subsets enumeration.</p>",
  dsDive: `<h3>What "backtrack" means, mechanically</h3>
<p>The DFS shares ONE mutable path list. Entering the include-branch <b>appends</b> the element; leaving it <b>pops</b> — the pop IS the backtrack, restoring the exact state the exclude-sibling expects. Nothing is copied between siblings.</p>
<div class="equation">dfs(i) → [exclude branch] dfs(i+1) &nbsp;→&nbsp; [include branch] push · dfs(i+1) · pop</div>
<p>The recursion tree has 2ⁿ leaves (one per subset) and 2ⁿ⁺¹−1 nodes total. Every leaf materializes a copy → <span class="code-var">O(n·2ⁿ)</span>. The bitmask variant generates the same 2ⁿ masks with no call stack.</p>`,
  code: [
    "def dfs(i):",
    "    if i == n: results.append(path[:])  # leaf = one subset",
    "    else:",
    "        dfs(i + 1)                       # EXCLUDE nums[i]",
    "        path.append(nums[i])             # INCLUDE...",
    "        dfs(i + 1)",
    "        path.pop()                       # ...then backtrack",
    "dfs(0)"
  ],
  steps: [
    function (vals) {
      const nums = (vals.nums || []).map(Number);
      const steps = [];
      const results = [];
      const path = [];
      const snap = (text, code) => steps.push({ text: text, code: code, mem: stateViews(path.slice(), { results: results }) });
      snap(`DFS over nums = [${nums.join(", ")}]: at each index, branch EXCLUDE first, then INCLUDE.`, 1);
      let i = 0;
      function go(idx) {
        if (idx === nums.length) {
          results.push(path.slice());
          snap(`Leaf reached → subset [${path.join(", ")}] recorded. Backtrack to the last decision.`, 2);
          return;
        }
        i++;
        snap(`Position ${idx} (value <b>${nums[idx]}</b>): try EXCLUDE → descend.`, 3);
        go(idx + 1);
        path.push(nums[idx]);
        snap(`Back from exclude. Now INCLUDE <b>${nums[idx]}</b> → descend.`, 4);
        go(idx + 1);
        path.pop();
        snap(`Backtrack: pop <b>${nums[idx]}</b> — the state is restored for the sibling branch.`, 5);
      }
      go(0);
      const last = steps[steps.length - 1];
      last.result = results.length + " subsets: " + JSON.stringify(results.slice(0, 4)) + (results.length > 4 ? " …" : "");
      last.correct = results.length === Math.pow(2, nums.length);
      last.memNote = "Time: O(n·2ⁿ) copying all subsets. Space: O(n) recursion depth.";
      return { steps: steps, result: last.result, correct: last.correct, memNote: last.memNote };
    },
    function (vals) {
      const nums = (vals.nums || []).map(Number);
      const steps = [];
      const results = [];
      const snap = (text, code, mask) => steps.push({ text: text, code: code, mem: [
        { type: "array", title: "counter (bits = chosen elements)", data: nums.map((_, b) => mask === undefined ? "·" : (mask >> b) & 1), showIdx: true, size: 1 },
        { type: "array", title: "results found so far", data: results.slice(), showIdx: true, size: 8 }
      ] });
      snap(`Count from 0 to 2ⁿ−1: bit b of the counter = is nums[b] in this subset?`, 1, 0);
      for (let mask = 0; mask < (1 << nums.length); mask++) {
        const cur = nums.filter((_, b) => (mask >> b) & 1);
        results.push(cur);
        snap(`mask = ${mask} (${nums.map((_, b) => (mask >> b) & 1).join("")}) → subset [${cur.join(", ")}].`, 2, mask);
      }
      const last = steps[steps.length - 1];
      last.result = results.length + " subsets";
      last.correct = results.length === Math.pow(2, nums.length);
      last.memNote = "No call stack — one loop over all masks, O(n·2ⁿ).";
      return { steps: steps, result: last.result, correct: last.correct, memNote: last.memNote };
    }
  ]
});
/* ================================================================
 * PROBLEM 0090 — SUBSETS II (DUPLICATES)
 * ================================================================ */
NC150.register({
  id: "0090", title: "Subsets II", difficulty: "Medium",
  url: "https://leetcode.com/problems/subsets-ii/",
  tags: ["backtracking", "duplicates"],
  approaches: ["Approach 1 · Sorted DFS + skip duplicates (best)", "Approach 2 · Set of masks"],
  complexities: [
    { time: "O(2ⁿ)", space: "O(n)", note: "BEST — skip rule removes duplicates" },
    { time: "O(n·2ⁿ)", space: "O(2ⁿ)", note: "dedupe by hash set" }
  ],
  compare: [
    { name: "Sorted DFS skip", tech: "skip equal neighbors after a choice", time: "O(2ⁿ)", space: "O(n)", when: "the standard", best: true },
    { name: "Set of tuples", tech: "generate all, hash-dedupe", time: "O(n·2ⁿ)", space: "O(2ⁿ)", when: "quick and dirty", best: false }
  ],
  inputs: [
    { name: "nums", label: "nums =", type: "list", default: "[1,2,2]" }
  ],
  examples: [
    { label: "Ex 1", values: { nums: "[1,2,2]" }, result: "6 subsets" },
    { label: "Ex 2", values: { nums: "[0]" }, result: "2 subsets" },
    { label: "Ex 3", values: { nums: "[1,1,1]" }, result: "4 subsets" }
  ],
  realLife: "<p><b>Set-cover style optimizers</b> where identical items exist: deduplicating the search space avoids exploring isomorphic branches — the same skip rule powers many constraint solvers.</p><p><b>Data dedup pipelines</b>: enumerating unique groupings of repeated records is this exact enumeration.</p>",
  dsDive: `<h3>Why sorting makes duplicates skippable</h3>
<p>Equal values are adjacent after sorting. Two copies of value v at the same decision level generate <b>identical subtrees</b> — the second copy's work was already done by the first. The rule <span class="code-var">if j > i and c[j] == c[j−1]: continue</span> skips exactly those redundant branches. Note the condition is <b>j > i</b>, not j > 0: the first copy of v must still be usable; only later equal ones are skipped.</p>
<div class="equation">[1,2,2]: at level 1, use 2 (idx 1) → subtree with one 2; skip idx 2's 2 → subtree with two 2s only generated from idx 1</div>
<p>Total subsets collapse to 2^d where d = number of DISTINCT values.</p>`,
  code: [
    "nums.sort()",
    "def dfs(i):",
    "    results.append(path[:])              # every node is a subset",
    "    for j in range(i, len(nums)):",
    "        if j > i and nums[j] == nums[j-1]:",
    "            continue                      # skip duplicate siblings",
    "        path.append(nums[j])",
    "        dfs(j + 1)",
    "        path.pop()",
    "dfs(0)"
  ],
  steps: [
    function (vals) {
      const nums = (vals.nums || []).map(Number).sort((a, b) => a - b);
      const steps = [];
      const results = [];
      const path = [];
      const snap = (text, code) => steps.push({ text: text, code: code, mem: stateViews(path.slice(), { results: results, extra: { type: "array", title: "nums (sorted)", data: nums.slice(), showIdx: true, size: 4 } }) });
      snap(`Sort [${nums.join(", ")}] — equal values now sit next to each other.`, 1);
      function go(i) {
        results.push(path.slice());
        snap(`Record subset [${path.join(", ")}] — every node of the tree is a subset.`, 2);
        for (let j = i; j < nums.length; j++) {
          if (j > i && nums[j] === nums[j - 1]) {
            snap(`j=${j}: value <b>${nums[j]}</b> equals the previous candidate → <b>skip</b> (its subtree was already explored).`, 3);
            continue;
          }
          path.push(nums[j]);
          snap(`Choose <b>${nums[j]}</b> (first copy) → descend.`, 4);
          go(j + 1);
          path.pop();
        }
      }
      go(0);
      const last = steps[steps.length - 1];
      last.result = results.length + " unique subsets";
      last.correct = true;
      last.memNote = "Time: O(2ⁿ) worst (all distinct). Space: O(n) depth.";
      return { steps: steps, result: last.result, correct: last.correct, memNote: last.memNote };
    },
    function (vals) {
      const nums = (vals.nums || []).map(Number).sort((a, b) => a - b);
      const steps = [];
      const seen = [];
      const snap = (text, code) => steps.push({ text: text, code: code, mem: [
        { type: "array", title: "unique subsets (hash-deduped)", data: seen.slice(), showIdx: true, size: 8 }
      ] });
      snap(`Baseline: generate ALL 2ⁿ subsets, hash-dedupe.`, 1);
      for (let mask = 0; mask < (1 << nums.length); mask++) {
        const cur = nums.filter((_, b) => (mask >> b) & 1).join(",");
        if (!seen.includes(cur)) {
          seen.push(cur);
          snap(`mask ${mask} → [${cur}] new → keep.`, 2);
        } else {
          snap(`mask ${mask} → [${cur}] <b>already seen</b> → dropped.`, 3);
        }
      }
      const last = steps[steps.length - 1];
      last.result = seen.length + " unique subsets";
      last.correct = true;
      last.memNote = "Same answer, but pays O(2ⁿ) for duplicates the DFS skip rule avoids for free.";
      return { steps: steps, result: last.result, correct: last.correct, memNote: last.memNote };
    }
  ]
});

/* ================================================================
 * PROBLEM 0046 — PERMUTATIONS
 * ================================================================ */
NC150.register({
  id: "0046", title: "Permutations", difficulty: "Medium",
  url: "https://leetcode.com/problems/permutations/",
  tags: ["backtracking"],
  approaches: ["Approach 1 · Swap-based DFS (best)", "Approach 2 · used[] bitmap"],
  complexities: [
    { time: "O(n · n!)", space: "O(n)", note: "BEST — state lives in the array" },
    { time: "O(n · n!)", space: "O(n)", note: "explicit used[]" }
  ],
  compare: [
    { name: "Swap DFS", tech: "fix pos via swaps, no extra array", time: "O(n·n!)", space: "O(n)", when: "memory-lean", best: true },
    { name: "used[] DFS", tech: "bitmap + running permutation", time: "O(n·n!)", space: "O(n)", when: "readable", best: false }
  ],
  inputs: [
    { name: "nums", label: "nums =", type: "list", default: "[1,2,3]" }
  ],
  examples: [
    { label: "Ex 1", values: { nums: "[1,2,3]" }, result: "6 permutations" },
    { label: "Ex 2", values: { nums: "[0,1]" }, result: "2 permutations" },
    { label: "Ex 3", values: { nums: "[1]" }, result: "1 permutation" }
  ],
  realLife: "<p><b>Route planning</b>: the travelling-salesman brute force enumerates permutations of cities; smarter versions prune with branch-and-bound.</p><p><b>Anagram & crossword engines</b>: generating all letter arrangements, then filtering against a dictionary.</p>",
  dsDive: `<h3>The swap trick: state without storage</h3>
<p>At position pos, elements left of pos are already fixed (used); the suffix holds the remaining pool. Swapping nums[pos] ↔ nums[j] places candidate j in its slot and shrinks the pool — <b>no used[] array exists</b>. The backtrack is the reverse swap. Each leaf materializes the array: n! leaves × O(n) copy = <span class="code-var">O(n·n!)</span>.</p>
<div class="equation">fix(1): [1,2,3] → swap(0,1) [2,1,3] → fix(1): swap(1,2) [2,3,1] → leaf [2,3,1]</div>
<p>The used[] version encodes the same tree with an explicit bitmap — identical work, more readable.</p>`,
  code: [
    "def dfs(pos):",
    "    if pos == n: results.append(nums[:])   # leaf = one permutation",
    "    for j in range(pos, n):",
    "        nums[pos], nums[j] = nums[j], nums[pos]   # place candidate",
    "        dfs(pos + 1)",
    "        nums[pos], nums[j] = nums[j], nums[pos]   # BACKTRACK (un-swap)",
    "dfs(0)"
  ],
  steps: [
    function (vals) {
      const nums = (vals.nums || []).map(Number);
      const steps = [];
      const results = [];
      const arr = nums.slice();
      const snap = (text, code, cls) => steps.push({ text: text, code: code, mem: [
        { type: "array", title: "nums · left of pos = fixed (used), right = pool", data: arr.slice(), cls: cls || {}, showIdx: true, size: 4 },
        { type: "array", title: "permutations found", data: results.slice(), showIdx: true, size: 8 }
      ] });
      snap(`Swap-DFS: position 0 is filled by swapping in ANY element of the pool.`, 1, { 0: "hot" });
      function go(pos) {
        if (pos === arr.length) {
          results.push(arr.slice());
          snap(`Full permutation [${arr.join(", ")}] recorded.`, 2);
          return;
        }
        for (let j = pos; j < arr.length; j++) {
          [arr[pos], arr[j]] = [arr[j], arr[pos]];
          snap(`swap(${pos},${j}): fix <b>${arr[pos]}</b> at position ${pos} → recurse.`, 3, { [pos]: "done", [j]: "hot" });
          go(pos + 1);
          [arr[pos], arr[j]] = [arr[j], arr[pos]];
          snap(`Backtrack: swap back → pool restored for the next candidate.`, 4, { [pos]: "hot" });
        }
      }
      go(0);
      const last = steps[steps.length - 1];
      last.result = results.length + " permutations";
      last.correct = results.length === factorial(arr.length);
      last.memNote = "Time: O(n·n!). Space: O(n) — the array itself carries the state.";
      return { steps: steps, result: last.result, correct: last.correct, memNote: last.memNote };
    },
    function (vals) {
      const nums = (vals.nums || []).map(Number);
      const steps = [];
      const results = [];
      const path = [];
      const used = [];
      const snap = (text, code) => steps.push({ text: text, code: code, mem: [
        { type: "array", title: "used[] bitmap (1 = already placed)", data: used.slice(), cls: used.map(x => (x ? "done" : null)), showIdx: true, size: 4 },
        { type: "stack", title: "permutation under construction", data: path.slice(), top: path.length - 1 },
        { type: "array", title: "permutations found", data: results.slice(), showIdx: true, size: 8 }
      ] });
      snap(`Classic DFS: pick any UNUSED element for the next slot.`, 1);
      function go() {
        if (path.length === nums.length) {
          results.push(path.slice());
          snap(`Permutation [${path.join(", ")}] complete.`, 2);
          return;
        }
        for (let i = 0; i < nums.length; i++) {
          if (used[i]) continue;
          used[i] = 1;
          path.push(nums[i]);
          snap(`Place <b>${nums[i]}</b> (used[${i}]=1) → recurse.`, 3);
          go();
          path.pop();
          used[i] = 0;
          snap(`Backtrack: remove <b>${nums[i]}</b>, free slot ${i}.`, 4);
        }
      }
      go();
      const last = steps[steps.length - 1];
      last.result = results.length + " permutations";
      last.correct = results.length === factorial(nums.length);
      last.memNote = "Same complexity; explicit used[] trades clarity for a bitmap.";
      return { steps: steps, result: last.result, correct: last.correct, memNote: last.memNote };
    }
  ]
});



/* ================================================================
 * PROBLEM 0079 — WORD SEARCH
 * ================================================================ */
NC150.register({
  id: "0079", title: "Word Search", difficulty: "Medium",
  url: "https://leetcode.com/problems/word-search/",
  tags: ["backtracking", "grid"],
  approaches: ["Approach 1 · In-place sentinel marking (best)", "Approach 2 · visited[][] bitmap"],
  complexities: [
    { time: "O(m·n·3^L)", space: "O(L)", note: "BEST — sentinel encodes visited in the board" },
    { time: "O(m·n·3^L)", space: "O(m·n + L)", note: "explicit bitmap" }
  ],
  compare: [
    { name: "Sentinel marking", tech: "overwrite cell, restore on unwind", time: "O(m·n·3^L)", space: "O(L)", when: "the standard", best: true },
    { name: "visited[][]", tech: "separate bool grid", time: "O(m·n·3^L)", space: "O(m·n)", when: "readability", best: false }
  ],
  inputs: [
    { name: "board", label: "board rows =", type: "list", default: '["ABCE","SFCS","ADEE"]' },
    { name: "word", label: "word =", type: "str", default: "ABCCED" }
  ],
  examples: [
    { label: "Ex 1", values: { board: '["ABCE","SFCS","ADEE"]', word: "ABCCED" }, result: "true" },
    { label: "Ex 2", values: { board: '["ABCE","SFCS","ADEE"]', word: "SEE" }, result: "true" },
    { label: "Ex 3", values: { board: '["ABCE","SFCS","ADEE"]', word: "ABCB" }, result: "false" }
  ],
  realLife: "<p><b>OCR / handwriting recognition</b>: tracing a letter path over ambiguous glyph grids — DFS with claim/release is the model.</p><p><b>Pathfinding with no-revisit</b>: maze solvers that must not step on a cell twice use the same sentinel trick.</p>",
  dsDive: `<h3>The one-byte state machine</h3>
