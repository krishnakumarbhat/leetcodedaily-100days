const SECTION = { id: "17", title: "Math & Geometry" };

/* ================================================================
 * SHARED HELPERS
 * ================================================================ */
/* grid inputs arrive as a list of row-strings, e.g. ["123","456"] */
function parseGrid(vals, name) {
  return (vals[name] || []).map(r => String(r).split("").map(Number));
}
/* one char -> its integer value */
function digit(c) { return Number(c); }
/* format a float like LeetCode's 5-decimal rounding, trimmed */
function fmtNum(v) {
  if (!Number.isFinite(v)) return "not a real number";
  return Number(v.toFixed(5)).toString();
}
/* sum of squares of the digits of n — the heart of happy-number */
function sumSq(n) { return String(n).split("").reduce((s, d) => s + Number(d) * Number(d), 0); }
/* manual digit-wise string addition (multiply-strings helper) */
function addStr(x, y) {
  let i = x.length - 1, j = y.length - 1, carry = 0, out = "";
  while (i >= 0 || j >= 0 || carry) {
    const s = (i >= 0 ? +x[i] : 0) + (j >= 0 ? +y[j] : 0) + carry;
    out = (s % 10) + out;
    carry = Math.floor(s / 10);
    i--; j--;
  }
  return out.replace(/^0+/, "") || "0";
}

/* ================================================================
 * PROBLEM 0043 — MULTIPLY STRINGS
 * ================================================================ */
NC150.register({
  id: "0043", title: "Multiply Strings", difficulty: "Medium",
  url: "https://leetcode.com/problems/multiply-strings/",
  tags: ["math", "string", "simulation"],
  approaches: ["Approach 1 · Position array + carry (best)", "Approach 2 · Stacked rows, digit-wise add"],
  complexities: [
    { time: "O(m·n)", space: "O(m+n)", note: "BEST — the classic positions trick" },
    { time: "O(m·n)", space: "O(m+n)", note: "same work, visible rows" }
  ],
  compare: [
    { name: "BigInt / parseInt", tech: "convert to int", time: "O(m+n)", space: "O(1)", when: "prototyping only", best: false },
    { name: "Position array", tech: "digits land at i+j, i+j+1", time: "O(m·n)", space: "O(m+n)", when: "the interview answer", best: true },
    { name: "Stacked rows", tech: "num1 × each digit, sum shifted rows", time: "O(m·n)", space: "O(m+n)", when: "matches pen-and-paper", best: false }
  ],
  inputs: [
    { name: "num1", label: "num1 =", type: "str", default: "123" },
    { name: "num2", label: "num2 =", type: "str", default: "456" }
  ],
  examples: [
    { label: "Ex 1", values: { num1: "123", num2: "456" }, result: "56088" },
    { label: "Ex 2", values: { num1: "2", num2: "3" }, result: "6" },
    { label: "Ex 3", values: { num1: "123", num2: "0" }, result: "0" }
  ],
  realLife: "<p><b>Big-number arithmetic libraries</b> (Python big ints, RSA crypto) multiply 1024-bit numbers exactly like this — digit arrays, never floats.</p><p><b>Fixed-point financial math</b>: money kept as digit strings dodges the 0.1+0.2 rounding plague; the position array IS the multiplication routine.</p>",
  dsDive: `<h3>The positions trick: every digit pair owns two slots</h3>
<p>Digit <span class="code-var">a[i]</span> × <span class="code-var">b[j]</span> is 10^(i+j) in value: its tens part lands in slot <b>i+j</b>, its ones part in slot <b>i+j+1</b>. No string reversals — the carry folds in the moment each pair is processed, and the m+n result array is pre-sized, never reallocated.</p>
<div class="equation">a[i]·b[j] = d₁d₂ → d₁ → slot i+j &nbsp;&nbsp; d₂ → slot i+j+1</div>
<p>Both loops run right-to-left — exactly pen-and-paper order, which is why the carry chain never leaks past its slot.</p>`,
  code: [
    "# A1 — position array",
    "pos = [0] * (len(num1) + len(num2))",
    "for i from len(num1)-1 down to 0:",
    "    for j from len(num2)-1 down to 0:",
    "        s = a[i]*b[j] + pos[i+j+1]   # add existing ones-part",
    "        pos[i+j]   += s // 10        # carry folds into tens slot",
    "        pos[i+j+1]  = s % 10         # ones stays put",
    "return str(int(''.join(map(str,pos))))",
    "# A2 — stacked rows (pen & paper)",
    "total = '0'",
    "for k, d in enumerate(reversed(num2)):",
    "    row = num1 * d                   # one digit × whole number",
    "    total = add_str(total, row + '0'*k)   # shift + manual add"
  ],
  steps: [
    function (vals) {
      const a = String(vals.num1 == null ? "123" : vals.num1).replace(/[^0-9]/g, "") || "0";
      const b = String(vals.num2 == null ? "456" : vals.num2).replace(/[^0-9]/g, "") || "0";
      const steps = [];
      const m = a.length, n = b.length;
      const pos = new Array(m + n).fill(0);
      const snap = (text, code, cls) => steps.push({ text: text, code: code, mem: [
        { type: "array", title: "pos — product slots (tens → i+j, ones → i+j+1)", data: pos.slice(), cls: cls || {}, showIdx: true, size: 4 },
        { type: "array", title: "num1 digits", data: a.split(""), cls: {}, showIdx: true, size: 1 },
        { type: "array", title: "num2 digits", data: b.split(""), cls: {}, showIdx: true, size: 1 }
      ]});
      snap(`Multiply "<b>${a}</b>" × "<b>${b}</b>" into ${m + n} zeroed slots — a product never needs more than m+n digits.`, 1);
      for (let i = m - 1; i >= 0; i--) {
        const d1 = digit(a[i]);
        for (let j = n - 1; j >= 0; j--) {
          const d2 = digit(b[j]);
          const mul = d1 * d2;
          const p1 = i + j, p2 = i + j + 1;
          const sum = mul + pos[p2];
          const carry = Math.floor(sum / 10);
          pos[p1] += carry;
          pos[p2] = sum % 10;
          snap(`<b>${d1}</b> × <b>${d2}</b> = ${mul}; add existing ${sum - mul} at slot ${p2} → <b>${sum}</b>; ones <b>${sum % 10}</b> stays, carry <b>${carry}</b> folds into slot ${p1}.`, 4, { [p1]: "hot", [p2]: "hl" });
        }
      }
      let carry = 0;
      for (let k = pos.length - 1; k >= 0; k--) {
        const t = pos[k] + carry;
        pos[k] = t % 10;
        carry = Math.floor(t / 10);
      }
      snap(`All digit pairs processed — the slots now hold product digits left-to-right. Strip leading zeros.`, 7, {});
      const prod = pos.join("").replace(/^0+/, "") || "0";
      const last = steps[steps.length - 1];
      last.result = prod;
      last.correct = prod === (BigInt(a) * BigInt(b)).toString();
      last.memNote = "Time: O(m·n) digit pairs. Space: O(m+n) for the position array.";
      return { steps: steps, result: prod, correct: last.correct, memNote: last.memNote };
    },
    function (vals) {
      const a = String(vals.num1 == null ? "123" : vals.num1).replace(/[^0-9]/g, "") || "0";
      const b = String(vals.num2 == null ? "456" : vals.num2).replace(/[^0-9]/g, "") || "0";
      const steps = [];
      let total = "0";
      const rows = [];
      const snap = (text, code, cls) => steps.push({ text: text, code: code, mem: [
        { type: "array", title: "shifted rows so far (pen-and-paper layout)", data: rows.slice(), cls: cls || {}, showIdx: true, size: 8 },
        { type: "string", title: "running total (digit-wise addition)", data: total.split(""), cls: {}, size: 1 }
      ]});
      snap(`Paper method: multiply "<b>${a}</b>" by each digit of "<b>${b}</b>", shift the row by its place value, add the rows.`, 0);
      for (let k = 0; k < b.length; k++) {
        const d = digit(b[b.length - 1 - k]);
        let row = "", carry = 0;
        for (let i = a.length - 1; i >= 0; i--) {
          const t = digit(a[i]) * d + carry;
          row = (t % 10) + row;
          carry = Math.floor(t / 10);
          snap(`<b>${digit(a[i])}</b> × <b>${d}</b> + carry ${Math.floor(t / 10) ? Math.floor(t / 10) : 0} → write <b>${t % 10}</b>, new carry <b>${Math.floor(t / 10)}</b>.`, 3);
        }
        if (carry) row = carry + row;
        const shifted = row + "0".repeat(k);
        rows.push(shifted);
        const before = total;
        total = addStr(total, shifted);
        snap(`Row for digit <b>${d}</b>: "<b>${shifted}</b>" (shifted by ${k} place(s)). Add: ${before} + ${shifted} = <b>${total}</b>.`, 5, { [rows.length - 1]: "done" });
      }
      const prod = total;
      const last = steps[steps.length - 1];
      last.result = prod;
      last.correct = prod === (BigInt(a) * BigInt(b)).toString();
      last.memNote = "Same O(m·n) work; rows make the place-value shifts visible, total kept as a digit string.";
      return { steps: steps, result: prod, correct: last.correct, memNote: last.memNote };
    }
  ]
});

/* ================================================================
 * PROBLEM 0048 — ROTATE IMAGE
 * ================================================================ */
NC150.register({
  id: "0048", title: "Rotate Image", difficulty: "Medium",
  url: "https://leetcode.com/problems/rotate-image/",
  tags: ["array", "matrix", "simulation"],
  approaches: ["Approach 1 · Layer rotation, 4-way swaps (best)", "Approach 2 · Transpose + reverse rows"],
  complexities: [
    { time: "O(n²)", space: "O(1)", note: "BEST — fully in place, no extra grid" },
    { time: "O(n²)", space: "O(1)", note: "two passes, still in place" }
  ],
  compare: [
    { name: "Copy to new grid", tech: "res[c][n-1-r] = a[r][c]", time: "O(n²)", space: "O(n²)", when: "non-square inputs", best: false },
    { name: "Layer rotation", tech: "4-way cyclic swaps per ring", time: "O(n²)", space: "O(1)", when: "the interview answer", best: true },
    { name: "Transpose + reverse", tech: "swap r↔c, then flip rows", time: "O(n²)", space: "O(1)", when: "easiest to remember", best: false }
  ],
  inputs: [
    { name: "matrix", label: "matrix rows =", type: "list", default: '["1","2","3","4"]' }
  ],
  examples: [
    { label: "Ex 1", values: { matrix: '["123","456","789"]' }, result: "[[7,4,1],[8,5,2],[9,6,3]]" },
    { label: "Ex 2", values: { matrix: '["12","34"]' }, result: "[[3,1],[4,2]]" },
    { label: "Ex 3", values: { matrix: '["1"]' }, result: "[[1]]" }
  ],
  realLife: "<p><b>Image rotation</b> in every photo editor and phone camera: a bitmap rotates 90° by exactly these memory moves — in-place when square, one scratch row otherwise.</p><p><b>Document scanners & OCR pipelines</b> rotate captured pages into upright orientation with the same transpose+flip trick.</p>",
  dsDive: `<h3>Four cells trade one value — that is a rotation</h3>
<p>Clockwise rotation moves each value (r, c) → (c, n−1−r). Around a ring the four partners are one swap cycle: top → right → bottom → left → top. Each layer processes n−2·layer−1 such cycles with ONE saved variable — the whole rotation touches every cell exactly once, no scratch array.</p>
<div class="equation">(r,c) → (c, n−1−r) &nbsp;|&nbsp; ring layer ℓ covers rows/cols ℓ .. n−1−ℓ</div>
<p>The transpose+reverse variant is the same permutation decomposed as two passes; matrix rows in RAM are contiguous, so flipping a row is a burst of sequential writes.</p>`,
  code: [
    "# A1 — layer rotation (in place)",
    "for l in range(n // 2):",
    "    for i in range(n - 2*l - 1):",
    "        save = a[l][l+i]                    # top",
    "        a[l][l+i]        = a[n-1-l-i][l]    # left  → top",
    "        a[n-1-l-i][l]    = a[n-1-l][n-1-l-i] # bottom → left",
    "        a[n-1-l][n-1-l-i] = a[l+i][n-1-l]   # right → bottom",
    "        a[l+i][n-1-l]    = save              # saved top → right",
    "# A2 — transpose then reverse rows",
    "for r in range(n): for c in range(r, n): a[r][c], a[c][r] = a[c][r], a[r][c]",
    "for r in range(n): a[r].reverse()"
  ],
  steps: [
    function (vals) {
      const rows = parseGrid(vals, "matrix");
      const steps = [];
      const m = rows.length, n = m ? rows[0].length : 0;
      let a = rows.map(r => r.slice());
      const snap = (text, code, cls) => steps.push({ text: text, code: code, mem: [
        { type: "grid", title: "matrix · hot = the 4-cycle being rotated", data: a.map(r => r.slice()), cols: Math.max(n, a[0] ? a[0].length : 0), cls: cls || {} }
      ]});
      if (m === 0 || n === 0) {
        const e = { text: "Empty matrix — nothing to rotate.", code: 0, mem: [], result: "[]", correct: true, memNote: "O(1)." };
        steps.push(e);
        return { steps: steps, result: "[]", correct: true, memNote: "O(1)." };
      }
      snap(`Rotate clockwise: each value moves (r,c) → (c, ${m - 1}-r). Matrix is ${m}×${n}.`, 0, {});
      const expect = Array.from({ length: n }, () => Array(m).fill(0));
      for (let r = 0; r < m; r++) for (let c = 0; c < n; c++) expect[c][m - 1 - r] = rows[r][c];
      const perCell = m * n <= 64;
      if (m === n) {
        const N = m;
        for (let l = 0; l < Math.floor(N / 2); l++) {
          for (let i = 0; i < N - 2 * l - 1; i++) {
            const t = a[l][l + i];
            const cells = { [l + "," + (l + i)]: "hot", [l + "," + (N - 1 - l)]: "hot", [(N - 1 - l) + "," + (N - 1 - l - i)]: "hot", [(N - 1 - l - i) + "," + l]: "hot" };
            a[l][l + i] = a[N - 1 - l - i][l];
            a[N - 1 - l - i][l] = a[N - 1 - l][N - 1 - l - i];
            a[N - 1 - l][N - 1 - l - i] = a[l + i][N - 1 - l];
            a[l + i][N - 1 - l] = t;
            if (perCell || i === 0) snap(`Layer ${l}: rotate the cycle top(${l},${l + i}) → right(${l + i},${N - 1 - l}) → bottom(${N - 1 - l},${N - 1 - l - i}) → left(${N - 1 - l - i},${l}) — one saved variable.`, 4, cells);
          }
        }
      } else {
        a = Array.from({ length: n }, () => Array(m).fill(0));
        for (let r = 0; r < m; r++) {
          for (let c = 0; c < n; c++) {
            const cells = { [r + "," + c]: "hot", [c + "," + (m - 1 - r)]: "hl" };
            a[c][m - 1 - r] = rows[r][c];
            if (perCell) snap(`Cell (${r},${c}) = <b>${rows[r][c]}</b> lands at destination (${c},${m - 1 - r}) in the rotated grid.`, 1, cells);
          }
          if (!perCell) snap(`Row ${r} of ${m} mapped into the rotated grid.`, 1, { [r + ",0"]: "hl" });
        }
      }
      const res = JSON.stringify(a);
      const last = steps[steps.length - 1];
      last.result = res;
      last.correct = JSON.stringify(a) === JSON.stringify(expect);
      last.memNote = "Time: O(n²) — every cell touched once. Space: O(1) beyond the grid itself.";
      return { steps: steps, result: res, correct: last.correct, memNote: last.memNote };
    },
    function (vals) {
      const rows = parseGrid(vals, "matrix");
      const steps = [];
      const m = rows.length, n = m ? rows[0].length : 0;
      const snap = (text, code, cls) => steps.push({ text: text, code: code, mem: [
        { type: "grid", title: "matrix mid-transform", data: rows.map(r => r.slice()), cols: n, cls: cls || {} }
      ]});
      if (m === 0 || n === 0) {
        const e = { text: "Empty matrix — nothing to rotate.", code: 0, mem: [], result: "[]", correct: true, memNote: "O(1)." };
        steps.push(e);
        return { steps: steps, result: "[]", correct: true, memNote: "O(1)." };
      }
      const expect = Array.from({ length: n }, () => Array(m).fill(0));
      for (let r = 0; r < m; r++) for (let c = 0; c < n; c++) expect[c][m - 1 - r] = rows[r][c];
      snap(`Two-pass trick: <b>transpose</b> (rows become columns) then <b>reverse each row</b> — for any shape, this equals a 90° clockwise turn.`, 6, {});
      const t = Array.from({ length: n }, () => Array(m).fill(0));
      const perCell = m * n <= 64;
      for (let r = 0; r < m; r++) {
        for (let c = 0; c < n; c++) {
          t[c][r] = rows[r][c];
          if (perCell) snap(`Transpose: t[${c}][${r}] = a[${r}][${c}] = <b>${rows[r][c]}</b>.`, 7, { [r + "," + c]: "hot" });
        }
        if (!perCell) snap(`Transpose row ${r} done — column ${r} of the result is filled.`, 7, { [r + ",0"]: "hl" });
      }
      for (let r = 0; r < n; r++) {
        t[r].reverse();
        snap(`Reverse row ${r} → <b>[${t[r].join(",")}]</b> — the turn completes.`, 8, { [r + "," + 0]: "done" });
      }
      const res = JSON.stringify(t);
      const last = steps[steps.length - 1];
      last.result = res;
      last.correct = JSON.stringify(t) === JSON.stringify(expect);
      last.memNote = "Same O(n²); two in-place passes, arguably easier to derive on the spot.";
      return { steps: steps, result: res, correct: last.correct, memNote: last.memNote };
    }
  ]
});

/* ================================================================
 * PROBLEM 0050 — POW(X, N)
 * ================================================================ */
NC150.register({
  id: "0050", title: "Pow(x, n)", difficulty: "Medium",
  url: "https://leetcode.com/problems/powx-n/",
  tags: ["math", "binary exponentiation", "recursion"],
  approaches: ["Approach 1 · Recursive fast exponentiation (best)", "Approach 2 · Iterative binary exponentiation"],
  complexities: [
    { time: "O(log n)", space: "O(log n)", note: "BEST — halve n each level" },
    { time: "O(log n)", space: "O(1)", note: "loop over n's bits, no stack" }
  ],
  compare: [
    { name: "Naive loop", tech: "multiply n times", time: "O(n)", space: "O(1)", when: "tiny n", best: false },
    { name: "Recursive fast pow", tech: "x^n = (x^(n/2))²", time: "O(log n)", space: "O(log n)", when: "the interview answer", best: true },
    { name: "Iterative bits", tech: "square base, multiply on set bits", time: "O(log n)", space: "O(1)", when: "no stack wanted", best: false }
  ],
  inputs: [
    { name: "x", label: "x =", type: "str", default: "2.00000" },
    { name: "n", label: "n =", type: "int", default: "10" }
  ],
  examples: [
    { label: "Ex 1", values: { x: "2.00000", n: "10" }, result: "1024" },
    { label: "Ex 2", values: { x: "2.10000", n: "3" }, result: "9.261" },
    { label: "Ex 3", values: { x: "2.00000", n: "-2" }, result: "0.25" }
  ],
  realLife: "<p><b>Exponentiation by squaring</b> powers RSA encryption, Diffie-Hellman key exchange and every modular exponent — 2^65537 costs ~17 multiplications, not 65537.</p><p><b>Financial compounding</b>: (1+r)^t over thousands of days uses the same halving trick to avoid float drift.</p>",
  dsDive: `<h3>Halve the exponent, square the base</h3>

      if (!ops.length) {
        const e = { text: "No valid ops found.", code: 0, mem: [], result: "0 squares", correct: true, memNote: "O(1)." };
        return { steps: [e], result: "0 squares", correct: true, memNote: "O(1)." };
      }
      if (ops.every(o => o.t === "a")) {
        const last = ops[ops.length - 1];
        ops[ops.length - 1] = { t: "q", x: last.x, y: last.y };
      }
      const steps = [];
      const map = new Map();
      const plane = () => {
        const xs = [], ys = [];
        map.forEach((col, x) => { xs.push(x); col.forEach((c, y) => ys.push(y)); });
        if (!xs.length) return null;
        const minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
        const minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
        if ((maxX - minX + 1) * (maxY - minY + 1) > 144) return null;
        const data = [];
        for (let y = maxY; y >= minY; y--) {
          const row = [];
          for (let x = minX; x <= maxX; x++) {
            const col = map.get(x);
            row.push(col && col.get(y) ? col.get(y) : ".");
          }
          data.push(row);
        }
        return { type: "grid", title: "plane (y desc) · counts per point", data: data, cols: maxX - minX + 1, cls: {}, x0: minX, y0: minY };
      };
      const snaps = [];
      const snap = (text, code, cls, qx, qy) => {
        const views = [];
        const mapViews = [];
        map.forEach((col, x) => {
          const o = {};
          col.forEach((c, y) => { o[y] = c; });
          mapViews.push({ k: String(x), v: JSON.stringify(o) });
        });
        views.push({ type: "hashmap", title: "x → { y: count }", mode: "chaining", slots: mapViews, cls: {} });
        const pl = plane();
        if (pl) {
          if (qx !== undefined) {
            const rowsN = pl.data.length;
            pl.cls[(rowsN - 1 - (qy - pl.y0)) + "," + (qx - pl.x0)] = "hot";
          }
          views.push(pl);
        }
        steps.push({ text: text, code: code, mem: views });
      };
      snap(`Ops script: ${ops.map(o => o.t === "q" ? `count(${o.x},${o.y})` : `add(${o.x},${o.y})`).join(" · ")}. The map groups each point by x.`, 1);
      let answer = 0;
      let qx, qy;
      for (let i = 0; i < ops.length; i++) {
        const o = ops[i];
        if (o.t === "a") {
          if (!map.has(o.x)) map.set(o.x, new Map());
          const col = map.get(o.x);
          col.set(o.y, (col.get(o.y) || 0) + 1);
          snap(`add(${o.x},${o.y}): x=${o.x} bucket gets y=${o.y} count ${col.get(o.y)}.`, 2, {}, o.x, o.y);
        } else {
          qx = o.x; qy = o.y;
          let res = 0;
          const col = map.get(qx);
          snap(`count(${qx},${qy}): look at every OTHER y in column x=${qx} as the diagonal partner.`, 3, {}, qx, qy);
          if (col) {
            col.forEach((cnt, y) => {
              if (y === qy) return;
              const d = y - qy;
              const nx = qx + d;
              const ncol = map.get(nx);
              const c1 = ncol ? ncol.get(y) || 0 : 0;
              const c2 = ncol ? ncol.get(qy) || 0 : 0;
              const add = cnt * c1 * c2;
              res += add;
              snap(`Diagonal partner (${qx},${y}) ×${cnt}: d = ${y}−${qy} = ${d}, other column x=${nx}. Corners (${nx},${y}) ×${c1} and (${nx},${qy}) ×${c2} → contributes <b>${cnt}·${c1}·${c2} = ${add}</b> square(s).`, 4, {}, qx, qy);
            });
          }
          answer = res;
          snap(`count(${qx},${qy}) = <b>${res}</b> square(s).`, 5, {}, qx, qy);
        }
      }
      const finalV = answer === 1 ? "1 square" : answer + " squares";
      const last = steps[steps.length - 1];
      last.result = finalV;
      last.correct = true;
      last.memNote = "add: O(1). count: O(k) with k = distinct y in the query column. Space: O(n).";
      return { steps: steps, result: finalV, correct: true, memNote: last.memNote };
    },
    function (vals) {
      const ops = [];
      (vals.points || []).forEach(p => {
        const s = String(p);
        const mm = s.match(/(-?\d+)[,\s]+(-?\d+)/);
        if (!mm) return;
        const isQ = /^[qQ?]/.test(s.trim());
        ops.push({ t: isQ ? "q" : "a", x: Number(mm[1]), y: Number(mm[2]) });
      });
      if (!ops.length) {
        const e = { text: "No valid ops found.", code: 0, mem: [], result: "0 squares", correct: true, memNote: "O(1)." };
        return { steps: [e], result: "0 squares", correct: true, memNote: "O(1)." };
      }
      if (ops.every(o => o.t === "a")) {
        const last = ops[ops.length - 1];
        ops[ops.length - 1] = { t: "q", x: last.x, y: last.y };
      }
      const steps = [];
      const pts = [];
      const freq = new Map();
      const key = (x, y) => x + "," + y;
      const snap = (text, code) => steps.push({ text: text, code: code, mem: [
        { type: "array", title: "point list (flat)", data: pts.slice(), cls: {}, showIdx: true, size: 4 }
      ]});
      snap(`Flat-list version: no nested map — count() scans every stored point for each corner.`, 7);
      let answer = 0;
      for (let i = 0; i < ops.length; i++) {
        const o = ops[i];
        if (o.t === "a") {
          pts.push("(" + o.x + "," + o.y + ")");
          freq.set(key(o.x, o.y), (freq.get(key(o.x, o.y)) || 0) + 1);
          snap(`add(${o.x},${o.y}) → stored; frequency ${freq.get(key(o.x, o.y))}.`, 8);
        } else {
          let res = 0;
          snap(`count(${o.x},${o.y}): scan the list for a diagonal partner (same x, different y).`, 9);
          for (let j = 0; j < pts.length; j++) {
            const m1 = pts[j].match(/(-?\d+),(-?\d+)/);
            const px = Number(m1[1]), py = Number(m1[2]);
            if (px !== o.x || py === o.y) continue;
            const d = py - o.y;
            const nx = o.x + d;
            const cDiag = freq.get(key(nx, py)) || 0;
            const cOther = freq.get(key(nx, o.y)) || 0;
            const add = freq.get(key(o.x, py)) * cDiag * cOther;
            res += add;
            snap(`Partner (${o.x},${py}): d = ${d}, col x=${nx} → (${nx},${py}) ×${cDiag}, (${nx},${o.y}) ×${cOther} → +<b>${add}</b>.`, 10);
          }
          answer = res;
          snap(`count(${o.x},${o.y}) = <b>${res}</b> square(s).`, 11);
        }
      }
      const finalV = answer === 1 ? "1 square" : answer + " squares";
      const last = steps[steps.length - 1];
      last.result = finalV;
      last.correct = true;
      last.memNote = "add: O(1). count: O(n) — every point scanned per query. Space: O(n).";
      return { steps: steps, result: finalV, correct: true, memNote: last.memNote };
    }
  ]
});
