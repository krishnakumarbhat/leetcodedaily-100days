/* empty hash slots for open-addressing visuals (mirrors section_01) */
function emptySlots(m) { return new Array(m).fill(null); }
function hmod(k, m) { return ((k % m) + m) % m; }
/* linear-probing lookup for NUMBERS; returns {hit:slot|null, probe} */
function probeFind(slots, m, key) {
  const probe = [];
  for (let j = 0; j < m; j++) {
    const s = hmod(key + j, m);
    probe.push(s);
    if (slots[s] && slots[s].k === key) return { hit: s, probe };
    if (!slots[s]) return { hit: null, probe };
  }
  return { hit: null, probe };
}
function probeInsert(slots, m, key, val) {
  for (let j = 0; j < m; j++) {
    const s = hmod(key + j, m);
    if (!slots[s]) { slots[s] = { k: key, v: val }; return s; }
  }
  return -1;
}
/* string hash for word sets: 31-based, wraps into [0, m) */
function hstr(s, m) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % m; return h; }
function probeFindStr(slots, m, key) {
  const probe = [];
  const start = hstr(key, m);
  for (let j = 0; j < m; j++) {
    const s = (start + j) % m;
    probe.push(s);
    if (slots[s] && slots[s].k === key) return { hit: s, probe };
    if (!slots[s]) return { hit: null, probe };
  }
  return { hit: null, probe };
}
function probeInsertStr(slots, m, key, val) {
  const start = hstr(key, m);
  for (let j = 0; j < m; j++) {
    const s = (start + j) % m;
    if (!slots[s]) { slots[s] = { k: key, v: val }; return s; }
  }
  return -1;
}

/* ------------------------------------------------------------------
 * JS trie + LCRS (left-child right-sibling) view conversion.
 * engine.js's 'tree' renderer draws left/right children only, so the
 * 26-way trie is laid out as a binary tree where left = FIRST child
 * and right = NEXT SIBLING. Every node carries its letter; a • marks
 * an end-of-word node.
 * ------------------------------------------------------------------ */
function trieRoot() { return { ch: {}, end: false, label: "∅", word: null, refs: 0 }; }
function trieInsert(t, word) {
  let n = t;
  for (const ch of word) {
    if (!n.ch[ch]) n.ch[ch] = { ch: {}, end: false, label: ch, word: null, refs: 0 };
    n = n.ch[ch];
  }
  n.end = true;      // a word terminates here
  n.word = word;     // terminal nodes remember their own word
}
/* same as trieInsert but ALSO counts refs (words reachable below) */
function trieInsertRefs(t, word) {
  let n = t;
  n.refs++;
  for (const ch of word) {
    if (!n.ch[ch]) n.ch[ch] = { ch: {}, end: false, label: ch, word: null, refs: 0 };
    n = n.ch[ch];
    n.refs++;
  }
  n.end = true;
  n.word = word;
}
/* converts the JS trie into engine.js's binary-tree view; fills
   `ids` (trie node → view id) so callers can highlight paths */
function toLCRS(t, ids) {
  let seq = 0;
  function build(n) {
    const id = ++seq;
    ids.set(n, id);
    const v = { id: id, val: n.label + (n.end ? "•" : ""), left: null, right: null };
    const keys = Object.keys(n.ch); // insertion order → stable layout
    if (keys.length) {
      v.left = build(n.ch[keys[0]]);
      let prev = v.left;
      for (let i = 1; i < keys.length; i++) {
        prev.right = build(n.ch[keys[i]]);
        prev = prev.right;
      }
    }
    return v;
  }
  return build(t);
}
/* view ids for a chain of trie nodes (the highlighted walk path) */
function pathIds(nodes, ids) {
  return nodes.map(x => ids.get(x)).filter(x => x !== undefined);
}
/* independent wildcard matcher: '.' → any letter (for `correct` checks) */
function wildcardRegex(q) {
  let rx = "^";
  for (const c of q) {
    rx += c === "." ? "." : c.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }
  return new RegExp(rx + "$");
}
/* independent brute force for Word Search II: is `w` spellable? */
function bruteWords(board, words) {
  const rows = board.length;
  const cols = rows ? Math.max.apply(null, board.map(r => r.length)) : 0;
  const res = [];
  for (const w of words) {
    if (!w || res.indexOf(w) !== -1) continue;
    let ok = false;
    function dfs(r, c, i) {
      if (ok) return;
      if (i === w.length) { ok = true; return; }
      if (r < 0 || r >= rows || c < 0 || c >= cols) return;
      if (board[r][c] !== w[i]) return;
      const save = board[r][c];
      board[r][c] = "#";
      dfs(r + 1, c, i + 1); dfs(r - 1, c, i + 1); dfs(r, c + 1, i + 1); dfs(r, c - 1, i + 1);
      board[r][c] = save;
    }
    for (let r = 0; r < rows && !ok; r++) for (let c = 0; c < cols && !ok; c++) dfs(r, c, 0);
    if (ok) res.push(w);
  }
  return res;
}

NC150.register({
  id: "0208", title: "Implement Trie (Prefix Tree)", difficulty: "Medium",
  url: "https://leetcode.com/problems/implement-trie-prefix-tree/",
  tags: ["trie", "design"],
  approaches: ["Approach 1 · 26-array trie (best)", "Approach 2 · Hash set + prefix scan"],
  complexities: [
    { time: "O(L) per op", space: "O(26·n·L)", note: "BEST — L = word length" },
    { time: "search O(1) · prefix O(n·L)", space: "O(n·L)", note: "no prefix data structure" }
  ],
  compare: [
    { name: "26-array trie", tech: "children[26] + isEnd", time: "O(L) per op", space: "O(26·n·L)", when: "fixed lowercase alphabet", best: true },
    { name: "Hash map children", tech: "only used letters", time: "O(L) per op", space: "O(n·L) avg", when: "sparse / Unicode alphabet", best: false },
    { name: "Hash set + scan", tech: "exact match, scan prefixes", time: "search O(1) · prefix O(n·L)", space: "O(n·L)", when: "no prefix queries needed", best: false }
  ],
  inputs: [
    { name: "inserts", label: "insert =", type: "list", default: '["apple","app","application","apply"]' },
    { name: "search", label: "search =", type: "str", default: "app" },
    { name: "prefix", label: "startsWith =", type: "str", default: "appl" }
  ],
  examples: [
    { label: "Ex 1", values: { inserts: '["apple","app"]', search: "app", prefix: "appl" }, result: '{"search":true,"startsWith":true}' },
    { label: "Ex 2", values: { inserts: '["apple"]', search: "app", prefix: "apx" }, result: '{"search":false,"startsWith":false}' },
    { label: "Prefix ≠ word", values: { inserts: '["bad","dad","mad"]', search: "pad", prefix: "ba" }, result: '{"search":false,"startsWith":true}' }
  ],
  realLife: "<p><b>Autocomplete on your keyboard</b>: every keystroke fires a startsWith query against a trie of dictionary words — the engine walks the prefix path in O(L) and surfaces the ~10 most popular descendants. That is why phone keyboards feel instant.</p><p><b>Spell checkers & search engines</b>: 'did you mean…' suggestions are trie prefix walks + edit-distance within the walked subtree; DNS servers and IP routers use the same shared-prefix idea (radix trees).</p>",
  dsDive: `<h3>Why a trie beats a hash set — the prefix query</h3>
<p>A <b>26-way tree</b>: each node has 26 child pointers (one per letter, <span class="code-var">idx = ord(c) − 97</span>) plus an <span class="code-cpp">isEnd</span> flag. Inserting "app" then "apple" re-uses the first 3 nodes — shared prefixes share memory <i>and</i> lookup work.</p>
<div class="equation">insert("app")  → a→p→p(•) &nbsp;|&nbsp; insert("apple") → a→p→p→l→e(•) &nbsp;:&nbsp; 2 words, 5 nodes</div>
<p><b>Hash set</b> (Python open addressing, linear probing h(k,i) = (hash(k)+i) mod m; C++ separate chaining) answers <b>exact</b> membership in O(1) — but a <i>prefix is not a key</i>. "Any word starting with <b>app</b>?" cannot be hashed; you would scan every stored word (O(n·L)). The trie turns it into ONE root→leaf walk.</p>
<p><b>Space trade-off</b>: each 26-pointer node costs ≈ 26×8 B = 208 B even when only 1–2 children exist. n words of avg length L → worst case n·L nodes ≈ <span class="code-var">26·8·n·L</span> bytes; prefix sharing shrinks this dramatically (English dictionaries: ~10× compression). For sparse or Unicode alphabets, hash-map children allocate only what is used.</p>`,
  code: [
    "class TrieNode:                     # one node = one letter of a prefix",
    "    children = [None]*26            # 'a'→0 … 'z'→25, 26-way branch",
    "    isEnd = False                   # a word terminates here",
    "def insert(word):",
    "    n = root",
    "    for c in word:",
    "        i = ord(c) - 97              # letter → child slot",
    "        if not n.children[i]:",
    "            n.children[i] = TrieNode()  # grow the path on demand",
    "        n = n.children[i]",
    "    n.isEnd = True                   # mark word completion",
    "def search(word):                    # EXACT match only",
    "    for c in word:",
    "        n = n.children[ord(c)-97]",
    "        if not n: return False       # path died → word absent",
    "    return n.isEnd                   # must END exactly here",
    "def startsWith(prefix):              # prefix: ANY descendant counts",
    "    for c in prefix:",
    "        n = n.children[ord(c)-97]",
    "        if not n: return False",
    "    return True                      # path exists → word continues"
  ],
  steps: [
    function (vals) {
      /* Approach 1 — 26-array trie, animated node by node */
      const inserts = (vals.inserts || []).map(x => String(x));
      const search = String(vals.search || "");
      const prefix = String(vals.prefix || "");
      const steps = [];
      const t = trieRoot();
      const inserted = [];
      const snap = (text, code, pathNodes) => {
        const ids = new Map();
        steps.push({ text: text, code: code, mem: [
          { type: "tree", title: "trie · left = first child, right = next sibling (• = word end)", root: toLCRS(t, ids), hl: pathIds(pathNodes || [], ids) },
          { type: "array", title: "inserted words", data: inserted.slice(), showIdx: true, size: 8 }
        ] });
      };
      snap("Empty trie — just the ∅ root. Every operation is one O(L) walk down shared prefixes.", 0, []);
      for (let w = 0; w < inserts.length; w++) {
        const word = inserts[w];
        const path = [t];
        snap(`insert('<b>${word}</b>'): walk letters, create missing nodes, mark the last one with •.`, 5, path);
        for (let i = 0; i < word.length; i++) {
          const ch = word[i];
          const parent = path[path.length - 1];
          if (!parent.ch[ch]) {
            parent.ch[ch] = { ch: {}, end: false, label: ch, word: null, refs: 0 };
            path.push(parent.ch[ch]);
            snap(`'<b>${ch}</b>' under '<b>${path.slice(0, -1).map(n => n.label).join("") || "∅"}</b>': no child yet → <b>allocate</b> node '<b>${ch}</b>' (26 empty slots reserved).`, 8, path);
          } else {
            path.push(parent.ch[ch]);
            snap(`'<b>${ch}</b>': child <b>exists</b> → shared prefix, reuse it (the trie's memory win).`, 7, path);
          }
        }
        path[path.length - 1].end = true;
        inserted.push(word);
        snap(`insert('<b>${word}</b>') done: mark the final node with <b>•</b>.`, 10, path);
      }
      /* ---- search: exact match ---- */
      const sPath = [t];
      let sOk = true;
      for (let i = 0; i < search.length; i++) {
        const ch = search[i];
        const parent = sPath[sPath.length - 1];
        if (!parent.ch[ch]) {
          sOk = false;
          snap(`search('<b>${search}</b>'): no child '<b>${ch}</b>' after '<b>${search.slice(0, i)}</b>' → path dies → <b>false</b>.`, 14, sPath);
          break;
        }
        sPath.push(parent.ch[ch]);
        snap(`search('<b>${search}</b>') · '<b>${ch}</b>' found → descend (shared with every other word having this prefix).`, 12, sPath);
      }
      if (sOk) {
        const endNode = sPath[sPath.length - 1];
        sOk = !!endNode.end;
        snap(`search('<b>${search}</b>'): path complete. ${endNode.end ? "Final node carries <b>•</b> → inserted verbatim → <b>true</b>." : "Final node has <b>no •</b> → only a prefix exists → <b>false</b>."}`, 15, sPath);
      }
      /* ---- startsWith: prefix walk, no isEnd check ---- */
      const pPath = [t];
      let pOk = true;
      for (let i = 0; i < prefix.length; i++) {
        const ch = prefix[i];
        const parent = pPath[pPath.length - 1];
        if (!parent.ch[ch]) {
          pOk = false;
          snap(`startsWith('<b>${prefix}</b>'): no child '<b>${ch}</b>' after '<b>${prefix.slice(0, i)}</b>' → no word can begin this way → <b>false</b>.`, 18, pPath);
          break;
        }
        pPath.push(parent.ch[ch]);
        snap(`startsWith('<b>${prefix}</b>') · '<b>${ch}</b>' found → descend.`, 17, pPath);
      }
      if (pOk) {
        snap(`startsWith('<b>${prefix}</b>'): full path exists → SOME word continues from here → <b>true</b> (no • needed).`, 19, pPath);
      }
      const last = steps[steps.length - 1];
      last.result = JSON.stringify({ search: sOk, startsWith: pOk });
      last.correct = sOk === (inserted.indexOf(search) !== -1) &&
                     pOk === (prefix === "" || inserted.some(w => w.slice(0, prefix.length) === prefix));
      last.memNote = "Time: O(L) per op (one walk). Space: O(26·n·L) worst case, shrunk by shared prefixes.";
      return { steps: steps, result: last.result, correct: last.correct, memNote: last.memNote };
    },
    function (vals) {
      /* Approach 2 — hash set + linear prefix scan (contrast) */
      const inserts = (vals.inserts || []).map(x => String(x));
      const search = String(vals.search || "");
      const prefix = String(vals.prefix || "");
      const m = 8;
      const slots = emptySlots(m);
      const inserted = [];
      const steps = [];
      const snap = (text, code, probe, hit, cls) => steps.push({ text: text, code: code, mem: [
        { type: "hashmap", title: "set · open addressing (linear probing)", mode: "open", slots: slots.map(x => x ? { k: x.k, v: x.v } : null), probe: probe || [], hit: hit === undefined ? -1 : hit, formula: "h(k, i) = (hash(k) + i) mod 8" },
        { type: "array", title: "words", data: inserted.slice(), cls: cls || {}, showIdx: true, size: 8 }
      ] });
      snap("Store every word in a hash set. Exact matches become O(1) probes — but watch what happens to prefix queries.", 0, [], -1, {});
      for (let w = 0; w < inserts.length; w++) {
        const word = inserts[w];
        if (inserted.indexOf(word) === -1) {
          const r = probeFindStr(slots, m, word);
          const placed = probeInsertStr(slots, m, word, "✓");
          inserted.push(word);
          snap(`insert('<b>${word}</b>'): h('${word}') = ${hstr(word, m)} → probe ${r.probe.join("→")} → placed at slot ${placed}.`, 1, r.probe, placed, { [inserted.length - 1]: "hot" });
        } else {
          snap(`insert('<b>${word}</b>'): already present — sets deduplicate.`, 1, [], -1, {});
        }
      }
      /* search = one probe sequence */
      const r = probeFindStr(slots, m, search);
      const sOk = r.hit !== null;
      snap(`search('<b>${search}</b>'): h = ${hstr(search, m)}, probe ${r.probe.join("→")} ${sOk ? `hits slot ${r.hit} → <b>true</b>` : "hits empty slot → absent → <b>false</b>"}.`, 3, r.probe, r.hit, {});
      /* startsWith = O(n·L) linear scan, the trie's big win */
      let pIdx = -1;
      for (let i = 0; i < inserted.length; i++) {
        if (inserted[i].slice(0, prefix.length) === prefix) { pIdx = i; break; }
      }
      const cls = {};
      if (pIdx !== -1) cls[pIdx] = "done";
      snap(pIdx !== -1
        ? `startsWith('<b>${prefix}</b>'): a hash set cannot probe "any word starting with…" — scan ALL ${inserted.length} word(s) → '<b>${inserted[pIdx]}</b>' matches → <b>true</b>.`
        : `startsWith('<b>${prefix}</b>'): no hash for prefixes → scan ALL ${inserted.length} word(s) → none matches → <b>false</b>.`, 4, [], -1, cls);
      const last = steps[steps.length - 1];
      last.result = JSON.stringify({ search: sOk, startsWith: pIdx !== -1 });
      last.correct = sOk === (inserted.indexOf(search) !== -1) &&
                     (pIdx !== -1) === (prefix === "" || inserted.some(w => w.slice(0, prefix.length) === prefix));
      last.memNote = "search: O(1) avg. startsWith: O(n·L) scan — the trie's O(L) prefix walk is the entire point.";
      return { steps: steps, result: last.result, correct: last.correct, memNote: last.memNote };
    }
  ]
});

      let died = false;

            for (const k of Object.keys(n.ch)) nxt.push(n.ch[k]);
          }

            snap(`Level ${i} '<b>.</b>': no candidates have children → frontier dies → <b>false</b>.`, 4, frontier, i, false);

            break;
          }
          snap(`Level ${i} '<b>.</b>': wildcard fans out — ${frontier.length} node(s) → ${nxt.length} candidate(s): [${nxt.map(n => n.label).join(" ")}].`, 3, nxt, i, false);

            if (n.ch[ch]) nxt.push(n.ch[ch]);
          }
          if (!nxt.length) {
            snap(`Level ${i} '<b>${ch}</b>': no candidate has a '<b>${ch}</b>' child → frontier empty → <b>false</b>.`, 4, frontier, i, false);
            died = true;
            break;
          }
          snap(`Level ${i} '<b>${ch}</b>': filter frontier → ${nxt.length} candidate(s): [${nxt.map(n => n.label).join(" ")}].`, 3, nxt, i, false);
        }
        frontier = nxt;
      }
      if (!died) {
        const ends = frontier.filter(n => n.end);
        result = ends.length > 0;
        snap(ends.length
          ? `Pattern complete. ${ends.length} surviving node(s) carry <b>•</b> → matched word exists → <b>true</b>.`

      last.correct = result === adds.some(w => wildcardRegex(query).test(w));
      last.memNote = "Time: O(26^d) worst case. Space: O(26^d) frontier — no call stack, all candidates in lockstep.";

    }
  ]
});
