/* shared reference checkers (independent of the animated algorithms) */
function refValidParens(s) {
  const st = [];
  const m = { ")": "(", "}": "{", "]": "[" };
  for (const c of s) {
    if (m[c]) { if (!st.length || st[st.length - 1] !== m[c]) return false; st.pop(); }
    else st.push(c);
  }
  return st.length === 0;
}
function refParensValid(str) {
  let bal = 0;
  for (const c of str) { bal += c === "(" ? 1 : -1; if (bal < 0) return false; }
  return bal === 0;
}
function refHistogram(heights) {
  let best = 0;
  for (let i = 0; i < heights.length; i++) {
    let minH = heights[i];
    for (let j = i; j < heights.length; j++) {
      minH = Math.min(minH, heights[j]);
      best = Math.max(best, minH * (j - i + 1));
    }
  }
  return best;
}
function refWarmer(temps) {
  const out = new Array(temps.length).fill(0);
  for (let i = 0; i < temps.length; i++)
    for (let j = i + 1; j < temps.length; j++)
      if (temps[j] > temps[i]) { out[i] = j - i; break; }
  return out;
}
/* histogram as a grid of █ rows — the "bars" view used by 0084 */
function histGrid(heights, cls) {
  const maxH = Math.max(0, ...heights);
  const rows = [];
  for (let r = maxH; r >= 1; r--) rows.push(heights.map(h => (h >= r ? "█" : "·")));
  return { type: "grid", title: "histogram · █ = bar, · = empty", data: rows, cls: cls || {}, cols: heights.length };
}
function histColCls(heights, col, clsName) {
  const maxH = Math.max(0, ...heights);
  const cls = {};
  for (let r = 0; r < maxH; r++) cls[r + "," + col] = clsName;
  return cls;
}
/* 0853: one-row track grid, 0 (start) on the left, target on the right */
function trackGrid(target, positions, cls) {
  const cols = Math.min(target, 60) + 1;
  const row = new Array(cols).fill("·");
  positions.forEach((p, i) => {
    const c = Math.round(p / target * (cols - 1));
    row[c] = i < 10 ? String(i) : "*";
  });
  return { type: "grid", title: "track · 0 (start) → target (right)", data: [row], cls: cls || {}, cols: cols };
}

/* ================================================================
 * PROBLEM 0020 — VALID PARENTHESES
 * ================================================================ */
NC150.register({
  id: "0020", title: "Valid Parentheses", difficulty: "Easy",
  url: "https://leetcode.com/problems/valid-parentheses/",
  tags: ["stack", "string"],
  approaches: ["Approach 1 · Stack + match map (best)", "Approach 2 · Repeated pair erasure"],
  complexities: [
    { time: "O(n)", space: "O(n)", note: "BEST — single pass, LIFO" },
    { time: "O(n²)", space: "O(n)", note: "erase pairs until stable" }
  ],
  compare: [
    { name: "Brute force", tech: "count-only scan", time: "O(n)", space: "O(1)", when: "never — cannot check types", best: false },
    { name: "Stack + match map", tech: "LIFO push/pop", time: "O(n)", space: "O(n)", when: "general case", best: true },
    { name: "Repeated erasure", tech: "replace () {} []", time: "O(n²)", space: "O(n)", when: "tiny strings only", best: false }
  ],
  inputs: [
    { name: "s", label: "s =", type: "str", default: "()[]{}" }
  ],
  examples: [
    { label: "Ex 1", values: { s: "()[]{}" }, result: "true" },
    { label: "Interleaved", values: { s: "([)]" }, result: "false" },
    { label: "Nested", values: { s: "{[]}" }, result: "true" },
    { label: "Unclosed", values: { s: "(((" }, result: "false" }
  ],
  realLife: "<p><b>Compilers & interpreters</b> validate the bracket nesting of source code with exactly this stack — the most recent scope always closes first (LIFO), so the parser never needs to look back further than the stack top.</p><p><b>JSON/HTML parsers</b>: every delimiter (quotes, tags, braces) is pushed and popped the same way; a mismatch at depth d is caught the moment it happens.</p>",
  dsDive: `<h3>Why LIFO is exactly the rule of brackets</h3>
<p>\"The most recently opened bracket must close first\" <b>is</b> the definition of a stack. Python implements a stack as a plain <span class="code-var">list</span> (append/pop at the end, O(1)); C++ uses <span class="code-cpp">std::stack</span>, an adapter over <span class="code-cpp">std::deque</span> that also grows in O(1) amortized blocks.</p>
<p>The closer→opener map is a hash table: Python <span class="code-var">dict</span> = open addressing with linear probing, <span class="code-var">h(k, i) = (hash(k) + i) mod m</span>; C++ <span class="code-cpp">unordered_map</span> = separate chaining. With 3 keys both are overkill — but the map keeps the matching rule declarative and would scale to more bracket types.</p>`,
  code: [
    "def isValid(s):",
    "    match = {')': '(', '}': '{', ']': '['}   # closer -> opener",
    "    st = []                                   # LIFO of openers",
    "    for c in s:                               # one pass, O(n)",
    "        if c in match:                        # closer?",
    "            if not st or st[-1] != match[c]:  # top must be partner",
    "                return False                  # fail fast",
    "            st.pop()                          # pair matched",
    "        else:",
    "            st.append(c)                      # opener -> push",
    "    return not st                             # all matched?"
  ],
  steps: [
    function (vals) {
      const s = String(vals.s);
      const steps = [];
      const match = { ")": "(", "}": "{", "]": "[" };
      const st = [];
      const snap = (text, code, i, clsStr) => {
        const cls = {};
        if (i >= 0 && i < s.length) cls[i] = "hot";
        if (clsStr) Object.assign(cls, clsStr);
        steps.push({ text, code, mem: [
          { type: "string", title: "s (input)", data: s.split(""), cls, size: 1 },
          { type: "stack", title: "openers · LIFO", data: st.slice(), top: st.length - 1 }
        ]});
      };
      snap("Start: empty stack. Scan <b>s</b> left→right — each char is pushed or popped at most once (O(n)).", 1, -1, {});
      let valid = true;
      for (let i = 0; i < s.length; i++) {
        const c = s[i];
        if (match[c]) {
          if (!st.length || st[st.length - 1] !== match[c]) {
            valid = false;
            const why = !st.length ? "stack is EMPTY — nothing to close" : `top '<b>${st[st.length-1]}</b>' ≠ expected '<b>${match[c]}</b>'`;
            snap(`'<b>${c}</b>' is a closer but ${why} → invalid → <b>false</b>.`, 4, i, { [i]: "done" });
            break;
          }
          st.pop();
          snap(`'<b>${c}</b>' matches stack top '<b>${match[c]}</b>' → pop. Stack shrinks.`, 6, i, {});
        } else {
          st.push(c);
          snap(`'<b>${c}</b>' is an opener → push onto the stack (it must close before anything below it).`, 9, i, {});
        }
      }
      if (valid && s.length) {
        snap("End of string. Stack is <b>empty</b> → every opener was matched → <b>true</b>.", 10, -1, {});
      } else if (valid) {
        snap("Empty string → trivially balanced → <b>true</b>.", 10, -1, {});
      }
      const last = steps[steps.length - 1];
      last.result = valid ? "true" : "false";
      last.correct = valid === refValidParens(s);
      last.memNote = "Space: stack holds ≤ n openers → O(n). Time: O(n).";
      return { steps, result: last.result, correct: last.correct, memNote: last.memNote };
    },
    function (vals) {
      const s = String(vals.s);
      const steps = [];
      let work = s;
      const snap = (text, code, cls) => {
        steps.push({ text, code, mem: [
          { type: "string", title: "working copy (erasing pairs)", data: work.split(""), cls: cls || {}, size: 1 }
        ]});
      };
      snap("Strategy: erase every '()', '{}', '[]' substring until nothing shrinks; valid ⇔ empty.", 1, {});
      let guard = 0;
      while (true) {
        const before = work;
        work = work.replace("()", "").replace("{}", "").replace("[]", "");
        if (work === before) break;
        snap(`Erased one innermost pair → string now "<b>${work}</b>".`, 4, {});
        if (++guard > 1000) { snap("Too many erasures — stopping (input too long for this demo).", 5, {}); break; }
      }
      const valid = work === "";
      snap(valid ? "No pairs left → fully balanced → <b>true</b>." : `Stable but non-empty ("<b>${work}</b>") → mismatched or interleaved → <b>false</b>.`, 7, {});
      const last = steps[steps.length - 1];
      last.result = valid ? "true" : "false";
      last.correct = valid === refValidParens(s);
      last.memNote = "Time: O(n²) worst case. Space: O(n) working copy.";
      return { steps, result: last.result, correct: last.correct, memNote: last.memNote };
    }
  ]
});

/* ================================================================
 * PROBLEM 0022 — GENERATE PARENTHESES
 * ================================================================ */
NC150.register({
  id: "0022", title: "Generate Parentheses", difficulty: "Medium",
  url: "https://leetcode.com/problems/generate-parentheses/",
  tags: ["stack", "backtracking"],
  approaches: ["Approach 1 · Backtracking DFS (best)", "Approach 2 · Iterative BFS queue"],
  complexities: [
    { time: "O(4ⁿ/√n)", space: "O(n)", note: "BEST — Catalan leaves, O(n) depth" },
    { time: "O(4ⁿ/√n)", space: "O(4ⁿ/√n)", note: "queue holds a full level" }
  ],
  compare: [
    { name: "Backtracking DFS", tech: "recursive call stack", time: "O(4ⁿ/√n)", space: "O(n)", when: "memory matters — standard", best: true },
    { name: "Iterative BFS", tech: "explicit deque frontier", time: "O(4ⁿ/√n)", space: "O(4ⁿ/√n)", when: "no recursion allowed", best: false }
  ],
  inputs: [
    { name: "n", label: "n =", type: "int", default: "3" }
  ],
  examples: [
    { label: "Ex 1", values: { n: "3" }, result: "5 strings" },
    { label: "n = 1", values: { n: "1" }, result: "[\"()\"]" },
    { label: "n = 2", values: { n: "2" }, result: "2 strings" },
    { label: "n = 4", values: { n: "4" }, result: "14 strings" }
  ],
  realLife: "<p><b>Parser generators</b> (yacc, ANTLR) enumerate all valid derivations of a grammar — exactly this branch-and-bound over legal moves.</p><p><b>Test-case generators</b> for compilers and formatters need every balanced-bracket shape for a given size — this DFS enumerates them all, each valid by construction.</p>",
  dsDive: `<h3>The hidden stack: call stack vs explicit queue</h3>
<p>The only rule that keeps every branch valid: <b>never let ')' exceed '('</b> (guard <span class="code-var">close &lt; open</span>). Approach 1's stack is the <b>call stack</b> — LIFO of partial strings, O(n) memory. Approach 2 replaces it with an explicit FIFO <span class="code-var">deque</span> (breadth-first), which must hold a whole level of the Catalan tree — far more memory.</p>
<div class="equation">#strings(n) = Catalan(n) = C(2n, n) / (n+1) ≈ 4ⁿ / (n^1.5 · √π)</div>
<p>C++ <span class="code-cpp">std::stack</span> (over deque) vs Python <span class="code-var">list</span> (append/pop) — same O(1) push/pop, different container under the hood.</p>`,
  code: [
    "def generateParenthesis(n):",
    "    result = []",
    "    def dfs(cur, open_c, close_c):",
    "        if len(cur) == 2*n: result.append(cur); return",
    "        if open_c < n:  dfs(cur + '(', open_c+1, close_c)",
    "        if close_c < open_c: dfs(cur + ')', open_c, close_c+1)",
    "    dfs('', 0, 0)",
    "    return result"
  ],
  steps: [
    function (vals) {
      const n = Math.max(0, Math.min(5, Number(vals.n) || 0));
      const steps = [];
      const result = [];
      const callStack = [];   // partial strings, most recent on top
      const snap = (text, code, cur, openC, closeC) => {
        const curIdx = callStack.length - 1;
        const cls = {};
        for (let i = 0; i < cur.length; i++) cls[i] = i < openC + closeC ? "done" : "hot";
        steps.push({ text, code, mem: [
          { type: "stack", title: "call stack (LIFO of partials)", data: callStack.slice(), top: curIdx },
          { type: "string", title: "building: " + (cur || "∅") + " · open=" + openC + " close=" + closeC, data: cur.split(""), cls, size: 1 },
          { type: "string", title: "completed strings", data: result, size: 8 }
        ]});
      };
      snap("DFS from empty string. Rule: '(' while open&lt;n, ')' while close&lt;open. Depth ≤ 2n.", 1, "", 0, 0);
      function dfs(cur, openC, closeC) {
        callStack.push(cur);
        if (cur.length === 2 * n) {
          result.push(cur);
          snap(`<b>"${cur}"</b> has length 2n → VALID leaf, saved. Backtrack.`, 4, cur, openC, closeC);
        } else {
          if (openC < n) {
            snap(`Move 1: open='(' available (${openC} &lt; ${n}) → recurse "<b>${cur}(</b>".`, 5, cur, openC, closeC);
            dfs(cur + "(", openC + 1, closeC);
          }
          if (closeC < openC) {
            snap(`Move 2: close=')' legal (${closeC} &lt; ${openC}) → recurse "<b>${cur})</b>".`, 6, cur, openC, closeC);
            dfs(cur + ")", openC, closeC + 1);
          }
          if (openC === n && closeC === openC && cur.length < 2 * n) {
            snap(`No moves left from "<b>${cur}</b>" → return.`, 7, cur, openC, closeC);
          }
        }
        callStack.pop();
      }
      if (n === 0) {
        result.push("");
        snap("n = 0 → exactly one empty string.", 3, "", 0, 0);
      } else {
        dfs("", 0, 0);
      }
      const last = steps[steps.length - 1];
      const allValid = result.every(refParensValid);
      last.result = n + " pair(s) → " + result.length + " strings";
      last.correct = allValid && result.length === (() => { let c = 1; for (let k = 2; k <= n; k++) c = c * (4 * k - 2) / (k + 1); return Math.round(c); })();
      last.memNote = "Space: O(n) recursion depth + answers. Time: O(4ⁿ/√n).";
      return { steps, result: last.result, correct: last.correct, memNote: last.memNote };
    },
    function (vals) {
      const n = Math.max(0, Math.min(5, Number(vals.n) || 0));
      const steps = [];
      const result = [];
      const queue = [];     // frontier: [str, open, close]
      const snap = (text, code, front, rear) => {
        steps.push({ text, code, mem: [
          { type: "queue", title: "BFS frontier · FIFO", data: queue.map(e => e[0] || "∅"), front, rear },
          { type: "string", title: "completed strings", data: result, size: 8 }
        ]});
      };
      snap("BFS: expand every partial string one level at a time. Same two rules, no recursion.", 1, 0, 0);
      queue.push(["", 0, 0]);
      snap(`Seed the queue with the empty string.`, 3, 0, 0);
      while (queue.length) {
        const cur = queue.shift();
        const s0 = cur[0], o = cur[1], c = cur[2];
        if (s0.length === 2 * n) {
          result.push(s0);
          snap(`Dequeued "<b>${s0}</b>" — length 2n → final answer.`, 5, 0, queue.length - 1);
          continue;
        }
        if (o < n) queue.push([s0 + "(", o + 1, c]);
        if (c < o) queue.push([s0 + ")", o, c + 1]);
        snap(`Dequeued "<b>${s0}</b>" (open=${o}, close=${c}) → enqueue "${s0}(" and/or "${s0})" per the rules. Queue now holds ${queue.length} partials.`, 6, 0, queue.length - 1);
      }
      const last = steps[steps.length - 1];
      last.result = n + " pair(s) → " + result.length + " strings";
      last.correct = result.every(refParensValid) && result.length === (() => { let cc = 1; for (let k = 2; k <= n; k++) cc = cc * (4 * k - 2) / (k + 1); return Math.round(cc); })();
      last.memNote = "Space: O(4ⁿ/√n) — the frontier. Time: O(4ⁿ/√n).";
      return { steps, result: last.result, correct: last.correct, memNote: last.memNote };
    }
  ]
});

NC150.register({

  url: "https://leetcode.com/problems/largest-rectangle-in-histogram/",
  tags: ["stack", "monotonic"],
  approaches: ["Approach 1 · Monotonic stack (best)", "Approach 2 · Brute force pairs"],
  complexities: [
    { time: "O(n)", space: "O(n)", note: "BEST — each bar pushed/popped once" },
    { time: "O(n²)", space: "O(1)", note: "all (i, j) pairs" }
  ],
  compare: [
    { name: "Brute force", tech: "every pair, min height", time: "O(n²)", space: "O(1)", when: "tiny n only", best: false },
    { name: "Monotonic stack", tech: "nearest shorter bounds", time: "O(n)", space: "O(n)", when: "general case", best: true }
  ],
  inputs: [
    { name: "heights", label: "heights =", type: "list", default: "[2,1,5,6,2,3]" }
  ],
  examples: [
    { label: "Ex 1", values: { heights: "[2,1,5,6,2,3]" }, result: "10" },
    { label: "Ex 2", values: { heights: "[2,4]" }, result: "4" },
    { label: "Valley", values: { heights: "[2,1,2]" }, result: "3" },
    { label: "Plateau", values: { heights: "[2,2,2]" }, result: "6" }
  ],
  realLife: "<p><b>Skyline & floor planning</b>: the largest rectangle that fits inside a city-block silhouette (or a warehouse racking layout) is this exact query.</p><p><b>Graphics & charting</b>: computing the widest highlight range of a chart, or union-of-areas in image pipelines, uses the same linear sweep over bar heights.</p>",
  dsDive: `<h3>The monotonic stack invariant — the heart of this section</h3>
<p>Invariant: <b>stack indices hold strictly increasing heights</b> (bottom→top). While a new bar is taller, we push — the right bound is unknown. The moment a shorter bar arrives, <b>every taller bar on the stack gets its right bound resolved at once</b>: the new bar is its first-shorter neighbour on the right, the new stack top its first-shorter on the left:</p>
<div class="equation">area = h[popped] × ( i − new_top − 1 ) &nbsp; sentinel 0 forces all pops</div>
<p>Each index is pushed once and popped once → amortized O(1) per bar → the whole sweep is <b>O(n)</b>. This is the same invariant family as 0739 (decreasing temperatures) and 0853 (increasing times) — learn it once here, reuse it everywhere.</p>`,
  code: [
    "def largestRectangleArea(heights):",
    "    st, best = [], 0                 # st: indices, heights strictly ↑",
    "    for i, h in enumerate(heights + [0]):   # sentinel 0 flushes all",
    "        while st and heights[st[-1]] > h:   # h is shorter → resolve",
    "            height = heights[st.pop()]",
    "            width = i if not st else i - st[-1] - 1",
    "            best = max(best, height * width)",
    "        st.append(i)                 # restore invariant, push i",
    "    return best"
  ],
  steps: [
    function (vals) {
      const heights = (vals.heights || []).map(Number);
      const steps = [];
      const st = [];       // indices, heights strictly increasing
      let best = 0;
      const snap = (text, code, curI, extraCls) => {
        const cls = {};
        if (curI >= 0 && curI < heights.length) Object.assign(cls, histColCls(heights, curI, "hot"));

            snap(`Day ${i} (<b>${temps[i]}</b>) → first warmer at day ${j} (<b>${temps[j]}</b>) → wait <b>${j - i}</b>.`, 3, i, j, { [i]: "hl", [j]: "hot" });
            break;
          }
          snap(`Day ${j} (<b>${temps[j]}</b>) not warmer — keep scanning.`, 3, i, j, { [j]: "hot" });
        }
        if (ans[i] === 0 && i < temps.length - 1) {
          snap(`Day ${i} (<b>${temps[i]}</b>) never beaten → answer stays 0.`, 4, i, -1, { [i]: "done" });
        }
      }
      const last = steps[steps.length - 1];
      last.result = "[" + ans.join(",") + "]";
      last.correct = ans.join(",") === refWarmer(temps).join(",");
      last.memNote = "Time: O(n²). Space: O(1) extra.";
      return { steps, result: last.result, correct: last.correct, memNote: last.memNote };
    }
  ]
});
