function rowsToMatrix(rows) {
  return rows.map(r => (Array.isArray(r) ? r : String(r).split(",")).map(x => Number(x)));
}
function ceilDiv(a, b) { return Math.floor((a + b - 1) / b); }

/* ================================================================
 * PROBLEM 0004 — MEDIAN OF TWO SORTED ARRAYS
 * ================================================================ */
NC150.register({
  id: "0004", title: "Median of Two Sorted Arrays", difficulty: "Hard",
  url: "https://leetcode.com/problems/median-of-two-sorted-arrays/",
  tags: ["binary search", "partition"],
  approaches: ["Approach 1 · Merge + pick middle", "Approach 2 · Binary-search the partition (best)"],
  complexities: [
    { time: "O(m + n)", space: "O(m + n)", note: "simple baseline, fails the O(log) bar" },
    { time: "O(log min(m,n))", space: "O(1)", note: "BEST — required by the problem" }
  ],
  compare: [
    { name: "Merge + middle", tech: "two-pointer merge", time: "O(m+n)", space: "O(m+n)", when: "small inputs, used as referee", best: false },
    { name: "Partition binary search", tech: "cut on the smaller array", time: "O(log min(m,n))", space: "O(1)", when: "large arrays — the requirement", best: true }
  ],
  inputs: [
    { name: "nums1", label: "nums1 =", type: "list", default: "[1,3]" },
    { name: "nums2", label: "nums2 =", type: "list", default: "[2]" }
  ],
  examples: [
    { label: "Ex 1", values: { nums1: "[1,3]", nums2: "[2]" }, result: "2.0" },
    { label: "Ex 2", values: { nums1: "[1,2]", nums2: "[3,4]" }, result: "2.5" },
    { label: "Ex 3", values: { nums1: "[1,3,5,7]", nums2: "[2,4,6,8,10]" }, result: "5.0" }
  ],
  realLife: "<p><b>Analytics pipelines</b> compute percentiles/medians over two merged datasets (e.g. latency of two server pools) — the partition trick answers 'what is the P50 of everything?' without materializing the combined log.</p><p><b>Databases</b> answer median queries over partitioned tables with the same cut-balancing idea; quantile sketches (t-digest, HDR) build on it.</p>",
  dsDive: `<h3>The partition invariant: i + j = (m+n+1)/2</h3>
<p>The median cuts the combined data into a left half and a right half with equal counts. If the cut places <b>i</b> elements of A and <b>j</b> elements of B on the left, then:</p>
<div class="equation">i + j = (m + n + 1) / 2 &nbsp;&nbsp;⇒&nbsp;&nbsp; j = (m+n+1)/2 − i</div>
<p>The <b>+1</b> is the ceiling ⌈(m+n)/2⌉ in integer arithmetic: for ODD totals it pushes the extra middle element onto the left, so the median is simply <span class="code-var">max(A[i−1], B[j−1])</span>; for even totals you average that max with <span class="code-var">min(A[i], B[j])</span>. The cut is VALID when every left element ≤ every right element:</p>
<div class="equation">A[i−1] ≤ B[j] &nbsp;AND&nbsp; B[j−1] ≤ A[i]</div>
<p>If <span class="code-var">A[i−1] &gt; B[j]</span> the cut is too far right in A → search left; else too far left → search right. Edge cuts (i = 0 or i = len(A)) use ∓∞ sentinels so the inequalities stay well-defined. Binary-searching on the SMALLER array keeps the probe count log(min(m,n)) — that is the entire performance trick.</p>`,
  code: [
    [
      "i = j = 0; merged = []",
      "while i < m and j < n:                 # two-pointer merge",
      "    take the smaller head into merged  # O(m+n) walk",
      "merged += nums1[i:] + nums2[j:]        # drain leftovers",
      "n = len(merged)",
      "return merged[n//2] if n % 2",
      "       else (merged[n//2-1] + merged[n//2]) / 2"
    ],
    [
      "A, B = (nums1, nums2) if len(nums1) <= len(nums2) else (nums2, nums1)",
      "left_count = (len(A) + len(B) + 1) // 2     # the +1 invariant",
      "lo, hi = 0, len(A)",
      "while lo <= hi:",
      "    i = lo + (hi - lo) // 2                  # probe cut in A",
      "    j = left_count - i                       # forced by invariant",
      "    if A[i-1] <= B[j] and B[j-1] <= A[i]:    # balanced?",
      "        return max(A[i-1], B[j-1])           # odd → max of left",
      "    if A[i-1] > B[j]:  hi = i - 1            # cut too far right",
      "    else:               lo = i + 1"
    ]
  ],
  steps: [
    function (vals) {
      const a = U.parseList(vals.nums1), b = U.parseList(vals.nums2);
      const steps = [];
      const merged = [];
      const snap = (text, code, i, j, clsM) => steps.push({ text, code, mem: [
        { type: "array", title: "nums1", data: a, cls: i >= 0 && i < a.length ? { [i]: "hot" } : {}, showIdx: true, size: 4 },
        { type: "array", title: "nums2", data: b, cls: j >= 0 && j < b.length ? { [j]: "hot" } : {}, showIdx: true, size: 4 },
        { type: "array", title: "merged (sorted, built up)", data: merged, cls: clsM || {}, showIdx: true, size: 4 }
      ]});
      snap("Merge with two pointers: always append the smaller head — the merge step of merge sort.", 0, 0, 0, {});
      let i = 0, j = 0;
      while (i < a.length && j < b.length) {
        if (a[i] <= b[j]) {
          merged.push(a[i]);
          snap(`nums1[${i}]=<b>${a[i]}</b> ≤ nums2[${j}]=${b[j]} → take <b>${a[i]}</b> into merged.`, 2, i, j, { [merged.length - 1]: "hot" });
          i++;
        } else {
          merged.push(b[j]);
          snap(`nums2[${j}]=<b>${b[j]}</b> < nums1[${i}]=${a[i]} → take <b>${b[j]}</b> into merged.`, 2, i, j, { [merged.length - 1]: "hot" });
          j++;
        }
      }
      while (i < a.length) { merged.push(a[i]); snap(`Drain nums1: append <b>${a[i]}</b>.`, 3, i, j, { [merged.length - 1]: "hot" }); i++; }
      while (j < b.length) { merged.push(b[j]); snap(`Drain nums2: append <b>${b[j]}</b>.`, 3, i, j, { [merged.length - 1]: "hot" }); j++; }
      const n = merged.length;
      let med;
      if (n % 2 === 1) { med = merged[Math.floor(n / 2)]; }
      else { med = (merged[n / 2 - 1] + merged[n / 2]) / 2; }
      const mIdx = n % 2 === 1 ? [Math.floor(n / 2)] : [n / 2 - 1, n / 2];
      const clsM = {}; mIdx.forEach(k => clsM[k] = "done");
      snap(`Merged length ${n}: ${n % 2 ? "odd → middle element" : "even → average of the two middles"}: <b>${med}</b>.`, 5, -1, -1, clsM);
      const last = steps[steps.length - 1];
      const expect = (() => { const all = a.concat(b).sort((x, y) => x - y); const k = Math.floor(all.length / 2); return all.length % 2 ? all[k] : (all[k - 1] + all[k]) / 2; })();
      last.result = String(med);
      last.correct = med === expect;
      last.memNote = "Time: O(m+n) merge. Space: O(m+n) merged copy.";
      return { steps, result: String(med), correct: med === expect, memNote: last.memNote };
    },
    function (vals) {
      const a = U.parseList(vals.nums1), b = U.parseList(vals.nums2);
      const A = a.length <= b.length ? a : b, B = a.length <= b.length ? b : a;
      const total = A.length + B.length;
      const leftCount = Math.floor((total + 1) / 2);
      const steps = [];
      const snap = (text, code, i, j, clsA, clsB, sent) => steps.push({ text, code, mem: [
        { type: "array", title: "A (smaller) · cut after i elements", data: A, cls: clsA || {}, showIdx: true, size: 4 },
        { type: "array", title: "B (larger)  · cut after j elements", data: B, cls: clsB || {}, showIdx: true, size: 4 }
      ].concat(sent || [])});
      snap("A = smaller array. Probe the cut i in A; j = (m+n+1)/2 − i is FORCED by the half-count invariant.", 0, 0, 0, {}, {}, []);
      let lo = 0, hi = A.length, ans = null;
      while (lo <= hi) {
        const i = Math.floor(lo + (hi - lo) / 2);
        const j = leftCount - i;
        const aLeft = i >= 1 ? A[i - 1] : -Infinity, aRight = i < A.length ? A[i] : Infinity;
        const bLeft = j >= 1 ? B[j - 1] : -Infinity, bRight = j < B.length ? B[j] : Infinity;
        const clsA = {};
        if (i >= 1) clsA[i - 1] = "hl";
        clsA[Math.min(i, A.length - 1)] = "hot";
        const clsB = {};
        if (j >= 1) clsB[Math.min(j - 1, B.length - 1)] = "hl";
        if (j < B.length) clsB[j] = "hot";
        const sent = [{ type: "array", title: "boundaries  [A[i-1], A[i], B[j-1], B[j]]", data: [isFinite(aLeft) ? aLeft : "-∞", isFinite(aRight) ? aRight : "+∞", isFinite(bLeft) ? bLeft : "-∞", isFinite(bRight) ? bRight : "+∞"], showIdx: false, size: 8 }];
        snap(`Probe i=<b>${i}</b>, j=<b>${j}</b> (i+j=${i + j} = ⌈${total}/2⌉).`, 3, i, j, clsA, clsB, sent);
        if (aLeft <= bRight && bLeft <= aRight) {
          const lmax = Math.max(aLeft, bLeft), rmin = Math.min(aRight, bRight);
          ans = total % 2 ? lmax : (lmax + rmin) / 2;
          const clsM = {}; if (i >= 1) clsM[i - 1] = "done"; clsM[Math.min(i, A.length - 1)] = "done";
          snap(`Balanced! A[i-1]=${isFinite(aLeft) ? aLeft : "-∞"} ≤ B[j]=${isFinite(bRight) ? bRight : "+∞"} and B[j-1] ≤ A[i]. Median = ${ans}.`, 6, i, j, clsM, {}, sent);
          break;
        }
        if (aLeft > bRight) {
          snap(`A[i-1]=${isFinite(aLeft) ? aLeft : "-∞"} > B[j] → cut too far RIGHT in A → search left (hi = i-1).`, 8, i, j, clsA, clsB, sent);
          hi = i - 1;
        } else {
          snap(`A[i] is too small vs B[j-1] → cut too far LEFT → search right (lo = i+1).`, 9, i, j, clsA, clsB, sent);
          lo = i + 1;
        }
      }
      const last = steps[steps.length - 1];
      const expect = (() => { const all = a.concat(b).sort((x, y) => x - y); const k = Math.floor(all.length / 2); return all.length % 2 ? all[k] : (all[k - 1] + all[k]) / 2; })();
      last.result = String(ans);
      last.correct = ans === expect;
      last.memNote = "Time: O(log min(m,n)) probes. Space: O(1).";
      return { steps, result: String(ans), correct: ans === expect, memNote: last.memNote };
    }
  ]
});

/* ================================================================
 * PROBLEM 0033 — SEARCH IN ROTATED SORTED ARRAY
 * ================================================================ */
NC150.register({
  id: "0033", title: "Search in Rotated Sorted Array", difficulty: "Medium",
  url: "https://leetcode.com/problems/search-in-rotated-sorted-array/",
  tags: ["binary search", "rotated array"],
  approaches: ["Approach 1 · Sorted-half discard (best)", "Approach 2 · Find pivot, then plain BS"],
  complexities: [
    { time: "O(log n)", space: "O(1)", note: "BEST — one halving loop" },
    { time: "O(log n)", space: "O(1)", note: "pivot + segment, two loops" }
  ],
  compare: [
    { name: "Sorted-half discard", tech: "test the sorted side of mid", time: "O(log n)", space: "O(1)", when: "general case", best: true },
    { name: "Pivot + segment BS", tech: "find min, restore order", time: "O(log n)", space: "O(1)", when: "clearer two-phase reasoning", best: false }
  ],
  inputs: [
    { name: "nums", label: "nums =", type: "list", default: "[4,5,6,7,0,1,2]" },
    { name: "target", label: "target =", type: "int", default: "0" }
  ],
  examples: [
    { label: "Ex 1", values: { nums: "[4,5,6,7,0,1,2]", target: "0" }, result: "4" },
    { label: "Ex 2", values: { nums: "[4,5,6,7,0,1,2]", target: "3" }, result: "-1" },
    { label: "Ex 3", values: { nums: "[1]", target: "0" }, result: "-1" }
  ],
  realLife: "<p><b>Ring buffers / circular logs</b>: a rotating log file is a sorted array that wraps around; finding an entry means searching a rotated range.</p><p><b>Content delivery</b>: sorted IDs with wrap-around (time-series partitioned by hour) are queried with exactly this 'which half is intact' check.</p>",
  dsDive: `<h3>Rotation breaks monotonicity — the invariant is repaired per half</h3>
<p>Plain BS works because the predicate <span class="code-var">x &lt; target</span> is monotone over the array. One rotation introduces a single break at the pivot:</p>
<div class="equation">[4,5,6,7,0,1,2] &nbsp;=&nbsp; left run (sorted) + right run (sorted)</div>
<p>In ANY window [lo, hi], at least one side of mid is a <b>fully sorted run</b> — check <span class="code-var">nums[lo] ≤ nums[mid]</span> to learn which. On that sorted side the old monotone predicate works again, so you can either take it or discard it, and the other half stays a smaller instance of the same rotated problem. The <span class="code-var">≤</span> in that check is the off-by-one: with a 2-element window mid == lo, and the 1-element left half IS sorted.</p>
<p>Approach 2 instead restores the whole domain: the pivot (the minimum) is the single false→true transition of <span class="code-var">nums[i] &gt; nums[n−1]</span>, found by the 0153 loop; split the array there and both halves are normally sorted.</p>`,
  code: [
    [
      "lo, hi = 0, len(nums) - 1",
      "while lo <= hi:",
      "    mid = lo + (hi - lo) // 2",
      "    if nums[mid] == target: return mid",
      "    if nums[lo] <= nums[mid]:              # LEFT half sorted",
      "        if nums[lo] <= target < nums[mid]:",
      "            hi = mid - 1                   # target in sorted left",
      "        else: lo = mid + 1",
      "    else:                                  # RIGHT half sorted",
      "        if nums[mid] < target <= nums[hi]:",
      "            lo = mid + 1",
      "        else: hi = mid - 1",
      "return -1"
    ],
    [
      "lo, hi = 0, len(nums) - 1              # phase 1: find pivot",
      "while lo < hi:",
      "    mid = lo + (hi - lo) // 2",
      "    if nums[mid] > nums[hi]: lo = mid + 1",
      "    else: hi = mid",
      "pivot = lo                              # index of the minimum",
      "lo = 0 if target >= nums[0] else pivot # phase 2: pick segment",
      "hi = pivot - 1 if target >= nums[0] else len(nums) - 1",
      "while lo <= hi:                         # plain 704 binary search",
      "    mid = lo + (hi - lo) // 2",
      "    if nums[mid] == target: return mid",
      "    if nums[mid] < target: lo = mid + 1",
      "    else: hi = mid - 1",
      "return -1"
    ]
  ],
  steps: [
    function (vals) {
      const nums = vals.nums, target = vals.target;
      const steps = [];
      const snap = (text, code, lo, hi, mid, cls) => {
        const c = Object.assign({}, cls || {});
        if (lo >= 0 && lo < nums.length) c[lo] = c[lo] || "hl";
        if (hi >= 0 && hi < nums.length) c[hi] = c[hi] || "hl";
        if (mid >= 0 && mid < nums.length) c[mid] = c[mid] || "hot";
        steps.push({ text, code, mem: [{ type: "array", title: "nums · lo=hl hi=hl mid=hot", data: nums, cls: c, showIdx: true, size: 4 }] });
      };
      snap("Start: target, if present, lives in [lo, hi]. Each probe: which side of mid is a full sorted run?", 0, 0, nums.length - 1, -1, {});
      let lo = 0, hi = nums.length - 1, found = -1;
      while (lo <= hi) {
        const mid = Math.floor(lo + (hi - lo) / 2);
        const v = nums[mid];
        snap(`Probe mid=<b>${mid}</b> → nums[mid]=<b>${v}</b>.`, 2, lo, hi, mid, {});
        if (v === target) {
          found = mid;
          snap(`<b>${v} == ${target}</b> → hit at index ${mid}!`, 3, lo, hi, mid, { [mid]: "done" });
          break;
        }
        if (nums[lo] <= nums[mid]) {
          snap(`nums[lo]=${nums[lo]} ≤ nums[mid]=${v} → LEFT half [${lo}..${mid}] is sorted.`, 4, lo, hi, mid, {});
          if (nums[lo] <= target && target < v) {
            snap(`target ${target} fits in sorted left [${nums[lo]}..${v}) → hi = ${mid - 1}.`, 5, lo, hi, mid, {});
            hi = mid - 1;
          } else {
            snap(`target ${target} NOT in sorted left → lo = ${mid + 1}.`, 6, lo, hi, mid, {});
            lo = mid + 1;
          }
        } else {
          snap(`nums[lo]=${nums[lo]} > nums[mid]=${v} → RIGHT half [${mid}..${hi}] is sorted.`, 7, lo, hi, mid, {});
          if (v < target && target <= nums[hi]) {
            snap(`target ${target} fits in sorted right (${v}..${nums[hi]}] → lo = ${mid + 1}.`, 8, lo, hi, mid, {});
            lo = mid + 1;
          } else {
            snap(`target ${target} NOT in sorted right → hi = ${mid - 1}.`, 9, lo, hi, mid, {});
            hi = mid - 1;
          }
        }
        if (lo > hi) snap(`Window inverted → every candidate eliminated → <b>-1</b>.`, 10, lo, hi, -1, {});
      }
      const last = steps[steps.length - 1];
      last.result = found === -1 ? "-1" : String(found);
      last.correct = found === nums.indexOf(target);
      last.memNote = "Time: O(log n). Space: O(1).";
      return { steps, result: last.result, correct: last.correct, memNote: last.memNote };
    },
    function (vals) {
      const nums = vals.nums, target = vals.target;
      const steps = [];
      const snap = (text, code, lo, hi, mid, cls) => {
        const c = Object.assign({}, cls || {});
        if (lo >= 0 && lo < nums.length) c[lo] = c[lo] || "hl";
        if (hi >= 0 && hi < nums.length) c[hi] = c[hi] || "hl";
        if (mid >= 0 && mid < nums.length) c[mid] = c[mid] || "hot";
        steps.push({ text, code, mem: [{ type: "array", title: "nums · phase marker in text", data: nums, cls: c, showIdx: true, size: 4 }] });
      };
      snap("Phase 1 — find the PIVOT (minimum) with the 0153 loop: shrink while nums[mid] > nums[hi].", 0, 0, nums.length - 1, -1, {});
      let lo = 0, hi = nums.length - 1;
      while (lo < hi) {
        const mid = Math.floor(lo + (hi - lo) / 2);
        snap(`Probe mid=<b>${mid}</b>: nums[mid]=${nums[mid]} vs nums[hi]=${nums[hi]}.`, 2, lo, hi, mid, {});
        if (nums[mid] > nums[hi]) {
          snap(`${nums[mid]} > ${nums[hi]} → pivot to the RIGHT → lo = ${mid + 1}.`, 3, lo, hi, mid, {});
          lo = mid + 1;
        } else {
          snap(`${nums[mid]} ≤ ${nums[hi]} → mid may BE the pivot → hi = ${mid}.`, 4, lo, hi, mid, {});
          hi = mid;
        }
      }
      const pivot = lo;
      snap(`Pivot = index <b>${pivot}</b> (value ${nums[pivot]}). The array is two sorted segments.`, 5, lo, hi, -1, { [pivot]: "done" });

        { type: "array", title: "total hours", data: [hours], cls: hours <= h ? { [0]: "done" } : { [0]: "hot" }, showIdx: true, size: 8 }
      ]});
      snap("Try k = 1, 2, 3, … and return the first feasible one — identical result, but M sweeps instead of log M.", 0, 1, [], 0);
      const maxP = Math.max.apply(null, piles);
      let ans = maxP;
      for (let k = 1; k <= maxP; k++) {
        const perPile = piles.map(p => ceilDiv(p, k));
        const hours = perPile.reduce((s, x) => s + x, 0);
        if (hours <= h) {
          ans = k;
          snap(`k=<b>${k}</b>: total ${hours} ≤ h=${h} → FEASIBLE → return <b>${k}</b>.`, 2, k, perPile, hours);
          break;
        }
        snap(`k=${k}: total ${hours} > h=${h} → too slow, try next.`, 1, k, perPile, hours);
      }
      const last = steps[steps.length - 1];
      const brute = (() => { for (let k = 1; k <= maxP; k++) { const t = piles.reduce((s, p) => s + ceilDiv(p, k), 0); if (t <= h) return k; } return maxP; })();
      last.result = String(ans);
      last.correct = ans === brute;
      last.memNote = "Time: O(n·M) — contrast only. Space: O(1).";
      return { steps, result: String(ans), correct: ans === brute, memNote: last.memNote };
    }
  ]
});
