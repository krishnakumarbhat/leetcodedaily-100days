<script>
const SECTION = { id: "07", title: "Trees" };
const U = window.NC150.utils;

/* tree helpers shared by all animators */
function tn(v, l, r) { const n = new U.TreeNode(v); n.left = l || null; n.right = r || null; return n; }
let _nid = 1;
function assignIds(node) { if (!node) return; node.id = _nid++; assignIds(node.left); assignIds(node.right); }
/* build a binary tree from level-order list (null = missing child) */
function buildLevelOrder(arr) {
  if (!arr.length) return null;
  const root = tn(arr[0]);
  const q = [root];
  let i = 1;
  while (q.length && i < arr.length) {
    const n = q.shift();
    if (i < arr.length && arr[i] !== null) { n.left = tn(arr[i]); q.push(n.left); }
    i++;
    if (i < arr.length && arr[i] !== null) { n.right = tn(arr[i]); q.push(n.right); }
    i++;
  }
  return root;
}
/* collect node values in DFS order: 'pre' | 'in' | 'post' */
function dfsValues(node, order, acc) {
  if (!node) return acc;
  if (order === "pre") acc.push(node.val);
  dfsValues(node.left, order, acc);
  if (order === "in") acc.push(node.val);
  dfsValues(node.right, order, acc);
  if (order === "post") acc.push(node.val);
  return acc;
}
function treeView(root, hl, title) {
  return { type: "tree", root, hl: hl || [], title: title || "binary tree" };
}
</script>

<script>
/* ================================================================
 * PROBLEM 0098 — VALIDATE BINARY SEARCH TREE
 * ================================================================ */
NC150.register({
  id: "0098", title: "Validate Binary Search Tree", difficulty: "Medium",
  url: "https://leetcode.com/problems/validate-binary-search-tree/",
  tags: ["tree", "DFS", "BST"],
  approaches: ["Approach 1 · Range recursion (best)", "Approach 2 · Inorder check"],
  complexities: [
    { time: "O(n)", space: "O(h)", note: "BEST — one pass, carries (lo,hi) range" },
    { time: "O(n)", space: "O(n)", note: "inorder must be strictly ascending" }
  ],
  compare: [
    { name: "Naive child check", tech: "only compare to parent", time: "O(n)", space: "O(h)", when: "never — misses grandparent bounds", best: false },
    { name: "Range recursion", tech: "carry (lo,hi) bounds", time: "O(n)", space: "O(h)", when: "general case", best: true },
    { name: "Inorder sequence", tech: "sorted check", time: "O(n)", space: "O(n)", when: "tree already traversed anyway", best: false }
  ],
  inputs: [
    { name: "values", label: "level order (null = missing) =", type: "list", default: "[2,1,3]" }
  ],
  examples: [
    { label: "Ex 1", values: { values: "[2,1,3]" }, result: "true" },
    { label: "Ex 2 (trap)", values: { values: "[5,1,4,null,null,3,6]" }, result: "false — 3 < 5" },
    { label: "Left > root", values: { values: "[5,4,6,null,null,3,7]" }, result: "false — 3 < 5" }
  ],
  realLife: "<p>Every ordered index — a database's <b>B-tree</b>, a file system's sorted directory — relies on the BST invariant to answer \"is X present?\" in O(log n). Validating the invariant catches corrupted indexes before a lookup silently returns garbage.</p>",
  dsDive: `<h3>The classic trap</h3>
<p>Checking <code>left.val < node.val < right.val</code> is NOT enough: in <b>[5,1,4,null,null,3,6]</b> the node <b>3</b> is the right child of <b>4</b>, but it must ALSO be <b>greater than 5</b> (its grandparent). Correct algorithm: recursion carries a range — every node must lie in <b>(lo, hi)</b>, and each child narrows the range:</p>
<div class="equation">left child of v must satisfy (lo, v.val) &nbsp;|&nbsp; right child must satisfy (v.val, hi)</div>
<p>Alternative: an <b>inorder traversal</b> of a BST yields a strictly ascending sequence — validate the sequence instead. Both are O(n); recursion costs the implicit call stack (height h), the sequence costs O(n) extra memory.</p>`,
  code: [
    "def isValidBST(root, lo=-inf, hi=+inf):   # carry allowed range",
    "    if not root: return True              # empty subtree is valid",
    "    if not (lo < root.val < hi): return False  # out of range → invalid",
    "    left  = isValidBST(root.left,  lo, root.val)   # narrow upper bound",
    "    right = isValidBST(root.right, root.val, hi)   # narrow lower bound",
    "    return left and right                # both sides must hold"
  ],
  steps: [
    function (vals) {
      _nid = 1;
      const root = buildLevelOrder(vals.values);
      assignIds(root);
      const steps = [];
      const snap = (text, code, hl, extra) => steps.push({ text, code, mem: [
        treeView(root, hl, "BST validation · range (lo, hi) shrinks on every descent"),
        Object.assign({ type: "array", title: "allowed range", data: ["lo", "hi"], cls: { 0: "hl", 1: "hl" }, size: 8 }, extra || {})
      ]});
      let valid = true, n = 0;
      snap("Start at root with the widest range (−∞, +∞). Every node must fit its range.", 1, [], {});
      const stack = [[root, -Infinity, Infinity]];
      while (stack.length) {
        const [node, lo, hi] = stack.pop();
        if (!node) continue;
        n++;
        if (!(lo < node.val && node.val < hi)) {
          snap(`✗ Node <b>${node.val}</b> must be in (${lo === -Infinity ? "−∞" : lo}, ${hi === Infinity ? "+∞" : hi}) — it is OUT OF RANGE → invalid BST.`, 3, [node.id], {});
          valid = false;
          break;
        }
        snap(`Node <b>${node.val}</b> ∈ (${lo === -Infinity ? "−∞" : lo}, ${hi === Infinity ? "+∞" : hi}) ✓. Push right (narrow lo→${node.val}) then left (narrow hi→${node.val}).`, 2, [node.id], {});
        if (node.right) stack.push([node.right, node.val, hi]);
        if (node.left) stack.push([node.left, lo, node.val]);
      }
      const last = steps[steps.length - 1];
      last.result = String(valid);
      last.correct = true;
      last.memNote = `Checked ${n} node(s). Time O(n), space O(h) call stack.`;
      return { steps, result: String(valid), correct: true, memNote: last.memNote };
    },
    function (vals) {
      _nid = 1;
      const root = buildLevelOrder(vals.values);
      assignIds(root);
      const steps = [];
      const seq = [];
      const snap = (text, code, hl, data) => steps.push({ text, code, mem: [
        treeView(root, hl, "inorder traversal"),
        { type: "array", title: "inorder sequence", data: seq.slice(), showIdx: true, size: 4 }
      ]});
      snap("Inorder (left → node → right) of a BST is STRICTLY ascending. Walk it and check.", 0, [], seq.slice());
      let valid = true;
      const stack = [];
      let node = root, prev = -Infinity;
      while (stack.length || node) {
        while (node) {
          stack.push(node);
          node = node.left;
        }
        node = stack.pop();
        seq.push(node.val);
        if (node.val <= prev) {
          snap(`✗ <b>${node.val}</b> ≤ previous <b>${prev}</b> — sequence is not strictly ascending → invalid.`, 0, [node.id], seq.slice());
          valid = false;
          break;
        }
        snap(`Visit <b>${node.val}</b> (prev=${prev === -Infinity ? "−∞" : prev}) → ascending so far ✓.`, 0, [node.id], seq.slice());
        prev = node.val;
        node = node.right;
      }
      const last = steps[steps.length - 1];
      last.result = String(valid);
      last.correct = true;
      last.memNote = "Time O(n), space O(n) for the sequence.";
      return { steps, result: String(valid), correct: true, memNote: last.memNote };
    }
  ]
});
</script>

<script>
/* ================================================================
 * PROBLEM 0100 — SAME TREE
 * ================================================================ */
NC150.register({
  id: "0100", title: "Same Tree", difficulty: "Easy",
  url: "https://leetcode.com/problems/same-tree/",
  tags: ["tree", "DFS", "recursion"],
  approaches: ["Approach 1 · Recursive pair check (best)", "Approach 2 · Iterative queue (BFS)"],
  complexities: [
    { time: "O(n)", space: "O(h)", note: "BEST — recursion on both trees at once" },
    { time: "O(n)", space: "O(w)", note: "BFS frontier, worst-case full last level" }
  ],
  compare: [
    { name: "Serialize + compare", tech: "stringify both", time: "O(n)", space: "O(n)", when: "comparing many cached trees", best: false },
    { name: "Recursive pair check", tech: "check both roots, recurse pairs", time: "O(n)", space: "O(h)", when: "general case", best: true },
    { name: "Iterative BFS queue", tech: "level-by-level pair check", time: "O(n)", space: "O(w)", when: "avoid deep recursion", best: false }
  ],
  inputs: [
    { name: "p", label: "tree p (level order) =", type: "list", default: "[1,2,3]" },
    { name: "q", label: "tree q (level order) =", type: "list", default: "[1,2,3]" }
  ],
  examples: [
    { label: "Ex 1 (same)", values: { p: "[1,2,3]", q: "[1,2,3]" }, result: "true" },
    { label: "Ex 2 (diff)", values: { p: "[1,2]", q: "[1,null,2]" }, result: "false" },
    { label: "Ex 3 (diff)", values: { p: "[1,2,1]", q: "[1,1,2]" }, result: "false" }
  ],
  realLife: "<p>Git compares two trees of file hashes to find which branches differ; compilers compare ASTs to detect duplicated code; snapshot testers compare DOM trees. All use the same simultaneous traversal.</p>",
  dsDive: `<h3>Two pointers, two trees</h3>
<p>The insight is to recurse on <b>PAIRS</b>: is (p,q) equal as roots AND (p.left, q.left) equal AND (p.right, q.right) equal? The recursion visits each pair once → O(n) with n = size of the smaller tree. The call stack depth equals tree height h.</p>
<div class="equation">same(p, q) = p.val == q.val ∧ same(p.left, q.left) ∧ same(p.right, q.right)</div>
<p>The iterative version simulates the same recursion with a queue of pairs (BFS) — identical logic, but memory is the frontier width w instead of height h.</p>`,
  code: [
    "def isSameTree(p, q):",
    "    if not p and not q: return True      # both empty → equal",
    "    if not p or not q: return False      # one empty → different",
    "    if p.val != q.val: return False      # roots differ → different",
    "    return (isSameTree(p.left, q.left) and   # compare left pairs",
    "            isSameTree(p.right, q.right))    # compare right pairs"
  ],
  steps: [
    function (vals) {
      _nid = 1;
      const p = buildLevelOrder(vals.p);
      const q = buildLevelOrder(vals.q);
      assignIds(p); assignIds(q);
      const steps = [];
      const snap = (text, hlP, hlQ) => steps.push({ text, code: 0, mem: [
        treeView(p, hlP, "tree p"),
        treeView(q, hlQ, "tree q")
      ]});
      let same = true, checked = 0;
      snap("Start: compare both roots.", 0, []);
      const stack = [[p, q]];
      while (stack.length) {
        const [a, b] = stack.pop();
        if (!a && !b) continue;
        if (!a || !b || a.val !== b.val) {
          const hlA = a ? [a.id] : []; const hlB = b ? [b.id] : [];
          snap(`✗ Node <b>${a ? a.val : "∅"}</b> vs <b>${b ? b.val : "∅"}</b> — structure or value differs → not the same tree.`, hlA, hlB);
          same = false;
          break;
        }
        checked++;
        snap(`<b>${a.val}</b> == <b>${b.val}</b> ✓ → push pairs (left,left) and (right,right).`, [a.id], [b.id]);
        stack.push([a.right, b.right]);
        stack.push([a.left, b.left]);
      }
      const last = steps[steps.length - 1];
      last.result = String(same);
      last.correct = true;
      last.memNote = `Matched ${checked} node pair(s). Time O(n), space O(h).`;
      return { steps, result: String(same), correct: true, memNote: last.memNote };
    },
    function (vals) {
      _nid = 1;
      const p = buildLevelOrder(vals.p);
      const q = buildLevelOrder(vals.q);
      assignIds(p); assignIds(q);
      const steps = [];
      const snap = (text, hlP, hlQ, qData) => steps.push({ text, code: 0, mem: [
        treeView(p, hlP, "tree p"),
        treeView(q, hlQ, "tree q"),
        { type: "queue", title: "pair frontier (BFS)", data: qData, front: 0, rear: qData.length - 1 }
      ]});
      let same = true, checked = 0;
      snap("BFS: seed the queue with the root pair.", 0, [], ["p|q"]);
      const queue = [[p, q]];
      while (queue.length) {
        const [a, b] = queue.shift();
        if (!a && !b) continue;
        if (!a || !b || a.val !== b.val) {
          snap(`✗ <b>${a ? a.val : "∅"}</b> vs <b>${b ? b.val : "∅"}</b> mismatch at this level → false.`, a ? [a.id] : [], b ? [b.id] : [], []);
          same = false;
          break;
        }
        checked++;
        queue.push([a.left, b.left]);
        queue.push([a.right, b.right]);
        snap(`<b>${a.val}</b> == <b>${b.val}</b> ✓ · enqueue (left,left) and (right,right).`, [a.id], [b.id], queue.map(x => x[0] ? x[0].val + "|" + (x[1] ? x[1].val : "∅") : "∅|∅"));
      }
      const last = steps[steps.length - 1];
      last.result = String(same);
      last.correct = true;
      last.memNote = `Matched ${checked} pair(s). Time O(n), space O(w) frontier.`;
      return { steps, result: String(same), correct: true, memNote: last.memNote };
    }
  ]
});
</script>

<script>
/* ================================================================
 * PROBLEM 0102 — BINARY TREE LEVEL ORDER TRAVERSAL
 * ================================================================ */
NC150.register({
  id: "0102", title: "Binary Tree Level Order Traversal", difficulty: "Medium",
  url: "https://leetcode.com/problems/binary-tree-level-order-traversal/",
  tags: ["tree", "BFS", "queue"],
  approaches: ["Approach 1 · BFS with queue (best)", "Approach 2 · DFS with depth"],
  complexities: [
    { time: "O(n)", space: "O(n)", note: "BEST — every node once, frontier ≤ width" },
    { time: "O(n)", space: "O(h) + O(n) result", note: "DFS appends to level by depth" }
  ],
  compare: [
    { name: "BFS queue", tech: "process a whole level per loop", time: "O(n)", space: "O(w)", when: "level-by-level order needed", best: true },
    { name: "DFS with depth", tech: "recursion + levels[depth].append", time: "O(n)", space: "O(h)", when: "already doing DFS anyway", best: false }
  ],
  inputs: [
    { name: "values", label: "level order (null = missing) =", type: "list", default: "[3,9,20,null,null,15,7]" }
  ],
  examples: [
    { label: "Ex 1", values: { values: "[3,9,20,null,null,15,7]" }, result: "[[3],[9,20],[15,7]]" },
    { label: "Ex 2", values: { values: "[1]" }, result: "[[1]]" },
    { label: "Ex 3", values: { values: "[]" }, result: "[]" }
  ],
  realLife: "<p>Level order is the <b>breadth-first</b> view of a tree: finding the closest matching server in a network hierarchy, crawling a social graph by distance, or rendering a scene graph top-down. BFS = always visit by distance from the root.</p>",
  dsDive: `<h3>Why the queue's length matters</h3>
<p>The trick: at the start of each loop iteration, <code>q.length</code> is EXACTLY the number of nodes in the current level. Dequeue that many nodes → all their children form the next level. This is why a plain FIFO queue implements breadth-first order for free.</p>
<div class="equation">level<sub>k+1</sub> = children(level<sub>k</sub>) &nbsp;·&nbsp; FIFO keeps levels contiguous</div>
<p>DFS alternative: carry <code>depth</code> in the recursion and append to <code>levels[depth]</code> — visits nodes in a different order but fills the same buckets. BFS costs O(w) frontier memory (a full last level has ~n/2 nodes), DFS costs O(h) call stack.</p>`,
  code: [
    "def levelOrder(root):",
    "    if not root: return []",
    "    res, q = [], deque([root])",
    "    while q:",
    "        level = []",
    "        for _ in range(len(q)):      # len(q) = nodes of THIS level",
    "            node = q.popleft()",
    "            level.append(node.val)",
    "            if node.left:  q.append(node.left)",
    "            if node.right: q.append(node.right)",
    "        res.append(level)",
    "    return res"
  ],
  steps: [
    function (vals) {
      _nid = 1;
      const root = buildLevelOrder(vals.values);
      assignIds(root);
      const steps = [];
      const res = [];
      const snap = (text, hl, qData, level) => steps.push({ text, code: 0, mem: [
        treeView(root, hl, "tree · BFS sweep"),
        { type: "queue", title: "BFS queue", data: qData, front: 0, rear: qData.length - 1 },
        { type: "array", title: "levels collected", data: res.map(l => "[" + l.join(",") + "]").concat(level ? ["<b>" + level.join(",") + "</b>"] : []), showIdx: true, size: 8 }
      ]});
      if (!root) {
        snap("Empty tree → result is [].", 0, [], []);
        const last = steps[steps.length - 1];
        last.result = "[]"; last.correct = true; last.memNote = "O(1).";
        return { steps, result: "[]", correct: true, memNote: "O(1)." };
      }
      const q = [root];
      snap("Seed queue with root. q.length = 1 = nodes in level 0.", 0, [root.id], []);
      while (q.length) {
        const level = [];
        const n = q.length;
        for (let i = 0; i < n; i++) {
          const node = q.shift();
          level.push(node.val);
          if (node.left) q.push(node.left);
          if (node.right) q.push(node.right);
          snap(`Pop <b>${node.val}</b> → collect into current level. Enqueue its children.`, [node.id], q.map(x => x.val), level);
        }
        res.push(level);
        snap(`Level done → <b>[${level.join(", ")}]</b> appended. q now holds next level (${q.length} nodes).`, [], q.map(x => x.val), []);
      }
      const last = steps[steps.length - 1];
      last.result = JSON.stringify(res);
      last.correct = true;
      last.memNote = "Time O(n), space O(n) (frontier + result).";
      return { steps, result: JSON.stringify(res), correct: true, memNote: last.memNote };
    },
    function (vals) {
      _nid = 1;
      const root = buildLevelOrder(vals.values);
      assignIds(root);
      const steps = [];
      const res = [];
      const snap = (text, hl, depthInfo) => steps.push({ text, code: 0, mem: [
        treeView(root, hl, "tree · DFS pre-order with depth"),
        { type: "array", title: "levels (by depth bucket)", data: res.map((l, i) => "L" + i + ":[" + l.join(",") + "]"), showIdx: true, size: 8 }
      ]});
      snap("DFS pre-order with a depth counter: each node lands in levels[depth].", 0, "depth 0");
      const stack = [[root, 0]];
      while (stack.length) {
        const [node, d] = stack.pop();
        if (!res[d]) res[d] = [];
        res[d].push(node.val);
        snap(`Visit <b>${node.val}</b> at depth <b>${d}</b> → append to level ${d}.`, [node.id], "depth " + d);
        if (node.right) stack.push([node.right, d + 1]);
        if (node.left) stack.push([node.left, d + 1]);
      }
      const last = steps[steps.length - 1];
      last.result = JSON.stringify(res);
      last.correct = true;
      last.memNote = "Time O(n), space O(h) stack + O(n) result.";
      return { steps, result: JSON.stringify(res), correct: true, memNote: last.memNote };
    }
  ]
});

  ],
  realLife: "<p>Balanced = the tree stays shallow → every lookup stays O(log n). Self-balancing structures — <b>AVL trees, red-black trees (std::map), B-trees in databases</b> — rebalance automatically after inserts so worst-case paths stay logarithmic.</p>",
  dsDive: `<h3>One pass, two answers</h3>
<p>Height(v) = 1 + max(height(L), height(R)) — same formula as max depth. Balanced(v) additionally requires |height(L) − height(R)| ≤ 1 everywhere. The -1 sentinel packs both answers into one return value: a subtree reports its height, or <b>-1</b> if unbalanced (its parent then propagates -1 without extra work).</p>
<div class="equation">h(v) = 1 + max(h(L), h(R)) · balanced(v) = |h(L) − h(R)| ≤ 1 ∧ balanced(L) ∧ balanced(R)</div>
<p>Top-down alternative recomputes heights from the root on every level → O(n²) worst case (skewed tree). Post-order computes each height exactly once → O(n).</p>`,
  code: [
    "def isBalanced(root):",
    "    def height(node):",
    "        if not node: return 0",
    "        l = height(node.left)     # -1 means left subtree unbalanced",
    "        if l == -1: return -1     # propagate failure",
    "        r = height(node.right)",
    "        if r == -1: return -1",
    "        if abs(l - r) > 1: return -1   # THIS node unbalanced",
    "        return 1 + max(l, r)",
    "    return height(root) != -1"

      _nid = 1;

      const stack = [[root, false]];
      while (stack.length && balanced) {
        const [node, done] = stack[stack.length - 1];

          stack[stack.length - 1][1] = true;

      assignIds(root);
      const steps = [];

        Object.assign({ type: "array", title: "visited", data: [], showIdx: true, size: 4 }, extra || {})
      ]});
      let balanced = true, visited = 0;
      const heightOf = (node, path) => {
        if (!node) return 0;
        visited++;
        path.push(node.id);
        return 1 + Math.max(heightOf(node.left, path), heightOf(node.right, path));

          break;

        stack.push(node.right);
        stack.push(node.left);
      }
      const last = steps[steps.length - 1];
      last.result = String(balanced);
      last.correct = true;
      last.memNote = "Time O(n²) worst (skewed tree), space O(h).";
      return { steps, result: String(balanced), correct: true, memNote: last.memNote };

<p>A path through a node v can join: the best path <b>below-left</b>, v itself, and the best path <b>below-right</b>. The subtlety: a path cannot fork — it can only pass through ONE child side on its way up. So each node reports its <b>gain</b>: the best sum of a path ENDING at v and going DOWN (v + max(0, leftGain, rightGain)) — negative gains are dropped with max(0, ·) because a lone node beats a negative prefix.</p>

    "        nonlocal best",
    "        if not node: return 0",
    "        l = max(0, gain(node.left))     # discard negative branches",
    "        r = max(0, gain(node.right))",
    "        best = max(best, node.val + l + r)   # path peaking here",

      const last = steps[steps.length - 1];
      last.result = String(count);
      last.correct = true;
      last.memNote = "Time O(n), space O(h).";
      return { steps, result: String(count), correct: true, memNote: last.memNote };
    },
    function (vals) {
      _nid = 1;
      const root = buildLevelOrder(vals.values);
      assignIds(root);
      const steps = [];
      let count = 0;
      const snap = (text, hl, stackData) => steps.push({ text, code: 0, mem: [
        treeView(root, hl, "iterative: stack frames carry (node, maxSoFar)"),
        { type: "stack", title: "explicit stack", data: stackData, top: stackData.length - 1 }
      ]});
      snap("Same logic without recursion: each stack frame remembers its own max-so-far.", 0, []);
      const stack = [[root, -Infinity]];
      while (stack.length) {
        const [node, mx] = stack.pop();
        if (!node) continue;
        if (node.val >= mx) {
          count++;
          snap(`<b>${node.val}</b> ≥ ${mx === -Infinity ? "−∞" : mx} → GOOD (${count} so far).`, [node.id], stack.map(x => x[0].val + "|" + (x[1] === -Infinity ? "−∞" : x[1])));
        } else {
          snap(`<b>${node.val}</b> < ${mx} → not good.`, [node.id], stack.map(x => x[0].val + "|" + (x[1] === -Infinity ? "−∞" : x[1])));
        }
        const nm = Math.max(mx, node.val);
        if (node.right) stack.push([node.right, nm]);
        if (node.left) stack.push([node.left, nm]);
      }
      const last = steps[steps.length - 1];
      last.result = String(count);
      last.correct = true;
      last.memNote = "Time O(n), space O(h) stack.";
      return { steps, result: String(count), correct: true, memNote: last.memNote };
    }
  ]
});
